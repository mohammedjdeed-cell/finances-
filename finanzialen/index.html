    const LanguageContext = createContext();
    function LanguageProvider({ children }) {
      const [lang, setLang] = useState(() => safeStorage.get('budget_app_lang', 'en'));
      const changeLanguage = (l) => { setLang(l); safeStorage.set('budget_app_lang', l); };
      const t = (path, params = {}) => {
        let res = translations[lang];
        for (const k of path.split('.')) {
          if (res && res[k] !== undefined) res = res[k];
          else { res = translations['en']?.[path] || path; break; }
        }
        if (typeof res === 'string') {
          Object.keys(params).forEach(p => { res = res.replace(new RegExp(`{{${p}}}`, 'g'), params[p]); });
        }
        return res;
      };
      return <LanguageContext.Provider value={{ t, lang, changeLanguage }}>{children}</LanguageContext.Provider>;
    }
    const useTranslation = () => useContext(LanguageContext);

    const IDB = {
      dbName: 'LiquidCashflow_v8',
      open() {
        return new Promise((res, rej) => {
          const r = indexedDB.open(this.dbName, 1);
          r.onupgradeneeded = (e) => e.target.result.createObjectStore('store', { keyPath: 'id' });
          r.onsuccess = () => res(r.result);
          r.onerror = () => rej(r.error);
        });
      },
      async get(k) {
        try {
          const db = await this.open();
          return new Promise(res => {
            const tx = db.transaction('store', 'readonly');
            const req = tx.objectStore('store').get(k);
            req.onsuccess = () => res(req.result?.data);
            req.onerror = () => res(null);
          });
        } catch(e) { return null; }
      },
      async set(k, data) {
        try {
          const db = await this.open();
          return new Promise((res, rej) => {
            const tx = db.transaction('store', 'readwrite');
            tx.objectStore('store').put({ id: k, data });
            tx.oncomplete = () => res(true);
            tx.onerror = () => rej(tx.error);
          });
        } catch(e) {}
      }
    };

    // Smooth migration: Converts any legacy weekly format ({w1, w2..}) or raw numbers to {budget, actual, asOfDate}
    const normalizeState = (raw) => {
      const state = {
        startingCapital: typeof raw?.startingCapital === 'number' ? raw.startingCapital : 0,
        categories: {
          incomes: [...(raw?.categories?.incomes || INITIAL_CATEGORIES.incomes)],
          expenses: [...(raw?.categories?.expenses || INITIAL_CATEGORIES.expenses)]
        },
        categoryOverrides: { ...(raw?.categoryOverrides || {}) },
        categoryModes: { ...(raw?.categoryModes || {}) },
        fixedPaymentDays: { ...(raw?.fixedPaymentDays || {}) },
        categoryOneTime: { ...(raw?.categoryOneTime || { "Hause kaution": true, "FSP exam registration": true, "furniture from Vormieter": true }) },
        ious: raw?.ious || [],
        values: {}
      };

      // Set defaults for categories
      state.categories.expenses.forEach(cat => {
        if (!state.categoryModes[cat]) state.categoryModes[cat] = autoClassifyCategory(cat).mode;
        if (state.categoryOneTime[cat] === undefined) state.categoryOneTime[cat] = autoClassifyCategory(cat).isOneTime;
      });
      state.categories.incomes.forEach(cat => {
        if (!state.categoryModes[cat]) state.categoryModes[cat] = (cat.includes("side") || cat.includes("Sonstiges")) ? 'variable' : 'fixed';
      });

      // Populate years
      ["2026", "2027", "2028"].forEach(y => {
        const yNum = parseInt(y);
        state.values[y] = { incomes: {}, expenses: {} };
        const months = getMonthsForYear(yNum);

        ['incomes', 'expenses'].forEach(type => {
          state.categories[type].forEach(cat => {
            state.values[y][type][cat] = {};
            months.forEach(m => {
              const old = raw?.values?.[y]?.[type]?.[cat]?.[m];
              const monthDays = getDaysInMonth(yNum, m);

              if (typeof old === 'object' && old !== null) {
                if (old.w1 !== undefined || old.w2 !== undefined || old.w3 !== undefined) {
                  const sumWeekly = (parseFloat(old.w1)||0) + (parseFloat(old.w2)||0) + (parseFloat(old.w3)||0) + (parseFloat(old.w4)||0) + (parseFloat(old.w5)||0);
                  state.values[y][type][cat][m] = { budget: sumWeekly, actual: sumWeekly, asOfDate: monthDays };
                } else {
                  state.values[y][type][cat][m] = {
                    budget: typeof old.budget === 'number' ? old.budget : (parseFloat(old.total) || 0),
                    actual: typeof old.actual === 'number' ? old.actual : (parseFloat(old.total) || 0),
                    asOfDate: typeof old.asOfDate === 'number' ? old.asOfDate : monthDays
                  };
                }
              } else if (typeof old === 'number') {
                state.values[y][type][cat][m] = { budget: old, actual: old, asOfDate: monthDays };
              } else {
                state.values[y][type][cat][m] = { budget: 0, actual: 0, asOfDate: monthDays };
              }
            });
          });
        });
      });
      return state;
    };

      const [editCatNameInput, setEditCatNameInput] = useState("");
      const [recurringModal, setRecurringModal] = useState(null);
      const [recurringCount, setRecurringCount] = useState(6);

      // Category inputs
      const [newIncomeName, setNewIncomeName] = useState("");
      const [newExpenseName, setNewExpenseName] = useState("");

      // IOU
      const [iouPerson, setIouPerson] = useState("");
      const [iouAmount, setIouAmount] = useState("");

      const chartRef = useRef(null);
      const chartInstanceRef = useRef(null);
      const annualChartRef = useRef(null);
      const annualChartInstanceRef = useRef(null);
      const fileInputRef = useRef(null);

      // Theme toggle
      useEffect(() => {
        safeStorage.set('budget_app_theme', theme);
        const root = document.documentElement;
        const res = theme === 'system' ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : theme;
        root.setAttribute('data-theme', res);
        if (res === 'dark') root.classList.add('dark');
        else root.classList.remove('dark');
      }, [theme]);

      useEffect(() => {
        safeStorage.set('budget_hide_zeroes', hideZeroes ? 'true' : 'false');
      }, [hideZeroes]);

      // Online status
      useEffect(() => {
        const on = () => setIsOnline(true);
        const off = () => setIsOnline(false);
        window.addEventListener('online', on);
        window.addEventListener('offline', off);
        return () => { window.removeEventListener('online', on); window.removeEventListener('offline', off); };
      }, []);

      // DB Sync
      useEffect(() => {
        (async () => {
          const cached = await IDB.get('app_state');
          if (cached) setData(normalizeState(cached));
        })();

        let unsub = () => {};
        if (db) {
          unsub = db.collection('monthly_logs').doc('house_finanzen_state').onSnapshot(async (doc) => {
            if (doc.exists) {
              const remote = doc.data();
              const merged = normalizeState(remote.payload);
              setData(merged);
              await IDB.set('app_state', merged);
              setSyncStatus("synced");
            }
          }, () => setSyncStatus("offline"));
        }
        return () => unsub();
      }, []);

      const saveState = async (updated) => {
        setData(updated);
        await IDB.set('app_state', updated);
        if (navigator.onLine && db) {
          setSyncStatus("syncing");
          try {
            await db.collection('monthly_logs').doc('house_finanzen_state').set({ payload: updated, updatedAt: Date.now() });
            setSyncStatus("synced");
          } catch(e) { setSyncStatus("offline"); }
        } else {
          setSyncStatus("offline");
        }
      };

      const fmt = (v) => new Intl.NumberFormat(lang === 'de' ? 'de-DE' : 'en-US', {
        style: 'currency', currency: 'EUR', maximumFractionDigits: 0
      }).format(v || 0);

      const getNode = (type, cat, yr, m) => {
        return data.values[yr]?.[type]?.[cat]?.[m] || { budget: 0, actual: 0, asOfDate: getDaysInMonth(yr, m) };
      };

      const updateNode = async (type, cat, yr, m, field, val) => {
        const copy = JSON.parse(JSON.stringify(data));
        if (!copy.values[yr][type][cat]) copy.values[yr][type][cat] = {};
        if (!copy.values[yr][type][cat][m]) {
          copy.values[yr][type][cat][m] = { budget: 0, actual: 0, asOfDate: getDaysInMonth(yr, m) };
        }
        const num = parseFloat(val);
        copy.values[yr][type][cat][m][field] = isNaN(num) ? 0 : num;
        await saveState(copy);
      };

      // 🧠 DYNAMIC FORWARD TIMELINE ENGINE
      const forwardTimeline = useMemo(() => {
        let runningBalance = data.startingCapital || 0;
        const timeline = [];
        const years = [2026, 2027, 2028];

        years.forEach(yr => {
          const months = getMonthsForYear(yr);
          months.forEach(m => {
            const daysInMonth = getDaysInMonth(yr, m);
            let budgetIn = 0, actualIn = 0;
            let budgetEx = 0, actualEx = 0;
            let projectedEx = 0;

            data.categories.incomes.forEach(cat => {
              const node = getNode('incomes', cat, yr, m);
              budgetIn += node.budget;
              actualIn += node.actual;
            });

            data.categories.expenses.forEach(cat => {
              const node = getNode('expenses', cat, yr, m);
              const mode = data.categoryModes[cat] || 'variable';
              const isOneTime = data.categoryOneTime[cat];
              budgetEx += node.budget;
              actualEx += node.actual;

              if (mode === 'fixed' || isOneTime) {
                projectedEx += (node.actual > 0 ? node.actual : node.budget);
              } else {
                const asOf = Math.min(daysInMonth, Math.max(1, node.asOfDate || daysInMonth));
                if (node.actual > 0) {
                  const burn = node.actual / asOf;
                  const remainDays = Math.max(0, daysInMonth - asOf);
                  projectedEx += (node.actual + (burn * remainDays));
                } else {
                  projectedEx += node.budget;
                }
              }
            });

            const effectiveIn = actualIn > 0 ? actualIn : budgetIn;
            const actualNet = actualIn - actualEx;
            const projectedNet = effectiveIn - projectedEx;

            // Rollover logic: if actual spend is logged, roll over projected net; otherwise use budgeted net
            const monthNetRollover = actualEx > 0 ? projectedNet : (budgetIn - budgetEx);
            const startBal = runningBalance;
            runningBalance += monthNetRollover;

            timeline.push({
              year: yr,
              month: m,
              key: `${m} ${yr}`,
              daysInMonth,
              budgetIn, actualIn,
              budgetEx, actualEx,
              projectedEx,
              actualNet,
              projectedNet,
              startBal,
              endProjectedBalance: runningBalance
            });
          });
        });
        return timeline;
      }, [data]);

      const currentMetrics = useMemo(() => {
        if (selectedMonth === "AnnualOverview") return forwardTimeline[0];
        const match = forwardTimeline.find(t => t.year === selectedYear && t.month === selectedMonth);
        return match || forwardTimeline[0];
      }, [forwardTimeline, selectedYear, selectedMonth]);

      // Category level detailed analytics for active month
      const categoryAnalytics = useMemo(() => {
        if (selectedMonth === "AnnualOverview") return [];
        const daysInMonth = currentMetrics.daysInMonth;

        return data.categories.expenses.map(cat => {
          const node = getNode('expenses', cat, selectedYear, selectedMonth);
          const mode = data.categoryModes[cat] || 'variable';
          const isOneTime = !!data.categoryOneTime[cat];
          const asOf = Math.min(daysInMonth, Math.max(1, node.asOfDate || daysInMonth));
          const daysLeft = Math.max(0, daysInMonth - asOf);

          const expectedPace = (node.budget / daysInMonth) * asOf;
          const remainingBudget = node.budget - node.actual;
          const safeDailySpend = daysLeft > 0 ? Math.max(0, remainingBudget / daysLeft) : 0;

          let paceStatus = "ontrack";
          if (mode === 'variable' && node.budget > 0) {
            if (node.actual > expectedPace * 1.08) paceStatus = "over";
            else if (node.actual < expectedPace * 0.85) paceStatus = "frugal";
          }

          let projectedTotal = node.budget;
          if (mode === 'fixed' || isOneTime) {
            projectedTotal = node.actual > 0 ? node.actual : node.budget;
          } else if (node.actual > 0) {
            projectedTotal = node.actual + ((node.actual / asOf) * daysLeft);
          }

          return {
            category: cat,
            budget: node.budget,
            actual: node.actual,
            asOfDate: asOf,
            daysLeft,
            remainingBudget,
            safeDailySpend,
            projectedTotal,
            paceStatus,
            bracket: data.categoryOverrides[cat] || autoClassifyCategory(cat).bracket,
            mode,
            isOneTime
          };
        });
      }, [data, selectedYear, selectedMonth, currentMetrics]);

      // IOUs
      const activeIous = useMemo(() => (data.ious || []).filter(i => !i.settled), [data.ious]);
      const totalIou = useMemo(() => activeIous.reduce((s, i) => s + (parseFloat(i.amount) || 0), 0), [activeIous]);

      const handleAddIou = async () => {
        if (!iouPerson.trim() || !iouAmount || isNaN(parseFloat(iouAmount))) return;
        const copy = { ...data, ious: [...(data.ious || []), {
          id: 'iou_' + Date.now(),
          person: iouPerson.trim(),
          amount: parseFloat(iouAmount),
          date: new Date().toLocaleDateString(lang === 'de' ? 'de-DE' : 'en-US', { day: '2-digit', month: 'short' }),
          settled: false
        }]};
        setIouPerson("");
        setIouAmount("");
        await saveState(copy);
      };

      const handleSettleIou = async (id) => {
        const copy = { ...data, ious: data.ious.map(i => i.id === id ? { ...i, settled: true } : i) };
        await saveState(copy);
      };

      // Bar Chart for Current Year
      useEffect(() => {
        if (selectedMonth === "AnnualOverview" || !chartRef.current) return;
        const ctx = chartRef.current.getContext('2d');
        if (chartInstanceRef.current) chartInstanceRef.current.destroy();

        const monthsForYear = getMonthsForYear(selectedYear);
        const translatedLabels = monthsForYear.map(m => t(`months.${m}`));
        const incomesData = monthsForYear.map(m => {
          return data.categories.incomes.reduce((s, cat) => s + getNode('incomes', cat, selectedYear, m).actual, 0);
        });

        const brackets = ['housing', 'living', 'subscriptions', 'leisure', 'professional'];
        const bracketColors = {
          housing: '#64748b',
          living: '#f59e0b',
          subscriptions: '#8b5cf6',
          leisure: '#ec4899',
          professional: '#14b8a6'
        };

        const datasets = [
          {
            label: t('incomesHeader'),
            data: incomesData,
            backgroundColor: '#10b981',
            borderRadius: 6,
            stack: 'Stack0'
          },
          ...brackets.map(bKey => ({
            label: t(`bracket${bKey.charAt(0).toUpperCase() + bKey.slice(1)}`),
            data: monthsForYear.map(m => {
              return data.categories.expenses
                .filter(cat => (data.categoryOverrides[cat] || autoClassifyCategory(cat).bracket) === bKey)
                .reduce((s, cat) => s + getNode('expenses', cat, selectedYear, m).actual, 0);
            }),
            backgroundColor: bracketColors[bKey],
            borderRadius: 2,
            stack: 'Stack1'
          }))
        ];

        const isDark = theme === 'dark';
        const axisColor = isDark ? '#94a3b8' : '#64748b';

        chartInstanceRef.current = new Chart(ctx, {
          type: 'bar',
          data: { labels: translatedLabels, datasets },
          options: {
            responsive: true, maintainAspectRatio: false,
            scales: {
              x: { ticks: { color: axisColor, font: { family: 'inherit', size: 11, weight: '600' } }, grid: { display: false } },
              y: { beginAtZero: true, ticks: { color: axisColor, font: { family: 'inherit', size: 10 }, callback: v => fmt(v) }, grid: { color: isDark ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.05)' } }
            },
            plugins: {
              legend: { position: 'top', labels: { color: axisColor, usePointStyle: true, boxWidth: 6, font: { family: 'inherit', size: 11, weight: '600' } } }
            }
          }
        });

        return () => { if (chartInstanceRef.current) chartInstanceRef.current.destroy(); };
      }, [data, selectedYear, selectedMonth, lang, theme]);

      // Annual Data & Doughnut
      const annualData = useMemo(() => {
        const months = getMonthsForYear(selectedYear);
        let totIn = 0, totEx = 0;
        const catMap = {};
        data.categories.expenses.forEach(c => catMap[c] = 0);
        months.forEach(m => {
          data.categories.incomes.forEach(c => totIn += getNode('incomes', c, selectedYear, m).actual);
          data.categories.expenses.forEach(c => {
            const v = getNode('expenses', c, selectedYear, m).actual;
            totEx += v;
            catMap[c] += v;
          });
        });

        const sorted = Object.keys(catMap).map(c => ({ category: c, total: catMap[c] })).sort((a,b) => b.total - a.total);
        const peakCategory = sorted[0]?.total > 0 ? sorted[0].category : null;
        const savingsRate = totIn > 0 ? ((totIn - totEx) / totIn) * 100 : 0;
        return { totIn, totEx, sorted, peakCategory, savingsRate };
      }, [data, selectedYear]);

      useEffect(() => {
        if (selectedMonth !== "AnnualOverview" || !annualChartRef.current) return;
        const ctx = annualChartRef.current.getContext('2d');
        if (annualChartInstanceRef.current) annualChartInstanceRef.current.destroy();

        const top = annualData.sorted.filter(e => e.total > 0).slice(0, 6);
        const isDark = theme === 'dark';

        annualChartInstanceRef.current = new Chart(ctx, {
          type: 'doughnut',
          data: {
            labels: top.map(e => t(`categories.${e.category}`).replace('categories.', '')),
            datasets: [{
              data: top.map(e => e.total),
              backgroundColor: ['#6366f1', '#f43f5e', '#f59e0b', '#10b981', '#06b6d4', '#8b5cf6'],
              borderWidth: 2,
              borderColor: isDark ? '#0f1623' : '#ffffff'
            }]
          },
          options: {
            responsive: true, maintainAspectRatio: false, cutout: '72%',
            plugins: {
              legend: { position: 'bottom', labels: { color: isDark ? '#94a3b8' : '#64748b', usePointStyle: true, font: { family: 'inherit', size: 11, weight: '600' } } }
            }
          }
        });
        return () => { if (annualChartInstanceRef.current) annualChartInstanceRef.current.destroy(); };
      }, [selectedMonth, annualData, lang, theme]);

      // Category modifiers
      const addCategory = async (type, name, setter) => {
        if (!name.trim()) return;
        const trimmed = name.trim();
        if (data.categories[type].includes(trimmed)) return alert(t('duplicateCategoryAlert'));

        const auto = autoClassifyCategory(trimmed);
        const copy = JSON.parse(JSON.stringify(data));
        copy.categories[type].push(trimmed);
        copy.categoryModes[trimmed] = type === 'incomes' ? 'fixed' : auto.mode;
        copy.categoryOverrides[trimmed] = auto.bracket;
        copy.categoryOneTime[trimmed] = auto.isOneTime;

        ["2026", "2027", "2028"].forEach(y => {
          if (!copy.values[y][type][trimmed]) copy.values[y][type][trimmed] = {};
          getMonthsForYear(parseInt(y)).forEach(m => {
            copy.values[y][type][trimmed][m] = { budget: 0, actual: 0, asOfDate: getDaysInMonth(parseInt(y), m) };
          });
        });
        setter("");
        await saveState(copy);
      };

      const deleteCategory = async (type, cat) => {
        if (!confirm(t('deleteConfirmation', { name: t(`categories.${cat}`).replace('categories.', '') }))) return;
        const copy = JSON.parse(JSON.stringify(data));
        copy.categories[type] = copy.categories[type].filter(c => c !== cat);
        ["2026", "2027", "2028"].forEach(y => {
          if (copy.values[y]?.[type]?.[cat]) delete copy.values[y][type][cat];
        });
        delete copy.categoryModes[cat];
        delete copy.categoryOverrides[cat];
        delete copy.categoryOneTime[cat];
        delete copy.fixedPaymentDays[cat];
        await saveState(copy);
        setActiveEditCat(null);
      };

      return (
        <div className="flex flex-col min-h-screen">

          {/* 2026 MINIMAL NAVIGATION BAR */}
          <header className="sticky top-0 z-50 bg-surface/90 backdrop-blur-md border-b border-subtle h-14">
            <div className="max-w-7xl mx-auto px-4 h-full flex items-center justify-between">
              
              <div className="flex items-center space-x-3">
                <div className="w-8 h-8 rounded-xl bg-gradient-to-tr from-indigo-600 to-indigo-400 flex items-center justify-center text-white shadow-sm font-black text-sm">
                  <i className="fa-solid fa-layer-group"></i>
                </div>
                <div>
                  <h1 className="text-sm sm:text-base font-extrabold tracking-tight leading-none text-primary">
                    {t('title')}
                  </h1>
                  <span className="text-[10px] text-tertiary font-mono flex items-center gap-1.5 mt-0.5">
                    <span className={`w-1.5 h-1.5 rounded-full ${isOnline ? 'bg-emerald-500 shadow-[0_0_8px_#10b981]' : 'bg-rose-500'}`}></span>
                    {isOnline ? t('synced') : t('offline')}
                  </span>
                </div>
              </div>

              {/* Center Year Selector */}
              <div className="hidden sm:flex items-center bg-surface-elevated p-1 rounded-xl border border-subtle">
                {[2026, 2027, 2028].map(yr => (
                  <button
                    key={yr}
                    onClick={() => setSelectedYear(yr)}
                    className={`px-3 py-1 rounded-lg text-xs font-mono font-bold transition ${selectedYear === yr ? 'bg-indigo-600 text-white shadow-sm' : 'text-secondary hover:text-primary'}`}
                  >
                    {yr}
                  </button>
                ))}
              </div>

              {/* Actions Right */}
              <div className="flex items-center space-x-2">
                <button
                  onClick={() => changeLanguage(lang === 'de' ? 'en' : 'de')}
                  className="text-xs font-mono font-bold px-2.5 py-1 rounded-lg bg-surface-elevated border border-subtle text-primary hover:border-strong transition"
                >
                  {lang.toUpperCase()}
                </button>
                <button
                  onClick={() => setIsBurgerOpen(true)}
                  className="w-8 h-8 rounded-lg bg-surface-elevated border border-subtle text-secondary hover:text-primary transition flex items-center justify-center"
                >
                  <i className="fa-solid fa-sliders text-xs"></i>
                </button>
              </div>

            </div>
          </header>

          {/* MONTH SUBNAV WITH LIQUID PILL SELECTORS */}
          <nav className="sticky top-14 z-40 bg-surface/80 backdrop-blur-md border-b border-subtle">
            <div className="max-w-7xl mx-auto px-4 py-2 flex items-center justify-between overflow-x-auto scrollbar-none gap-2">
              <div className="flex sm:hidden items-center bg-surface-elevated p-0.5 rounded-lg border border-subtle shrink-0">
                {[2026, 2027, 2028].map(yr => (
                  <button
                    key={yr}
                    onClick={() => setSelectedYear(yr)}
                    className={`px-2 py-0.5 rounded-md text-[11px] font-mono font-bold ${selectedYear === yr ? 'bg-indigo-600 text-white' : 'text-secondary'}`}
                  >
                    {yr}
                  </button>
                ))}
              </div>

              <div className="flex items-center space-x-1 overflow-x-auto scrollbar-none">
                {getMonthsForYear(selectedYear).map(m => (
                  <button
                    key={m}
                    onClick={() => setSelectedMonth(m)}
                    className={`px-3 py-1 rounded-lg text-xs font-mono font-semibold transition whitespace-nowrap ${selectedMonth === m ? 'bg-indigo-500/10 text-indigo-400 border border-indigo-500/30 font-bold' : 'text-secondary hover:text-primary'}`}
                  >
                    {t(`months.${m}`)}
                  </button>
                ))}
              </div>

              <div className="h-4 w-[1px] bg-subtle shrink-0 mx-1"></div>

              <button
                onClick={() => setSelectedMonth("AnnualOverview")}
                className={`px-3 py-1 rounded-lg text-xs font-mono font-bold transition whitespace-nowrap flex items-center gap-1.5 shrink-0 ${selectedMonth === "AnnualOverview" ? 'bg-indigo-600 text-white shadow-sm' : 'text-secondary hover:text-primary bg-surface-elevated border border-subtle'}`}
              >
                <i className="fa-solid fa-compass text-[11px]"></i>
                <span>{t('annualOverview')}</span>
              </button>
            </div>
          </nav>

          {/* MAIN CONTAINER */}
          <main className="max-w-7xl mx-auto w-full px-4 pt-6 pb-12 flex-grow space-y-6">

            {selectedMonth === "AnnualOverview" ? (
              /* ANNUAL / FORWARD RUNWAY VIEW */
              <div className="space-y-6">
                <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                  <div className="bg-surface border border-subtle rounded-2xl p-5">
                    <p className="text-xs font-mono font-bold text-indigo-400 uppercase tracking-wider">{t('savingsRate')}</p>
                    <p className="text-3xl font-mono font-black text-primary mt-2">{annualData.savingsRate.toFixed(1)}%</p>
                  </div>
                  <div className="bg-surface border border-subtle rounded-2xl p-5">
                    <p className="text-xs font-mono font-bold text-rose-400 uppercase tracking-wider">{t('peakSpendingCategory')}</p>
                    <p className="text-lg font-bold text-primary mt-2 truncate">
                      {annualData.peakCategory ? t(`categories.${annualData.peakCategory}`).replace('categories.', '') : t('noData')}
                    </p>
                  </div>
                  <div className="bg-surface border border-subtle rounded-2xl p-5">
                    <p className="text-xs font-mono font-bold text-tertiary uppercase tracking-wider">{t('incomesHeader')} / {t('expensesHeader')}</p>
                    <p className="text-lg font-mono font-bold text-emerald-400 mt-2">
                      +{fmt(annualData.totIn)} <span className="text-rose-400 text-sm font-normal">(-{fmt(annualData.totEx)})</span>
                    </p>
                  </div>
                </div>

                <div className="bg-surface rounded-2xl border border-subtle p-5 grid grid-cols-1 lg:grid-cols-2 gap-6 items-center">
                  <div>
                    <h3 className="text-xs font-mono font-bold text-secondary uppercase tracking-wider mb-4">Ausgabenverteilung {selectedYear}</h3>
                    <div className="h-[250px] relative w-full flex justify-center">
                      <canvas ref={annualChartRef}></canvas>
                    </div>
                  </div>
                  <div className="space-y-2.5 max-h-[280px] overflow-y-auto scrollbar-none">
                    {annualData.sorted.map(({ category, total }) => {
                      if (total === 0) return null;
                      const share = annualData.totEx > 0 ? (total / annualData.totEx) * 100 : 0;
                      return (
                        <div key={category} className="flex justify-between items-center text-xs py-1.5 border-b border-subtle">
                          <span className="font-medium text-secondary">{t(`categories.${category}`).replace('categories.', '')}</span>
                          <span className="font-mono font-bold text-primary">{fmt(total)} <span className="text-tertiary text-[10px]">({share.toFixed(0)}%)</span></span>
                        </div>
                      );
                    })}
                  </div>
                </div>

                {/* Forward Runway Table */}
                <div className="bg-surface rounded-2xl border border-subtle overflow-hidden">
                  <div className="p-4 border-b border-subtle bg-surface-elevated flex justify-between items-center">
                    <h3 className="text-xs font-mono font-bold text-primary uppercase tracking-wider">Multi-Year Forward Cash Balance Datasheet</h3>
                  </div>
                  <div className="overflow-x-auto scrollbar-none">
                    <table className="w-full text-left text-xs font-mono">
                      <thead className="bg-surface-elevated text-tertiary uppercase text-[10px] border-b border-subtle">
                        <tr>
                          <th className="p-3">Month</th>
                          <th className="p-3 text-right">Incomes (Actual/Plan)</th>
                          <th className="p-3 text-right">Expenses (Spend)</th>
                          <th className="p-3 text-right">Net Month</th>
                          <th className="p-3 text-right">Cumulative Balance</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-subtle">
                        {getMonthsForYear(selectedYear).map(m => {
                          const row = forwardTimeline.find(t => t.year === selectedYear && t.month === m);
                          if (!row) return null;
                          return (
                            <tr key={m} className="hover:bg-subtle/50 transition">
                              <td className="p-3 font-bold text-primary">{t(`months.${m}`)} {selectedYear}</td>
                              <td className="p-3 text-right text-emerald-400 font-bold">{fmt(row.actualIn > 0 ? row.actualIn : row.budgetIn)}</td>
                              <td className="p-3 text-right text-rose-400 font-bold">{fmt(row.actualEx > 0 ? row.actualEx : row.budgetEx)}</td>
                              <td className={`p-3 text-right font-black ${row.projectedNet >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>
                                {fmt(row.projectedNet)}
                              </td>
                              <td className="p-3 text-right font-black text-indigo-400 text-sm">
                                {fmt(row.endProjectedBalance)}
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            ) : (
              /* MONTHLY COCKPIT VIEW */
              <div className="space-y-6">

                {/* SUBHEADER: COLOR LEGEND & VIEW TOGGLE */}
                <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">

                                        max={daysInMonth}
                                        value={item.asOfDate}
                                        onChange={(e) => updateNode('expenses', item.category, selectedYear, selectedMonth, 'asOfDate', Math.min(daysInMonth, Math.max(1, parseInt(e.target.value) || 1)))}
                                        className="w-5 text-center font-mono font-bold text-primary bg-surface rounded"
                                      />
                                    </div>
                                  </div>
                                  <div className="flex items-center bg-surface-elevated border border-rose-500/20 rounded-xl px-2.5 py-1.5 focus-within:border-rose-500 transition">
                                    <input
                                      type="number"
                                      value={item.actual !== 0 ? item.actual : ""}
                                      placeholder="0"
                                      onChange={(e) => updateNode('expenses', item.category, selectedYear, selectedMonth, 'actual', e.target.value)}
                                      className="w-full bg-transparent text-right font-mono font-bold text-xs text-rose-400 outline-none"
                                    />
                                    <span className="text-xs font-mono text-tertiary ml-1.5 font-bold">€</span>
                                  </div>
                                </div>

                              </div>

                              {/* Pacing Info Line */}
                              <div className="flex justify-between items-center text-[10px] font-mono pt-0.5">
                                <span className="text-tertiary">
                                  {t('restBudgetLabel')}: <b className={item.remainingBudget >= 0 ? 'text-primary' : 'text-rose-400'}>{fmt(item.remainingBudget)}</b>
                                </span>
                                <span className="text-amber-400 font-bold">
                                  {fmt(item.safeDailySpend)} {t('perDayLabel')} <span className="text-tertiary font-normal">({item.daysLeft}d)</span>
                                </span>
                              </div>

                              {/* Progress bar */}
                              {item.budget > 0 && (
                                <div className="w-full bg-surface-elevated h-1 rounded-full overflow-hidden relative">
                                  <div
                                    className={`h-full transition-all duration-300 ${pctSpent > 100 ? 'bg-rose-500' : pctSpent > pctTime + 10 ? 'bg-amber-500' : 'bg-indigo-500'}`}
                                    style={{ width: `${Math.min(100, pctSpent)}%` }}
                                  ></div>
                                  <div
                                    className="absolute top-0 bottom-0 w-0.5 bg-primary z-10 opacity-70"
                                    style={{ left: `${Math.min(100, pctTime)}%` }}
                                  ></div>
                                </div>
                              )}
                            </div>
                          );
                        })}
                      </div>

                    </div>

                    {activeTab === 'edit' && (
                      <div className="p-3 bg-surface-elevated border-t border-subtle flex gap-2">
                        <input
                          type="text"
                          value={newExpenseName}
                          onChange={(e) => setNewExpenseName(e.target.value)}
                          placeholder={t('addPlaceholder')}
                          className="flex-1 bg-subtle border border-subtle text-primary rounded-xl px-3 py-1.5 text-xs font-mono outline-none"
                        />
                        <button onClick={() => addCategory('expenses', newExpenseName, setNewExpenseName)} className="bg-indigo-600 hover:bg-indigo-500 text-white font-mono font-bold px-3 py-1.5 rounded-xl text-xs">
                          + Add
                        </button>
                      </div>
                    )}
                  </div>

                </div>
              </div>
            )}
          </main>

          {/* EDIT DRAWER */}
          {activeEditCat && (() => {
            const { type, cat } = activeEditCat;
            const mode = data.categoryModes[cat] || (type === 'incomes' ? 'fixed' : 'variable');
            const isOneTime = !!data.categoryOneTime[cat];
            const pDay = data.fixedPaymentDays?.[cat];

            return (
              <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex justify-end">
                <div className="bg-surface border-l border-subtle w-full max-w-sm h-full shadow-2xl p-6 overflow-y-auto flex flex-col justify-between animate-slideIn">
                  <div className="space-y-6">
                    <div className="flex justify-between items-center pb-4 border-b border-subtle">
                      <h3 className="font-mono font-bold text-sm text-primary uppercase tracking-wider">{t('editorTitle')}</h3>
                      <button onClick={() => setActiveEditCat(null)} className="text-secondary hover:text-rose-400">
                        <i className="fa-solid fa-xmark text-base"></i>
                      </button>
                    </div>

                    <div className="space-y-4 font-mono text-xs">
                      <div>
                        <label className="text-[10px] font-bold text-secondary uppercase block mb-1">{t('posten')}</label>
                        <input
                          type="text"
                          value={editCatNameInput}
                          onChange={(e) => setEditCatNameInput(e.target.value)}
                          onBlur={async () => {
                            const trimmed = editCatNameInput.trim();
                            if (!trimmed || trimmed === cat) return;
                            const copy = JSON.parse(JSON.stringify(data));
                            copy.categories[type] = copy.categories[type].map(c => c === cat ? trimmed : c);
                            if (copy.categoryModes[cat]) { copy.categoryModes[trimmed] = copy.categoryModes[cat]; delete copy.categoryModes[cat]; }
                            if (copy.categoryOverrides[cat]) { copy.categoryOverrides[trimmed] = copy.categoryOverrides[cat]; delete copy.categoryOverrides[cat]; }
                            if (copy.categoryOneTime[cat] !== undefined) { copy.categoryOneTime[trimmed] = copy.categoryOneTime[cat]; delete copy.categoryOneTime[cat]; }
                            if (copy.fixedPaymentDays[cat]) { copy.fixedPaymentDays[trimmed] = copy.fixedPaymentDays[cat]; delete copy.fixedPaymentDays[cat]; }
                            ["2026", "2027", "2028"].forEach(y => {
                              if (copy.values[y]?.[type]?.[cat]) {
                                copy.values[y][type][trimmed] = copy.values[y][type][cat];
                                delete copy.values[y][type][cat];
                              }
                            });
                            await saveState(copy);
                            setActiveEditCat({ type, cat: trimmed });
                          }}
                          className="w-full bg-subtle border border-subtle rounded-xl px-3 py-2 text-primary font-bold outline-none"
                        />
                      </div>

                      {type === 'expenses' && (
                        <div className="flex items-center justify-between p-3 rounded-xl bg-surface-elevated border border-subtle">
                          <div>
                            <span className="font-bold text-primary block">{t('badgeOneTime')}</span>
                            <span className="text-[10px] text-secondary">{t('isOneTimeLabel')}</span>
                          </div>
                          <input
                            type="checkbox"
                            checked={isOneTime}
                            onChange={(e) => {
                              const copy = { ...data, categoryOneTime: { ...data.categoryOneTime, [cat]: e.target.checked } };
                              saveState(copy);
                            }}
                            className="w-4 h-4 text-indigo-600 rounded"
                          />
                        </div>
                      )}

                      <div>
                        <label className="text-[10px] font-bold text-secondary uppercase block mb-1">{t('classificationLabel')}</label>
                        <div className="grid grid-cols-2 gap-2">
                          <button
                            type="button"
                            onClick={() => saveState({ ...data, categoryModes: { ...data.categoryModes, [cat]: 'fixed' } })}
                            className={`p-2.5 rounded-xl border text-center font-bold text-xs ${mode === 'fixed' ? 'border-indigo-500 bg-indigo-500/10 text-indigo-400' : 'border-subtle text-secondary'}`}
                          >
                            {t('badgeFixed')}
                          </button>
                          <button
                            type="button"
                            onClick={() => saveState({ ...data, categoryModes: { ...data.categoryModes, [cat]: 'variable' } })}
                            className={`p-2.5 rounded-xl border text-center font-bold text-xs ${mode === 'variable' ? 'border-indigo-500 bg-indigo-500/10 text-indigo-400' : 'border-subtle text-secondary'}`}
                          >
                            Variabel
                          </button>
                        </div>
                      </div>

                      {mode === 'fixed' && (
                        <div>
                          <label className="text-[10px] font-bold text-secondary uppercase block mb-1">{t('paymentDayLabel')}</label>
                          <input
                            type="number" min="1" max="31"
                            value={pDay || ""}
                            onChange={(e) => {
                              const day = parseInt(e.target.value);
                              saveState({ ...data, fixedPaymentDays: { ...(data.fixedPaymentDays || {}), [cat]: isNaN(day) ? null : day } });
                            }}
                            className="w-full bg-subtle border border-subtle rounded-xl px-3 py-2 text-primary font-bold text-right outline-none"
                          />
                        </div>
                      )}
                    </div>
                  </div>

                  <div className="pt-4 border-t border-subtle space-y-2 font-mono">
                    <button onClick={() => setActiveEditCat(null)} className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 rounded-xl text-xs">
                      {t('saveClose')}
                    </button>
                    <button onClick={() => deleteCategory(type, cat)} className="w-full text-rose-400 bg-rose-500/10 hover:bg-rose-500/20 py-2 rounded-xl text-xs font-bold border border-rose-500/20">
                      {t('deleteCategoryBtn')}
                    </button>
                  </div>
                </div>
              </div>
            );
          })()}

          {/* RECURRING MODAL */}
          {recurringModal && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-surface border border-subtle rounded-2xl max-w-sm w-full p-5 space-y-4 shadow-2xl font-mono">
                <div className="flex justify-between items-center border-b border-subtle pb-2">
                  <h3 className="font-bold text-xs text-primary uppercase">{t('setRecurringBudget')}</h3>
                  <button onClick={() => setRecurringModal(null)} className="text-secondary hover:text-rose-400"><i className="fa-solid fa-xmark"></i></button>
                </div>
                <p className="text-xs text-secondary">
                  {t(`categories.${recurringModal.item}`).replace('categories.', '')}: <b className="text-primary font-bold">{fmt(recurringModal.value)}</b>
                </p>
                <div className="space-y-1">
                  <label className="text-[10px] font-bold text-tertiary uppercase">{t('durationInMonths')}</label>
                  <select
                    value={recurringCount}
                    onChange={(e) => setRecurringCount(parseInt(e.target.value))}
                    className="w-full bg-subtle border border-subtle rounded-xl px-3 py-2 text-xs font-bold text-primary outline-none"
                  >
                    <option value={3}>3 Months</option>
                    <option value={6}>6 Months</option>
                    <option value={12}>12 Months</option>
                  </select>
                </div>
                <div className="flex gap-2 pt-2">
                  <button onClick={() => setRecurringModal(null)} className="flex-1 bg-surface-elevated text-secondary font-bold py-2 rounded-xl text-xs border border-subtle">
                    {t('cancelBtn')}
                  </button>
                  <button
                    onClick={async () => {
                      const copy = JSON.parse(JSON.stringify(data));
                      const timeline = [];
                      [2026, 2027, 2028].forEach(yr => { getMonthsForYear(yr).forEach(mo => timeline.push({ yr, mo })); });
                      const idx = timeline.findIndex(t => t.yr === parseInt(selectedYear) && t.mo === selectedMonth);
                      if (idx !== -1) {
                        for (let i = 0; i < recurringCount; i++) {
                          const tg = timeline[idx + i];
                          if (tg) {
                            if (!copy.values[tg.yr][recurringModal.type][recurringModal.item]) copy.values[tg.yr][recurringModal.type][recurringModal.item] = {};
                            const cur = getNode(recurringModal.type, recurringModal.item, tg.yr, tg.mo);
                            copy.values[tg.yr][recurringModal.type][recurringModal.item][tg.mo] = { ...cur, actual: recurringModal.value };
                          }
                        }
                      }
                      await saveState(copy);
                      setRecurringModal(null);
                    }}
                    className="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2 rounded-xl text-xs"
                  >
                    {t('applyBtn')}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* SETTINGS DRAWER */}
          {isBurgerOpen && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex justify-end">
              <div className="bg-surface border-l border-subtle w-80 h-full shadow-2xl p-5 overflow-y-auto flex flex-col justify-between animate-slideIn font-mono text-xs">
                <div className="space-y-6">
                  <div className="flex justify-between items-center pb-3 border-b border-subtle">
                    <h3 className="font-bold text-sm text-primary uppercase">{t('options')}</h3>
                    <button onClick={() => setIsBurgerOpen(false)} className="text-secondary hover:text-rose-400">
                      <i className="fa-solid fa-xmark text-base"></i>
                    </button>
                  </div>

                  {/* Starting Capital */}
                  <div className="space-y-1">
                    <p className="text-[10px] font-bold text-tertiary uppercase">{t('startingCapital')}</p>
                    <div className="flex items-center bg-subtle border border-subtle rounded-xl px-3 py-1.5 focus-within:border-indigo-500 transition">
                      <input
                        type="number"
                        value={data.startingCapital || ""}
                        placeholder="0"
                        onChange={(e) => saveState({ ...data, startingCapital: parseFloat(e.target.value) || 0 })}
                        className="w-full bg-transparent text-right font-mono font-bold text-xs text-primary outline-none"
                      />
                      <span className="text-xs font-mono text-tertiary ml-1.5 font-bold">€</span>
                    </div>
                  </div>

                  {/* Theme Switcher */}
                  <div className="space-y-1 pt-3 border-t border-subtle">
                    <p className="text-[10px] font-bold text-tertiary uppercase">{t('themeLabel')}</p>
                    <div className="grid grid-cols-3 gap-1 bg-surface-elevated border border-subtle rounded-xl p-1">
                      {['light', 'dark', 'system'].map(m => (
                        <button
                          key={m}
                          onClick={() => setTheme(m)}
                          className={`py-1 rounded-lg text-[10px] font-bold transition ${theme === m ? 'bg-surface text-indigo-400 shadow-sm' : 'text-secondary'}`}
                        >
                          {t(`theme${m.charAt(0).toUpperCase() + m.slice(1)}`)}
                        </button>
                      ))}
                    </div>
                  </div>

                  {/* Language */}
                  <div className="space-y-1 pt-3 border-t border-subtle">
                    <p className="text-[10px] font-bold text-tertiary uppercase">{t('selectLanguage')}</p>
                    <div className="flex gap-2">
                      <button onClick={() => changeLanguage('de')} className={`flex-1 py-1 rounded-xl text-xs font-bold border ${lang === 'de' ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-subtle text-secondary border-subtle'}`}>DE</button>
                      <button onClick={() => changeLanguage('en')} className={`flex-1 py-1 rounded-xl text-xs font-bold border ${lang === 'en' ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-subtle text-secondary border-subtle'}`}>EN</button>
                    </div>
                  </div>

                  {/* Backups */}
                  <div className="space-y-2 pt-3 border-t border-subtle">
                    <p className="text-[10px] font-bold text-tertiary uppercase">{t('backupSection')}</p>
                    <button
                      onClick={() => {
                        const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
                        const a = document.createElement('a');
                        a.href = URL.createObjectURL(blob);
                        a.download = `cashflow_backup_${Date.now()}.json`;
                        a.click();
                      }}
                      className="w-full bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 font-bold py-2 rounded-xl text-xs flex items-center justify-center gap-2"
                    >
                      <i className="fa-solid fa-download"></i> {t('exportBackup')}
                    </button>
                    <button onClick={() => fileInputRef.current?.click()} className="w-full bg-surface-elevated border border-subtle text-primary font-bold py-2 rounded-xl text-xs flex items-center justify-center gap-2">
                      <i className="fa-solid fa-upload"></i> {t('importBackup')}
                    </button>
                    <input
                      ref={fileInputRef}
                      type="file"
                      accept=".json"
                      onChange={(e) => {
                        const f = e.target.files[0];
                        if (f) {
                          const r = new FileReader();
                          r.onload = async (ev) => {
                            try {
                              const parsed = JSON.parse(ev.target.result);
                              await saveState(normalizeState(parsed));
                              alert(t('importSuccess'));
                              setIsBurgerOpen(false);
                            } catch(err) { alert(t('importError')); }
                          };
                          r.readAsText(f);
                        }
                      }}
                      className="hidden"
                    />
                  </div>
                </div>

                <div className="pt-4 border-t border-subtle">
                  <button
                    onClick={async () => {
                      if (confirm(t('confirmClear'))) {
                        await saveState(normalizeState(null));
                        setIsBurgerOpen(false);
                      }
                    }}
                    className="text-xs text-rose-400 underline font-bold"
                  >
                    {t('clearAll')}
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<LanguageProvider><MainApp /></LanguageProvider>);
  </script>
</body>
</html>
