<!DOCTYPE html>
<html lang="de" class="dark notranslate" data-theme="dark" translate="no">
<head>
  <meta charset="UTF-8">
  <!-- The app has its own DE/EN switch; browser translation rewrites React's text nodes and shows stale numbers. -->
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Jdeeds' Household</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0c0d10">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Jdeeds">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Theme tokens live in CSS variables (RGB triplets) so Tailwind classes like
    // bg-primary, text-surface and bg-subtle/50 actually exist and support opacity.
    const cssVar = (name) => `rgb(var(${name}) / <alpha-value>)`;
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '"IBM Plex Sans Arabic"', 'ui-sans-serif', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Helvetica', '"Apple Color Emoji"', 'Arial', 'sans-serif'],
            // Numbers use the same typeface with tabular figures (see .font-mono), not a code font.
            mono: ['Inter', '"IBM Plex Sans Arabic"', 'ui-sans-serif', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'sans-serif']
          },
          borderRadius: { DEFAULT: '0.5rem', md: '0.625rem', lg: '0.875rem', xl: '1.125rem', '2xl': '1.375rem' },
          colors: {
            notion: {
              blue: '#3b82f6',
              green: '#10b981',
              red: '#ef4444',
              amber: '#f59e0b',
              tagGray: 'rgba(120, 119, 116, 0.15)',
              tagBlue: 'rgba(35, 131, 226, 0.12)',
              tagGreen: 'rgba(15, 123, 108, 0.12)',
              tagAmber: 'rgba(223, 171, 1, 0.15)',
              tagRed: 'rgba(224, 62, 62, 0.12)',
              tagPurple: 'rgba(105, 64, 165, 0.12)'
            }
          },
          backgroundColor: {
            app: cssVar('--bg-app'),
            surface: { DEFAULT: cssVar('--bg-surface'), elevated: cssVar('--bg-surface-elevated') },
            subtle: cssVar('--bg-subtle'),
            primary: cssVar('--text-primary')
          },
          textColor: {
            primary: cssVar('--text-primary'),
            secondary: cssVar('--text-secondary'),
            tertiary: cssVar('--text-tertiary'),
            surface: cssVar('--bg-surface')
          },
          borderColor: {
            subtle: cssVar('--border-subtle'),
            strong: cssVar('--border-strong'),
            primary: cssVar('--text-primary')
          }
        }
      }
    };
  </script>
  <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    input[type=search]::-webkit-search-cancel-button, input[type=search]::-webkit-search-decoration { -webkit-appearance: none; display: none; }
    /* View mode: fields on the pages show their values but can't be changed by a stray tap while scrolling. */
    main.locked input:not([data-free]), main.locked select:not([data-free]), main.locked textarea:not([data-free]),
    main.locked .money-input, main.locked [data-edit] { pointer-events: none; }
    main.locked input:not([data-free]):not([type=checkbox]), main.locked select:not([data-free]), main.locked .money-input {
      background: transparent !important; border-color: transparent !important; box-shadow: none !important;
    }
    main.locked select:not([data-free]) { appearance: none; -webkit-appearance: none; }
    main.locked [data-edit] { opacity: .3; }
    :root {
      --bg-app: 245 246 248;
      --bg-surface: 255 255 255;
      --bg-surface-elevated: 250 251 252;
      --bg-subtle: 240 242 245;
      --border-subtle: 229 231 236;
      --border-strong: 208 212 220;
      --text-primary: 17 20 28;
      --text-secondary: 98 105 120;
      --text-tertiary: 146 152 166;
    }

    [data-theme="dark"] {
      --bg-app: 12 13 16;
      --bg-surface: 21 23 28;
      --bg-surface-elevated: 26 29 35;
      --bg-subtle: 33 36 43;
      --border-subtle: 39 43 51;
      --border-strong: 58 63 74;
      --text-primary: 236 238 242;
      --text-secondary: 150 157 171;
      --text-tertiary: 104 111 125;
    }
    .font-mono { font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
    .tnum { font-variant-numeric: tabular-nums; }
    @media (prefers-reduced-motion: no-preference) {
      .view-enter { animation: viewIn .22s cubic-bezier(.2,.8,.2,1); }
      .slide-next { animation: slideNext .26s cubic-bezier(.2,.8,.2,1); }
      .slide-prev { animation: slidePrev .26s cubic-bezier(.2,.8,.2,1); }
      [dir="rtl"] .slide-next { animation-name: slidePrev; }
      [dir="rtl"] .slide-prev { animation-name: slideNext; }
      .sheet-in { animation: sheetUp .28s cubic-bezier(.2,.9,.25,1); }
      .backdrop-in { animation: fadeIn .2s ease-out; }
      .pop-in { animation: popIn .16s ease-out; }
      .cell-in { animation: cellIn .32s cubic-bezier(.2,.8,.2,1) both; }
      .saved-pulse { animation: savedPulse .5s ease-out; }
      @keyframes cellIn { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: none; } }
      @keyframes savedPulse { 0% { transform: scale(1); } 40% { transform: scale(1.04); box-shadow: 0 0 0 6px rgba(16,185,129,.35); } 100% { transform: scale(1); box-shadow: none; } }
      @media (min-width: 640px) { .sheet-in { animation: popIn .18s ease-out; } }
      @keyframes viewIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      @keyframes slideNext { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: none; } }
      @keyframes slidePrev { from { opacity: 0; transform: translateX(-28px); } to { opacity: 1; transform: none; } }
      @keyframes sheetUp { from { transform: translateY(100%); } to { transform: none; } }
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes popIn { from { opacity: 0; transform: scale(.97) translateY(4px); } to { opacity: 1; transform: none; } }
      /* Pressed buttons give way a little, like a native control. */
      button { transition: transform .12s ease, background-color .15s ease, color .15s ease, box-shadow .15s ease; }
      button:active:not(:disabled) { transform: scale(.97); }
    }
    .fold { display: grid; grid-template-rows: 1fr; transition: grid-template-rows .24s cubic-bezier(.2,.8,.2,1); }
    .fold.closed { grid-template-rows: 0fr; }
    .fold > div { overflow: hidden; min-height: 0; }
    html { -webkit-tap-highlight-color: transparent; }

    body {
      background-color: rgb(var(--bg-app));
      color: rgb(var(--text-primary));
      -webkit-font-smoothing: antialiased;
      font-feature-settings: "cv11", "ss01";
      letter-spacing: -0.01em;
    }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none; margin: 0;
    }
    input[type="number"] { -moz-appearance: textfield; }
    .scrollbar-none::-webkit-scrollbar { display: none; }
    .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }

    button, input, select {
      touch-action: manipulation;
    }

    @keyframes flashHighlight {
      0% { background-color: rgba(35, 131, 226, 0.25); }
      100% { background-color: transparent; }
    }
    .animate-flash { animation: flashHighlight 1.5s ease-out; }
  </style>
</head>
<body class="min-h-screen">
  <div id="root"></div>

  <!-- APP:BEGIN – built from src/app.jsx by build.mjs, do not edit here -->
  <script src="app.js?v=0b8c935623" defer></script>
  <!-- APP:END -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(e => console.warn('Service worker not registered:', e));
      });
    }
  </script>
</body>
</html>
