<!DOCTYPE html>
<html lang="de" class="dark notranslate" data-theme="dark" translate="no">
<head>
  <meta charset="UTF-8">

  <title>Jdeeds' Household</title>

  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Theme tokens live in CSS variables (RGB triplets) so Tailwind classes like
    // bg-primary, text-surface and bg-subtle/50 actually exist and support opacity.
    const cssVar = (name) => `rgb(var(${name}) / <alpha-value>)`;
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Geist', '"Readex Pro"', 'ui-sans-serif', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Helvetica', '"Apple Color Emoji"', 'Arial', 'sans-serif'],
            // Numbers use the same typeface with tabular figures (see .font-mono), not a code font.
            mono: ['Geist', '"Readex Pro"', 'ui-sans-serif', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'sans-serif']
          },
          borderRadius: { DEFAULT: '0.5rem', md: '0.625rem', lg: '0.875rem', xl: '1.125rem', '2xl': '1.375rem' },
          colors: {
            notion: {
              blue: '#3b82f6',
              green: '#10b981',
              red: '#ef4444',
              amber: '#f59e0b',
              tagGray: 'rgba(120, 119, 116, 0.15)',
              tagBlue: 'rgba(35, 131, 226, 0.12)',
              tagGreen: 'rgba(15, 123, 108, 0.12)',
              tagAmber: 'rgba(223, 171, 1, 0.15)',
              tagRed: 'rgba(224, 62, 62, 0.12)',
              tagPurple: 'rgba(105, 64, 165, 0.12)'
            }
          },
          backgroundColor: {
            app: cssVar('--bg-app'),
            surface: { DEFAULT: cssVar('--bg-surface'), elevated: cssVar('--bg-surface-elevated') },
            subtle: cssVar('--bg-subtle'),
            primary: cssVar('--text-primary')
          },
          textColor: {
            primary: cssVar('--text-primary'),
            secondary: cssVar('--text-secondary'),
            tertiary: cssVar('--text-tertiary'),
            surface: cssVar('--bg-surface')
          },
          borderColor: {
            subtle: cssVar('--border-subtle'),
            strong: cssVar('--border-strong'),
            primary: cssVar('--text-primary')
          }
        }
      }
    };
  </script>
  <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; letter-spacing: -0.005em; }
    h1, h2, h3, .font-semibold, .font-bold { letter-spacing: -0.015em; }
    [dir="rtl"] body, [dir="rtl"] h1, [dir="rtl"] h2, [dir="rtl"] h3, [dir="rtl"] .font-semibold, [dir="rtl"] .font-bold { letter-spacing: 0; }
    /* One UI–style layer: big title area for one-handed reach, soft borderless cards, floating tab bar. */
    .oneui-hero { height: clamp(116px, 21vh, 200px); display: flex; flex-direction: column; justify-content: flex-end; padding: 0 6px 18px; }
    .oneui-hero-title { font-size: clamp(30px, 8.6vw, 38px); font-weight: 650; letter-spacing: -0.03em; line-height: 1.05; color: rgb(var(--text-primary)); }
    .oneui-hero-sub { margin-top: 6px; font-size: 13px; color: rgb(var(--text-secondary)); }
    [dir="rtl"] .oneui-hero-title { letter-spacing: 0; }
    .oneui-bar { background: transparent; border-bottom: 1px solid transparent; }
    .oneui-bar.is-scrolled { background: rgb(var(--bg-app) / .82); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); border-bottom-color: rgb(var(--border-subtle)); }
    @media (max-width: 1023px) { .oneui-smalltitle { opacity: 0; transform: translateY(6px); transition: opacity .2s ease, transform .2s ease; } .oneui-smalltitle.is-on { opacity: 1; transform: none; } }
    @media (min-width: 1024px) { .oneui-bar { background: rgb(var(--bg-app) / .82); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); } }
    main section.rounded-2xl, main .rounded-2xl.border-subtle { border-radius: 26px !important; }
    main section.rounded-2xl.border-subtle, main .rounded-2xl.border.border-subtle { border-color: transparent !important; }
    main section.rounded-2xl.bg-surface { box-shadow: 0 1px 2px rgba(15,23,42,.04); }
    [data-theme="dark"] main section.rounded-2xl.bg-surface { box-shadow: none; }
    .oneui-tabs { padding: 0 12px; }
    .oneui-tabs-in { border-radius: 30px; background: rgb(var(--bg-surface) / .88); -webkit-backdrop-filter: blur(22px); backdrop-filter: blur(22px);
      box-shadow: 0 10px 30px -12px rgba(15,23,42,.35), 0 0 0 1px rgb(var(--border-subtle)); }
    .oneui-tabs-in button span.w-12.h-12 { margin-top: -18px; }
    aside.fixed { border-inline-end-color: transparent !important; }
    /* Calendar widget: a small month beside the chosen day, like a phone home-screen widget. Sized by its own width. */
    .cw-wrap { container: cw / inline-size; display: grid; gap: 12px; }
    .cw { display: grid; grid-template-columns: 1fr; gap: 14px; padding: 16px; border-radius: 26px;
      background: linear-gradient(145deg, rgb(var(--bg-surface)) 0%, rgb(var(--bg-subtle) / .85) 100%);
      border: 1px solid rgb(var(--border-subtle)); box-shadow: 0 1px 0 rgba(255,255,255,.06) inset, 0 12px 30px -18px rgba(15,23,42,.35); }
    @container cw (min-width: 520px) { .cw { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 20px; padding: 20px 22px; } }
    .cw-head, .cw-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); text-align: center; }
    .cw-head span { font-size: 12px; font-weight: 600; color: rgb(var(--text-secondary)); padding-bottom: 6px; }
    .cw-head .cw-sun, .cw-day.cw-sun .cw-n { color: rgb(220 38 38); }
    .cw-grid { row-gap: 2px; }
    .cw-day { position: relative; height: 38px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 11px; transition: background .15s ease, transform .15s ease; }
    .cw-day:hover { background: rgb(var(--bg-subtle)); }
    .cw-day:active { transform: scale(.92); }
    .cw-n { font-size: 15px; line-height: 1; font-variant-numeric: tabular-nums; color: rgb(var(--text-primary)); }
    .cw-today { background: rgb(220 38 38); }
    .cw-today .cw-n, .cw-day.cw-sun.cw-today .cw-n { color: #fff; font-weight: 700; }
    .cw-today .cw-dots i { background: #fff !important; box-shadow: none; }
    .cw-sel { box-shadow: inset 0 0 0 1.5px rgb(59 130 246); }
    .cw-dots { display: flex; gap: 2px; height: 4px; }
    .cw-dots i, .cw-sum i { display: inline-block; width: 4px; height: 4px; border-radius: 99px; }
    .cw-d-paid { background: rgb(59 130 246); } .cw-d-due { background: rgb(245 158 11); } .cw-d-in { background: rgb(16 185 129); }
    .cw-daypane { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
    .cw-dayhead { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .cw-date { font-size: 24px; font-weight: 600; letter-spacing: -.02em; line-height: 1.1; color: rgb(var(--text-primary)); }
    .cw-wd { font-size: 12px; color: rgb(var(--text-secondary)); margin-top: 2px; }
    .cw-add { width: 40px; height: 40px; border-radius: 99px; background: rgb(59 130 246); color: #fff; display: grid; place-items: center; font-size: 15px; flex: none;
      box-shadow: 0 6px 16px -6px rgba(59,130,246,.7); transition: transform .15s ease; }
    .cw-add:active { transform: scale(.9); }
    .cw-list { display: flex; flex-direction: column; gap: 6px; animation: cwIn .25s ease both; }
    .cw-empty { font-size: 13px; color: rgb(var(--text-secondary)); padding: 6px 0; }
    .cw-item { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto auto; align-items: center; gap: 8px; font-size: 13px; }
    .cw-item-due { opacity: .72; }
    .cw-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: rgb(var(--text-primary)); }
    .cw-name em { font-style: normal; color: rgb(217 119 6); font-size: 11px; }
    .cw-amt { font-variant-numeric: tabular-nums; font-weight: 600; color: rgb(var(--text-primary)); }
    .cw-pos { color: rgb(16 185 129); }
    .cw-x { width: 22px; height: 22px; border-radius: 99px; color: rgb(var(--text-tertiary)); font-size: 10px; }
    .cw-x:hover { color: rgb(220 38 38); }
    .cw-ico { width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center; font-size: 10px; background: rgb(var(--bg-subtle)); color: rgb(var(--text-secondary)); }
    .cw-sum { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: rgb(var(--text-secondary)); padding: 0 6px; }
    .cw-sum span { display: inline-flex; align-items: center; gap: 6px; }
    .cw-sum b { color: rgb(var(--text-primary)); font-weight: 600; font-variant-numeric: tabular-nums; }
    .cw-undated { padding: 0 6px; font-size: 12px; color: rgb(var(--text-secondary)); }
    .cw-undated summary { cursor: pointer; padding: 4px 0 8px; }
    @keyframes cwIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .cw-list { animation: none; } }
    input[type=search]::-webkit-search-cancel-button, input[type=search]::-webkit-search-decoration { -webkit-appearance: none; display: none; }
    /* View mode: fields on the pages show their values but can't be changed by a stray tap while scrolling. */
    main.locked input:not([data-free]), main.locked select:not([data-free]), main.locked textarea:not([data-free]),
    main.locked .money-input, main.locked [data-edit] { pointer-events: none; }
    main.locked input:not([data-free]):not([type=checkbox]), main.locked select:not([data-free]), main.locked .money-input {
      background: transparent !important; border-color: transparent !important; box-shadow: none !important;
    }
    main.locked select:not([data-free]) { appearance: none; -webkit-appearance: none; }
    main.locked [data-edit] { opacity: .3; }
    :root {
      --bg-app: 243 243 247;
      --bg-surface: 255 255 255;
      --bg-surface-elevated: 252 252 254;
      --bg-subtle: 238 239 244;
      --border-subtle: 232 233 238;
      --border-strong: 208 211 220;
      --text-primary: 17 20 28;
      --text-secondary: 98 105 120;
      --text-tertiary: 146 152 166;
    }

    [data-theme="dark"] {
      --bg-app: 0 0 0;
      --bg-surface: 23 23 26;
      --bg-surface-elevated: 30 30 34;
      --bg-subtle: 38 38 43;
      --border-subtle: 40 40 46;
      --border-strong: 62 62 70;
      --text-primary: 236 238 242;
      --text-secondary: 150 157 171;
      --text-tertiary: 104 111 125;
    }
    .font-mono { font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
    .tnum { font-variant-numeric: tabular-nums; }
    @media (prefers-reduced-motion: no-preference) {
      .view-enter { animation: viewIn .22s cubic-bezier(.2,.8,.2,1); }
      .slide-next { animation: slideNext .26s cubic-bezier(.2,.8,.2,1); }
      .slide-prev { animation: slidePrev .26s cubic-bezier(.2,.8,.2,1); }
      [dir="rtl"] .slide-next { animation-name: slidePrev; }
      [dir="rtl"] .slide-prev { animation-name: slideNext; }
      .sheet-in { animation: sheetUp .28s cubic-bezier(.2,.9,.25,1); }
      .backdrop-in { animation: fadeIn .2s ease-out; }
      .pop-in { animation: popIn .16s ease-out; }
      .cell-in { animation: cellIn .32s cubic-bezier(.2,.8,.2,1) both; }
      .saved-pulse { animation: savedPulse .5s ease-out; }
      @keyframes cellIn { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: none; } }
      @keyframes savedPulse { 0% { transform: scale(1); } 40% { transform: scale(1.04); box-shadow: 0 0 0 6px rgba(16,185,129,.35); } 100% { transform: scale(1); box-shadow: none; } }
      @media (min-width: 640px) { .sheet-in { animation: popIn .18s ease-out; } }
      @keyframes viewIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      @keyframes slideNext { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: none; } }
      @keyframes slidePrev { from { opacity: 0; transform: translateX(-28px); } to { opacity: 1; transform: none; } }
      @keyframes sheetUp { from { transform: translateY(100%); } to { transform: none; } }
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes popIn { from { opacity: 0; transform: scale(.97) translateY(4px); } to { opacity: 1; transform: none; } }
      /* Pressed buttons give way a little, like a native control. */
      button { transition: transform .12s ease, background-color .15s ease, color .15s ease, box-shadow .15s ease; }
      button:active:not(:disabled) { transform: scale(.97); }
    }
    .fold { display: grid; grid-template-rows: 1fr; transition: grid-template-rows .24s cubic-bezier(.2,.8,.2,1); }
    .fold.closed { grid-template-rows: 0fr; }
    .fold > div { overflow: hidden; min-height: 0; }
    html { -webkit-tap-highlight-color: transparent; }

    body {
      background-color: rgb(var(--bg-app));
      color: rgb(var(--text-primary));
      -webkit-font-smoothing: antialiased;
      font-feature-settings: "cv11", "ss01";
      letter-spacing: -0.01em;
    }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none; margin: 0;
    }
    input[type="number"] { -moz-appearance: textfield; }
    /* Modern scrolling: thin floating scrollbars, smooth jumps, no scroll chaining out of sheets,
       and cards that ease in as they scroll into view (browsers that support scroll timelines). */
    html { scroll-behavior: smooth; scroll-padding-top: 72px; overscroll-behavior-y: none; }
    * { scrollbar-width: thin; scrollbar-color: rgb(var(--text-tertiary) / .35) transparent; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgb(var(--text-tertiary) / .3); border-radius: 999px; border: 1px solid transparent; background-clip: padding-box; }
    ::-webkit-scrollbar-thumb:hover { background-color: rgb(var(--text-tertiary) / .6); }
    ::-webkit-scrollbar-corner { background: transparent; }
    [role=dialog], .overflow-y-auto, .overflow-auto { overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
    .overflow-x-auto { scroll-snap-type: x proximity; overscroll-behavior-x: contain; }
    .overflow-x-auto > * { scroll-snap-align: start; }
    @supports (animation-timeline: view()) {
      @media (prefers-reduced-motion: no-preference) {
        main section { animation: card-in linear both; animation-timeline: view(); animation-range: entry 0% entry 35%; }
        @keyframes card-in { from { opacity: .25; transform: translateY(18px) scale(.985); } to { opacity: 1; transform: none; } }
      }
    }
    .scrollbar-none::-webkit-scrollbar { display: none; }
    .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }

    button, input, select {
      touch-action: manipulation;
    }

    @keyframes flashHighlight {
      0% { background-color: rgba(35, 131, 226, 0.25); }
      100% { background-color: transparent; }
    }
    .animate-flash { animation: flashHighlight 1.5s ease-out; }
  </style>
</head>
