    const LanguageContext = createContext();
    function LanguageProvider({ children }) {
      const [lang, setLang] = useState(() => safeStorage.get('budget_app_lang', 'de'));
      const changeLanguage = (l) => { setLang(l); safeStorage.set('budget_app_lang', l); };

      const getNested = (obj, path) => {
        if (!obj) return undefined;
        return path.split('.').reduce((acc, part) => (acc && acc[part] !== undefined) ? acc[part] : undefined, obj);
      };

      const t = (path, params = {}) => {
        let res = getNested(translations[lang], path) || getNested(translations['en'], path);
        if (res === undefined) {
          if (path.startsWith('months.')) return path.replace('months.', '');
          return path;
        }
        if (typeof res === 'string') {
          Object.keys(params).forEach(p => { res = res.replace(new RegExp(`{{${p}}}`, 'g'), params[p]); });
        }
        return res;
      };
      return <LanguageContext.Provider value={{ t, lang, changeLanguage }}>{children}</LanguageContext.Provider>;
    }
    const useTranslation = () => useContext(LanguageContext);

    const IDB = {
      dbName: 'LiquidCashflow_v12',
      open() {
        return new Promise((res, rej) => {
          const r = indexedDB.open(this.dbName, 1);
          r.onupgradeneeded = (e) => e.target.result.createObjectStore('store', { keyPath: 'id' });
          r.onsuccess = () => res(r.result);
          r.onerror = () => rej(r.error);
        });
      },
      async get(k) {
        try {
          const db = await this.open();
          return new Promise(res => {
            const tx = db.transaction('store', 'readonly');
            const req = tx.objectStore('store').get(k);
            req.onsuccess = () => res(req.result?.data);
            req.onerror = () => res(null);
          });
        } catch(e) { return null; }
      },
      async set(k, data) {
        try {
          const db = await this.open();
          return new Promise((res, rej) => {
            const tx = db.transaction('store', 'readwrite');
            tx.objectStore('store').put({ id: k, data });
            tx.oncomplete = () => res(true);
            tx.onerror = () => rej(tx.error);
          });
        } catch(e) {}
      }
    };

    const normalizeState = (raw) => {
      const state = {
        startingCapital: typeof raw?.startingCapital === 'number' ? raw.startingCapital : 0,
        brackets: {
          expenses: raw?.brackets?.expenses || [...DEFAULT_BRACKETS.expenses],
          incomes: raw?.brackets?.incomes || [...DEFAULT_BRACKETS.incomes]
        },
        categories: {
          incomes: [...(raw?.categories?.incomes || INITIAL_CATEGORIES.incomes)],
          expenses: [...(raw?.categories?.expenses || INITIAL_CATEGORIES.expenses)]
        },
        categoryOverrides: { ...(raw?.categoryOverrides || {}) },
        categoryModes: { ...(raw?.categoryModes || {}) },
        categoryNotes: { ...(raw?.categoryNotes || {}) },
        fixedPaymentDays: { ...(raw?.fixedPaymentDays || {}) },
        categoryOneTime: { ...(raw?.categoryOneTime || { "Hause kaution": true, "FSP exam registration": true, "furniture from Vormieter": true }) },
        ious: raw?.ious || [],
        values: {}
      };

      state.categories.expenses.forEach(cat => {
        if (!state.categoryModes[cat]) state.categoryModes[cat] = autoClassifyCategory(cat).mode;
        if (!state.categoryOverrides[cat]) state.categoryOverrides[cat] = autoClassifyCategory(cat).bracket;
        if (state.categoryOneTime[cat] === undefined) state.categoryOneTime[cat] = autoClassifyCategory(cat).isOneTime;
        if (!state.categoryNotes[cat]) state.categoryNotes[cat] = [];
      });

      state.categories.incomes.forEach(cat => {
        if (!state.categoryModes[cat]) state.categoryModes[cat] = (cat.includes("side") || cat.includes("Sonstiges")) ? 'variable' : 'fixed';
        if (!state.categoryOverrides[cat]) state.categoryOverrides[cat] = state.categoryModes[cat] === 'fixed' ? 'fixed_in' : 'variable_in';
        if (!state.categoryNotes[cat]) state.categoryNotes[cat] = [];
      });

      ["2026", "2027", "2028"].forEach(y => {
        const yNum = parseInt(y);
        state.values[y] = { incomes: {}, expenses: {} };
        const months = getMonthsForYear(yNum);

        ['incomes', 'expenses'].forEach(type => {
          state.categories[type].forEach(cat => {
            state.values[y][type][cat] = {};
            months.forEach(m => {
              const old = raw?.values?.[y]?.[type]?.[cat]?.[m];
              const monthDays = getDaysInMonth(yNum, m);

              if (typeof old === 'object' && old !== null) {
                if (old.w1 !== undefined || old.w2 !== undefined || old.w3 !== undefined) {
                  const sumWeekly = (parseFloat(old.w1)||0) + (parseFloat(old.w2)||0) + (parseFloat(old.w3)||0) + (parseFloat(old.w4)||0) + (parseFloat(old.w5)||0);
                  state.values[y][type][cat][m] = { budget: sumWeekly, actual: sumWeekly, asOfDate: monthDays };
                } else {
                  state.values[y][type][cat][m] = {
                    budget: typeof old.budget === 'number' ? old.budget : (parseFloat(old.total) || 0),
                    actual: typeof old.actual === 'number' ? old.actual : (parseFloat(old.total) || 0),
                    asOfDate: typeof old.asOfDate === 'number' ? old.asOfDate : monthDays
                  };
                }
              } else if (typeof old === 'number') {
                state.values[y][type][cat][m] = { budget: old, actual: old, asOfDate: monthDays };
              } else {
                state.values[y][type][cat][m] = { budget: 0, actual: 0, asOfDate: monthDays };
              }
            });
          });
        });
      });
      return state;
    };

      const [activeEditCat, setActiveEditCat] = useState(null);
      const [editCatForm, setEditCatForm] = useState({ name: "", bracket: "", mode: "fixed", isOneTime: false, pDay: "", notes: [] });
      const [newBulletText, setNewBulletText] = useState("");
      const [saveFeedback, setSaveFeedback] = useState(false);

      // Bracket Modal
      const [bracketModal, setBracketModal] = useState(null);
      const [bracketForm, setBracketForm] = useState({ name: "", icon: "fa-house", color: "#6366f1" });

      // Global Quick Add Modal
      const [quickAddModal, setQuickAddModal] = useState(null); // { type: 'expenses' | 'incomes', defaultBracket?: string }
      const [quickAddForm, setQuickAddForm] = useState({ name: "", bracket: "", budget: "", mode: "variable" });

      const [smartDeleteModal, setSmartDeleteModal] = useState(null);
      const [iouPerson, setIouPerson] = useState("");
      const [iouAmount, setIouAmount] = useState("");

      const chartRef = useRef(null);
      const chartInstanceRef = useRef(null);
      const fileInputRef = useRef(null);

      useEffect(() => {
        safeStorage.set('budget_app_theme', theme);
        const root = document.documentElement;
        const res = theme === 'system' ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : theme;
        root.setAttribute('data-theme', res);
        if (res === 'dark') root.classList.add('dark');
        else root.classList.remove('dark');
      }, [theme]);

      useEffect(() => {
        safeStorage.set('budget_hide_zeroes', hideZeroes ? 'true' : 'false');
      }, [hideZeroes]);

      useEffect(() => {
        const on = () => setIsOnline(true);
        const off = () => setIsOnline(false);
        window.addEventListener('online', on);
        window.addEventListener('offline', off);
        return () => { window.removeEventListener('online', on); window.removeEventListener('offline', off); };
      }, []);

      useEffect(() => {
        (async () => {
          const cached = await IDB.get('app_state');
          if (cached) setData(normalizeState(cached));
        })();

        let unsub = () => {};
        if (db) {
          unsub = db.collection('monthly_logs').doc('house_finanzen_state').onSnapshot(async (doc) => {
            if (doc.exists) {
              const remote = doc.data();
              const merged = normalizeState(remote.payload);
              setData(merged);
              await IDB.set('app_state', merged);
              setSyncStatus("synced");
            }
          }, () => setSyncStatus("offline"));
        }
        return () => unsub();
      }, []);

      const saveState = async (updated) => {
        setData(updated);
        await IDB.set('app_state', updated);
        if (navigator.onLine && db) {
          setSyncStatus("syncing");
          try {
            await db.collection('monthly_logs').doc('house_finanzen_state').set({ payload: updated, updatedAt: Date.now() });
            setSyncStatus("synced");
          } catch(e) { setSyncStatus("offline"); }
        } else {
          setSyncStatus("offline");
        }
      };

      const fmt = (v) => new Intl.NumberFormat(lang === 'de' ? 'de-DE' : 'en-US', {
        style: 'currency', currency: 'EUR', maximumFractionDigits: 0
      }).format(v || 0);

      const getNode = (type, cat, yr, m) => {
        return data.values[yr]?.[type]?.[cat]?.[m] || { budget: 0, actual: 0, asOfDate: getDaysInMonth(yr, m) };
      };

      const updateNode = async (type, cat, yr, m, field, val) => {
        const copy = JSON.parse(JSON.stringify(data));
        if (!copy.values[yr][type][cat]) copy.values[yr][type][cat] = {};
        if (!copy.values[yr][type][cat][m]) {
          copy.values[yr][type][cat][m] = { budget: 0, actual: 0, asOfDate: getDaysInMonth(yr, m) };
        }
        const num = parseFloat(val);
        copy.values[yr][type][cat][m][field] = isNaN(num) ? 0 : num;
        await saveState(copy);
      };

      const forwardTimeline = useMemo(() => {
        let runningBalance = data.startingCapital || 0;
        const timeline = [];
        const years = [2026, 2027, 2028];

        years.forEach(yr => {
          const months = getMonthsForYear(yr);
          months.forEach(m => {
            const daysInMonth = getDaysInMonth(yr, m);
            let budgetIn = 0, actualIn = 0;
            let budgetEx = 0, actualEx = 0;
            let projectedEx = 0;

            data.categories.incomes.forEach(cat => {
              const node = getNode('incomes', cat, yr, m);
              budgetIn += node.budget;
              actualIn += node.actual;
            });

            data.categories.expenses.forEach(cat => {
              const node = getNode('expenses', cat, yr, m);
              const mode = data.categoryModes[cat] || 'variable';
              const isOneTime = data.categoryOneTime[cat];
              budgetEx += node.budget;
              actualEx += node.actual;

              if (mode === 'fixed' || isOneTime) {
                projectedEx += (node.actual > 0 ? node.actual : node.budget);
              } else {
                const asOf = Math.min(daysInMonth, Math.max(1, node.asOfDate || daysInMonth));
                if (node.actual > 0) {
                  const burn = node.actual / asOf;
                  const remainDays = Math.max(0, daysInMonth - asOf);
                  projectedEx += (node.actual + (burn * remainDays));
                } else {
                  projectedEx += node.budget;
                }
              }
            });

            const effectiveIn = actualIn > 0 ? actualIn : budgetIn;
            const actualNet = actualIn - actualEx;
            const projectedNet = effectiveIn - projectedEx;

            const monthNetRollover = actualEx > 0 ? projectedNet : (budgetIn - budgetEx);
            const startBal = runningBalance;
            runningBalance += monthNetRollover;

            timeline.push({
              year: yr, month: m, key: `${m} ${yr}`, daysInMonth,
              budgetIn, actualIn, budgetEx, actualEx, projectedEx,
              actualNet, projectedNet, startBal, endProjectedBalance: runningBalance
            });
          });
        });
        return timeline;
      }, [data]);

      const currentMetrics = useMemo(() => {
        if (selectedMonth === "AnnualOverview") return forwardTimeline[0];
        const match = forwardTimeline.find(t => t.year === selectedYear && t.month === selectedMonth);
        return match || forwardTimeline[0];
      }, [forwardTimeline, selectedYear, selectedMonth]);

      const categoryAnalytics = useMemo(() => {
        if (selectedMonth === "AnnualOverview") return [];
        const daysInMonth = currentMetrics.daysInMonth;

        return data.categories.expenses.map(cat => {
          const node = getNode('expenses', cat, selectedYear, selectedMonth);
          const mode = data.categoryModes[cat] || 'variable';
          const isOneTime = !!data.categoryOneTime[cat];
          const asOf = Math.min(daysInMonth, Math.max(1, node.asOfDate || daysInMonth));
          const daysLeft = Math.max(0, daysInMonth - asOf);

          const expectedPace = (node.budget / daysInMonth) * asOf;
          const remainingBudget = node.budget - node.actual;
          const safeDailySpend = daysLeft > 0 ? Math.max(0, remainingBudget / daysLeft) : 0;

          let paceStatus = "ontrack";
          if (mode === 'variable' && node.budget > 0) {
            if (node.actual > expectedPace * 1.08) paceStatus = "over";
            else if (node.actual < expectedPace * 0.85) paceStatus = "frugal";
          }

          let projectedTotal = node.budget;
          if (mode === 'fixed' || isOneTime) {
            projectedTotal = node.actual > 0 ? node.actual : node.budget;
          } else if (node.actual > 0) {
            projectedTotal = node.actual + ((node.actual / asOf) * daysLeft);
          }

          return {
            category: cat, budget: node.budget, actual: node.actual,
            asOfDate: asOf, daysLeft, remainingBudget, safeDailySpend,
            projectedTotal, paceStatus,
            bracket: data.categoryOverrides[cat] || autoClassifyCategory(cat).bracket,
            mode, isOneTime, notes: data.categoryNotes?.[cat] || []
          };
        });
      }, [data, selectedYear, selectedMonth, currentMetrics]);

      const checkDuplicate = (name, excludeCat = null) => {
        if (!name.trim()) return null;
        const test = name.trim().toLowerCase();
        for (const cat of data.categories.expenses) {
          if (excludeCat && cat.toLowerCase() === excludeCat.toLowerCase()) continue;
          if (cat.toLowerCase() === test) {
            const b = data.categoryOverrides[cat] || autoClassifyCategory(cat).bracket;
            const bObj = data.brackets.expenses.find(x => x.id === b);
            return { exists: true, type: 'expenses', bracket: bObj?.name || b, name: cat };
          }
        }
        for (const cat of data.categories.incomes) {
          if (excludeCat && cat.toLowerCase() === excludeCat.toLowerCase()) continue;
          if (cat.toLowerCase() === test) {
            const b = data.categoryOverrides[cat] || 'incomes';
            const bObj = data.brackets.incomes.find(x => x.id === b);
            return { exists: true, type: 'incomes', bracket: bObj?.name || b, name: cat };
          }
        }
        return null;
      };

      // BULLETPROOF ADD ITEM
      const handleCreateCategory = async (type, name, bracketId, mode, initialBudget = 0) => {
        const val = name.trim();
        if (!val) return;
        const dup = checkDuplicate(val);
        if (dup) {
          alert(`Kategorie existiert bereits: "${dup.name}" (${dup.bracket})`);
          return;
        }

        const copy = JSON.parse(JSON.stringify(data));
        copy.categories[type].push(val);
        copy.categoryOverrides[val] = bracketId;
        copy.categoryModes[val] = mode || 'variable';
        copy.categoryOneTime[val] = false;
        copy.categoryNotes[val] = [];

        ["2026", "2027", "2028"].forEach(y => {
          if (!copy.values[y][type][val]) copy.values[y][type][val] = {};
          getMonthsForYear(parseInt(y)).forEach(m => {
            copy.values[y][type][val][m] = {
              budget: parseFloat(initialBudget) || 0,
              actual: 0,
              asOfDate: getDaysInMonth(parseInt(y), m)
            };
          });
        });

        // Ensure category is visible!
        setOpenBrackets(prev => ({ ...prev, [bracketId]: true }));
        setHighlightedCategory(val);
        setTimeout(() => setHighlightedCategory(null), 2500);

        await saveState(copy);
        setQuickAddModal(null);
      };

      const handleOpenQuickAdd = (type, defaultBracket = null) => {
        const bracketsList = type === 'incomes' ? data.brackets.incomes : data.brackets.expenses;
        const chosenBracket = defaultBracket || bracketsList[0]?.id || 'other';
        setQuickAddModal({ type });
        setQuickAddForm({
          name: "",
          bracket: chosenBracket,
          budget: "",
          mode: type === 'incomes' ? 'fixed' : 'variable'
        });
      };

      const handleOpenEditCategory = (type, cat) => {
        setActiveEditCat({ type, cat });
        setEditCatForm({
          name: cat,
          bracket: data.categoryOverrides[cat] || (type === 'incomes' ? 'fixed_in' : 'other'),
          mode: data.categoryModes[cat] || 'fixed',
          isOneTime: !!data.categoryOneTime[cat],
          pDay: data.fixedPaymentDays?.[cat] || "",
          notes: [...(data.categoryNotes?.[cat] || [])]
        });
        setNewBulletText("");
        setSaveFeedback(false);
      };

      const handleSaveCategoryChanges = async () => {
        if (!activeEditCat) return;
        const { type, cat: oldName } = activeEditCat;
        const newName = editCatForm.name.trim();

        if (!newName) return;
        if (newName !== oldName) {
          const dup = checkDuplicate(newName, oldName);
          if (dup) {
            alert(`Kategorie existiert bereits: "${dup.name}"`);
            return;
          }
        }

        const copy = JSON.parse(JSON.stringify(data));

        if (newName !== oldName) {
          copy.categories[type] = copy.categories[type].map(c => c === oldName ? newName : c);
          ["2026", "2027", "2028"].forEach(y => {
            if (copy.values[y]?.[type]?.[oldName]) {
              copy.values[y][type][newName] = copy.values[y][type][oldName];
              delete copy.values[y][type][oldName];
            }
          });
        }

        copy.categoryOverrides[newName] = editCatForm.bracket;
        copy.categoryModes[newName] = editCatForm.mode;
        copy.categoryOneTime[newName] = editCatForm.isOneTime;
        copy.categoryNotes[newName] = editCatForm.notes;

        const dayNum = parseInt(editCatForm.pDay);
        copy.fixedPaymentDays[newName] = isNaN(dayNum) ? null : dayNum;

        if (newName !== oldName) {
          delete copy.categoryOverrides[oldName];
          delete copy.categoryModes[oldName];
          delete copy.categoryOneTime[oldName];
          delete copy.categoryNotes[oldName];
          delete copy.fixedPaymentDays[oldName];
        }

        await saveState(copy);
        setActiveEditCat({ type, cat: newName });
        setSaveFeedback(true);
        setTimeout(() => setSaveFeedback(false), 2000);
      };

      const handleAddBulletPoint = () => {
        if (!newBulletText.trim()) return;
        setEditCatForm(prev => ({ ...prev, notes: [...prev.notes, newBulletText.trim()] }));
        setNewBulletText("");
      };

      const handleRemoveBulletPoint = (index) => {
        setEditCatForm(prev => ({ ...prev, notes: prev.notes.filter((_, i) => i !== index) }));
      };

      const executeSmartDelete = async (type, cat, deleteScope) => {
        const copy = JSON.parse(JSON.stringify(data));
        const allMonthsTimeline = [];
        ["2026", "2027", "2028"].forEach(y => {
          getMonthsForYear(parseInt(y)).forEach(m => allMonthsTimeline.push({ y, m }));
        });
        const currentIdx = allMonthsTimeline.findIndex(t => t.y === String(selectedYear) && t.m === selectedMonth);

        if (deleteScope === 'future_only') {
          for (let i = currentIdx + 1; i < allMonthsTimeline.length; i++) {
            const { y, m } = allMonthsTimeline[i];
            if (copy.values[y]?.[type]?.[cat]?.[m]) {
              copy.values[y][type][cat][m] = { budget: 0, actual: 0, asOfDate: getDaysInMonth(parseInt(y), m) };
            }
          }
        } else if (deleteScope === 'purge_and_merge') {
          const fallback = "Sonstiges";
          if (!copy.categories[type].includes(fallback)) {
            copy.categories[type].push(fallback);
            copy.categoryModes[fallback] = copy.categoryModes[cat] || 'fixed';
            copy.categoryOverrides[fallback] = type === 'incomes' ? 'variable_in' : 'other';
          }

          allMonthsTimeline.forEach(({ y, m }) => {
            if (!copy.values[y][type][fallback]) copy.values[y][type][fallback] = {};
            if (!copy.values[y][type][fallback][m]) {
              copy.values[y][type][fallback][m] = { budget: 0, actual: 0, asOfDate: getDaysInMonth(parseInt(y), m) };
            }
            const incoming = getNode(type, cat, y, m);
            copy.values[y][type][fallback][m].budget += incoming.budget;
            copy.values[y][type][fallback][m].actual += incoming.actual;
          });

          copy.categories[type] = copy.categories[type].filter(c => c !== cat);
          ["2026", "2027", "2028"].forEach(y => {
            if (copy.values[y]?.[type]?.[cat]) delete copy.values[y][type][cat];
          });
          delete copy.categoryModes[cat];
          delete copy.categoryOverrides[cat];
          delete copy.categoryOneTime[cat];
          delete copy.categoryNotes[cat];
          delete copy.fixedPaymentDays[cat];
        }

        await saveState(copy);
        setSmartDeleteModal(null);
      };

      const handleOpenBracketModal = (mode, type, bracket = null) => {
        setBracketModal({ mode, type, bracket });
        if (mode === 'edit' && bracket) {
          setBracketForm({ name: bracket.name, icon: bracket.icon, color: bracket.color || "#6366f1" });
        } else {
          setBracketForm({ name: "", icon: "fa-house", color: "#6366f1" });
        }
      };

      const handleSaveBracket = async () => {
        if (!bracketForm.name.trim() || !bracketModal) return;
        const copy = JSON.parse(JSON.stringify(data));
        const { mode, type, bracket } = bracketModal;

        if (mode === 'add') {
          const id = 'bracket_' + Date.now();
          copy.brackets[type].push({
            id, name: bracketForm.name.trim(), icon: bracketForm.icon, color: bracketForm.color
          });
          setOpenBrackets(prev => ({ ...prev, [id]: true }));
        } else if (mode === 'edit' && bracket) {
          copy.brackets[type] = copy.brackets[type].map(b => b.id === bracket.id ? {
            ...b, name: bracketForm.name.trim(), icon: bracketForm.icon, color: bracketForm.color
          } : b);
        }

        await saveState(copy);
        setBracketModal(null);
      };

      const handleDeleteBracket = async (type, bracketId) => {
        if (!confirm("Hauptkategorie löschen? Alle enthaltenen Posten werden nach 'Sonstiges' verschoben.")) return;
        const copy = JSON.parse(JSON.stringify(data));
        const fallbackBracket = type === 'incomes' ? 'variable_in' : 'other';

        copy.categories[type].forEach(cat => {
          if (copy.categoryOverrides[cat] === bracketId) copy.categoryOverrides[cat] = fallbackBracket;
        });

        copy.brackets[type] = copy.brackets[type].filter(b => b.id !== bracketId);
        await saveState(copy);
        setBracketModal(null);
      };

      const toggleBracket = (id) => setOpenBrackets(prev => ({ ...prev, [id]: !prev[id] }));

      const activeIous = useMemo(() => (data.ious || []).filter(i => !i.settled), [data.ious]);
      const totalIou = useMemo(() => activeIous.reduce((s, i) => s + (parseFloat(i.amount) || 0), 0), [activeIous]);

      const handleAddIou = async () => {
        if (!iouPerson.trim() || !iouAmount || isNaN(parseFloat(iouAmount))) return;
        const copy = { ...data, ious: [...(data.ious || []), {
          id: 'iou_' + Date.now(),
          person: iouPerson.trim(),
          amount: parseFloat(iouAmount),
          date: new Date().toLocaleDateString(lang === 'de' ? 'de-DE' : 'en-US', { day: '2-digit', month: 'short' }),
          settled: false
        }]};
        setIouPerson("");
        setIouAmount("");
        await saveState(copy);
      };

      const handleSettleIou = async (id) => {
        const copy = { ...data, ious: data.ious.map(i => i.id === id ? { ...i, settled: true } : i) };
        await saveState(copy);
      };

      useEffect(() => {
        if (selectedMonth === "AnnualOverview" || !chartRef.current) return;
        const ctx = chartRef.current.getContext('2d');
        if (chartInstanceRef.current) chartInstanceRef.current.destroy();

        const monthsForYear = getMonthsForYear(selectedYear);
        const translatedLabels = monthsForYear.map(m => formatMonth(m, lang));
        const incomesData = monthsForYear.map(m => {
          return data.categories.incomes.reduce((s, cat) => s + getNode('incomes', cat, selectedYear, m).actual, 0);
        });

        const datasets = [
          {
            label: t('incomesHeader'),
            data: incomesData,
            backgroundColor: '#10b981',
            borderRadius: 6,
            stack: 'Stack0'
          },
          ...data.brackets.expenses.map(b => ({
            label: b.name,
            data: monthsForYear.map(m => {
              return data.categories.expenses
                .filter(cat => (data.categoryOverrides[cat] || autoClassifyCategory(cat).bracket) === b.id)
                .reduce((s, cat) => s + getNode('expenses', cat, selectedYear, m).actual, 0);
            }),
            backgroundColor: b.color || '#64748b',
            borderRadius: 2,
            stack: 'Stack1'
          }))
        ];

        const isDark = theme === 'dark';
        const axisColor = isDark ? '#94a3b8' : '#64748b';

        chartInstanceRef.current = new Chart(ctx, {
          type: 'bar',
          data: { labels: translatedLabels, datasets },
          options: {
            responsive: true, maintainAspectRatio: false,
            scales: {
              x: { ticks: { color: axisColor, font: { family: 'inherit', size: 11, weight: '600' } }, grid: { display: false } },
              y: { beginAtZero: true, ticks: { color: axisColor, font: { family: 'inherit', size: 10 }, callback: v => fmt(v) }, grid: { color: isDark ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.05)' } }
            },
            plugins: {
              legend: { position: 'top', labels: { color: axisColor, usePointStyle: true, boxWidth: 6, font: { family: 'inherit', size: 11, weight: '600' } } }
            }
          }
        });

        return () => { if (chartInstanceRef.current) chartInstanceRef.current.destroy(); };
      }, [data, selectedYear, selectedMonth, lang, theme]);

      return (
        <div className="flex flex-col min-h-screen">

          {/* TOP NAV */}
          <header className="sticky top-0 z-50 bg-surface/90 backdrop-blur-md border-b border-subtle h-14">
            <div className="max-w-7xl mx-auto px-4 h-full flex items-center justify-between">
              
              <div className="flex items-center space-x-3">
                <div className="w-8 h-8 rounded-xl bg-gradient-to-tr from-indigo-600 to-indigo-400 flex items-center justify-center text-white shadow-sm font-black text-sm">
                  <i className="fa-solid fa-layer-group"></i>
                </div>
                <div>
                  <h1 className="text-sm sm:text-base font-extrabold tracking-tight leading-none text-primary">
                    {t('title')}
                  </h1>
                  <span className="text-[10px] text-tertiary font-mono flex items-center gap-1.5 mt-0.5">
                    <span className={`w-1.5 h-1.5 rounded-full ${isOnline ? 'bg-emerald-500 shadow-[0_0_8px_#10b981]' : 'bg-rose-500'}`}></span>
                    {isOnline ? t('synced') : t('offline')}
                  </span>
                </div>
              </div>

              {/* Year Selector */}
              <div className="hidden sm:flex items-center bg-surface-elevated p-1 rounded-xl border border-subtle">
                {[2026, 2027, 2028].map(yr => (
                  <button
                    key={yr}
                    onClick={() => setSelectedYear(yr)}
                    className={`px-3 py-1 rounded-lg text-xs font-mono font-bold transition ${selectedYear === yr ? 'bg-indigo-600 text-white shadow-sm' : 'text-secondary hover:text-primary'}`}
                  >
                    {yr}
                  </button>
                ))}
              </div>

              {/* Actions Right */}
              <div className="flex items-center space-x-2">
                <button
                  onClick={() => changeLanguage(lang === 'de' ? 'en' : 'de')}
                  className="text-xs font-mono font-bold px-2.5 py-1 rounded-lg bg-surface-elevated border border-subtle text-primary hover:border-strong transition"
                >
                  {lang.toUpperCase()}
                </button>
                <button
                  onClick={() => setIsBurgerOpen(true)}
                  className="w-8 h-8 rounded-lg bg-surface-elevated border border-subtle text-secondary hover:text-primary transition flex items-center justify-center"
                >
                  <i className="fa-solid fa-sliders text-xs"></i>
                </button>
              </div>

            </div>
          </header>

          {/* MONTH SUBNAV */}
          <nav className="sticky top-14 z-40 bg-surface/80 backdrop-blur-md border-b border-subtle">
            <div className="max-w-7xl mx-auto px-4 py-2 flex items-center justify-between overflow-x-auto scrollbar-none gap-2">
              <div className="flex sm:hidden items-center bg-surface-elevated p-0.5 rounded-lg border border-subtle shrink-0">
                {[2026, 2027, 2028].map(yr => (
                  <button
                    key={yr}
                    onClick={() => setSelectedYear(yr)}
                    className={`px-2 py-0.5 rounded-md text-[11px] font-mono font-bold ${selectedYear === yr ? 'bg-indigo-600 text-white' : 'text-secondary'}`}
                  >
                    {yr}
                  </button>
                ))}
              </div>

              <div className="flex items-center space-x-1 overflow-x-auto scrollbar-none">
                {getMonthsForYear(selectedYear).map(m => (
                  <button
                    key={m}
                    onClick={() => setSelectedMonth(m)}
                    className={`px-3 py-1 rounded-lg text-xs font-mono font-semibold transition whitespace-nowrap ${selectedMonth === m ? 'bg-indigo-500/10 text-indigo-400 border border-indigo-500/30 font-bold' : 'text-secondary hover:text-primary'}`}
                  >
                    {formatMonth(m, lang)}
                  </button>
                ))}
              </div>

              <div className="h-4 w-[1px] bg-subtle shrink-0 mx-1"></div>

              <button
                onClick={() => setSelectedMonth("AnnualOverview")}
                className={`px-3 py-1 rounded-lg text-xs font-mono font-bold transition whitespace-nowrap flex items-center gap-1.5 shrink-0 ${selectedMonth === "AnnualOverview" ? 'bg-indigo-600 text-white shadow-sm' : 'text-secondary hover:text-primary bg-surface-elevated border border-subtle'}`}
              >
                <i className="fa-solid fa-compass text-[11px]"></i>
                <span>{t('annualOverview')}</span>
              </button>
            </div>
          </nav>

          {/* MAIN WORKSPACE */}
          <main className="max-w-7xl mx-auto w-full px-4 pt-6 pb-12 flex-grow space-y-6">

                      type="number"
                      value={quickAddForm.budget}
                      onChange={(e) => setQuickAddForm(p => ({ ...p, budget: e.target.value }))}
                      placeholder="0"
                      className="w-full bg-transparent text-right font-mono font-bold text-xs text-primary outline-none"
                    />
                    <span className="text-xs font-mono text-tertiary ml-1.5 font-bold">€</span>
                  </div>
                </div>

                {quickAddModal.type === 'expenses' && (
                  <div>
                    <label className="text-[10px] font-bold text-secondary uppercase block mb-1">{t('classificationLabel')}</label>
                    <div className="grid grid-cols-2 gap-2">
                      <button
                        type="button"
                        onClick={() => setQuickAddForm(p => ({ ...p, mode: 'fixed' }))}
                        className={`p-2 rounded-xl border font-bold text-xs ${quickAddForm.mode === 'fixed' ? 'border-indigo-500 bg-indigo-500/10 text-indigo-400' : 'border-subtle text-secondary'}`}
                      >
                        {t('badgeFixed')}
                      </button>
                      <button
                        type="button"
                        onClick={() => setQuickAddForm(p => ({ ...p, mode: 'variable' }))}
                        className={`p-2 rounded-xl border font-bold text-xs ${quickAddForm.mode === 'variable' ? 'border-indigo-500 bg-indigo-500/10 text-indigo-400' : 'border-subtle text-secondary'}`}
                      >
                        {t('badgeVariable')}
                      </button>
                    </div>
                  </div>
                )}

                <div className="flex gap-2 pt-2 border-t border-subtle">
                  <button onClick={() => setQuickAddModal(null)} className="flex-1 py-2 bg-surface-elevated text-secondary font-bold rounded-xl">
                    {t('cancelBtn')}
                  </button>
                  <button
                    disabled={!quickAddForm.name.trim()}
                    onClick={() => handleCreateCategory(quickAddModal.type, quickAddForm.name, quickAddForm.bracket, quickAddForm.mode, quickAddForm.budget)}
                    className={`flex-1 py-2 font-bold rounded-xl text-white ${!quickAddForm.name.trim() ? 'bg-indigo-900 opacity-40 cursor-not-allowed' : 'bg-indigo-600 hover:bg-indigo-500'}`}
                  >
                    + Erstellen
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* EDIT CATEGORY DRAWER */}
          {activeEditCat && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex justify-end">
              <div className="bg-surface border-l border-subtle w-full max-w-md h-full shadow-2xl p-6 overflow-y-auto flex flex-col justify-between animate-slideIn font-mono text-xs">
                <div className="space-y-5">
                  <div className="flex justify-between items-center pb-3 border-b border-subtle">
                    <h3 className="font-bold text-sm text-primary uppercase">{t('editorTitle')}</h3>
                    <button onClick={() => setActiveEditCat(null)} className="text-secondary hover:text-rose-400">
                      <i className="fa-solid fa-xmark text-base"></i>
                    </button>
                  </div>

                  <div>
                    <label className="text-[10px] font-bold text-secondary uppercase block mb-1">{t('posten')}</label>
                    <input
                      type="text"
                      value={editCatForm.name}
                      onChange={(e) => setEditCatForm(prev => ({ ...prev, name: e.target.value }))}
                      className="w-full bg-subtle border border-subtle rounded-xl px-3 py-2 text-primary font-bold outline-none focus:border-indigo-500"
                    />
                  </div>

                  <div>
                    <label className="text-[10px] font-bold text-secondary uppercase block mb-1">{t('bracketLabel')}</label>
                    <select
                      value={editCatForm.bracket}
                      onChange={(e) => setEditCatForm(prev => ({ ...prev, bracket: e.target.value }))}
                      className="w-full bg-subtle border border-subtle rounded-xl px-3 py-2 text-primary font-bold outline-none"
                    >
                      {(activeEditCat.type === 'incomes' ? data.brackets.incomes : data.brackets.expenses).map(b => (
                        <option key={b.id} value={b.id}>{b.name}</option>
                      ))}
                    </select>
                  </div>

                  <div>
                    <label className="text-[10px] font-bold text-secondary uppercase block mb-1">{t('classificationLabel')}</label>
                    <div className="grid grid-cols-2 gap-2">
                      <button
                        type="button"
                        onClick={() => setEditCatForm(prev => ({ ...prev, mode: 'fixed' }))}
                        className={`p-2.5 rounded-xl border font-bold text-xs ${editCatForm.mode === 'fixed' ? 'border-indigo-500 bg-indigo-500/10 text-indigo-400' : 'border-subtle text-secondary'}`}
                      >
                        {t('badgeFixed')}
                      </button>
                      <button
                        type="button"
                        onClick={() => setEditCatForm(prev => ({ ...prev, mode: 'variable' }))}
                        className={`p-2.5 rounded-xl border font-bold text-xs ${editCatForm.mode === 'variable' ? 'border-indigo-500 bg-indigo-500/10 text-indigo-400' : 'border-subtle text-secondary'}`}
                      >
                        {t('badgeVariable')}
                      </button>
                    </div>
                  </div>

                  {activeEditCat.type === 'expenses' && (
                    <div className="flex items-center justify-between p-3 rounded-xl bg-surface-elevated border border-subtle">
                      <div>
                        <span className="font-bold text-primary block">{t('badgeOneTime')}</span>
                        <span className="text-[10px] text-secondary">{t('isOneTimeLabel')}</span>
                      </div>
                      <input
                        type="checkbox"
                        checked={editCatForm.isOneTime}
                        onChange={(e) => setEditCatForm(prev => ({ ...prev, isOneTime: e.target.checked }))}
                        className="w-4 h-4 text-indigo-600 rounded"
                      />
                    </div>
                  )}

                  {editCatForm.mode === 'fixed' && (
                    <div>
                      <label className="text-[10px] font-bold text-secondary uppercase block mb-1">{t('paymentDayLabel')}</label>
                      <input
                        type="number" min="1" max="31"
                        value={editCatForm.pDay}
                        onChange={(e) => setEditCatForm(prev => ({ ...prev, pDay: e.target.value }))}
                        placeholder="1 - 31"
                        className="w-full bg-subtle border border-subtle rounded-xl px-3 py-2 text-primary font-bold text-right outline-none"
                      />
                    </div>
                  )}

                  {/* NOTES / BULLETS */}
                  <div className="space-y-2 pt-2 border-t border-subtle">
                    <label className="text-[10px] font-bold text-secondary uppercase flex items-center justify-between">
                      <span>{t('notesTitle')}</span>
                      <span className="text-tertiary">({editCatForm.notes.length})</span>
                    </label>

                    <div className="space-y-1.5 max-h-36 overflow-y-auto scrollbar-none">
                      {editCatForm.notes.length === 0 ? (
                        <p className="text-[11px] text-tertiary italic py-1">{t('noNotesYet')}</p>
                      ) : (
                        editCatForm.notes.map((item, idx) => (
                          <div key={idx} className="flex items-center justify-between p-2 rounded-lg bg-surface-elevated border border-subtle gap-2">
                            <div className="flex items-start gap-1.5 flex-1">
                              <span className="text-indigo-400 font-bold">•</span>
                              <span className="text-primary text-xs leading-tight">{item}</span>
                            </div>
                            <button onClick={() => handleRemoveBulletPoint(idx)} className="text-tertiary hover:text-rose-400 p-1">
                              <i className="fa-solid fa-xmark text-xs"></i>
                            </button>
                          </div>
                        ))
                      )}
                    </div>

                    <div className="flex gap-2 pt-1">
                      <input
                        type="text"
                        placeholder={t('addNotePlaceholder')}
                        value={newBulletText}
                        onChange={(e) => setNewBulletText(e.target.value)}
                        onKeyDown={(e) => { if (e.key === 'Enter') handleAddBulletPoint(); }}
                        className="flex-1 bg-subtle border border-subtle rounded-xl px-3 py-1.5 text-xs text-primary outline-none focus:border-indigo-500"
                      />
                      <button onClick={handleAddBulletPoint} className="bg-surface-elevated hover:bg-subtle text-primary border border-subtle px-3 py-1.5 rounded-xl font-bold">
                        + Bullet
                      </button>
                    </div>
                  </div>

                </div>

                <div className="pt-4 border-t border-subtle space-y-2">
                  <button
                    onClick={handleSaveCategoryChanges}
                    className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 rounded-xl text-xs transition flex items-center justify-center gap-2"
                  >
                    <i className="fa-solid fa-floppy-disk"></i>
                    <span>{t('saveClose')}</span>
                  </button>

                  {saveFeedback && (
                    <div className="text-center text-emerald-400 text-[11px] font-bold animate-pulse">
                      ✓ Gespeichert!
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* MAIN CATEGORY BRACKET MODAL */}
          {bracketModal && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-surface border border-subtle rounded-2xl max-w-sm w-full p-5 space-y-4 shadow-2xl font-mono text-xs animate-slideIn">
                <div className="flex justify-between items-center border-b border-subtle pb-3">
                  <h3 className="font-bold text-xs text-primary uppercase">
                    {bracketModal.mode === 'add' ? t('newBracketTitle') : t('editBracketTitle')}
                  </h3>
                  <button onClick={() => setBracketModal(null)} className="text-secondary hover:text-primary">
                    <i className="fa-solid fa-xmark"></i>
                  </button>
                </div>

                <div>
                  <label className="text-[10px] font-bold text-secondary uppercase block mb-1">{t('bracketNameLabel')}</label>
                  <input
                    type="text"
                    value={bracketForm.name}
                    onChange={(e) => setBracketForm(p => ({ ...p, name: e.target.value }))}
                    placeholder="Z.B. Auto, Haustiere, Abos..."
                    className="w-full bg-subtle border border-subtle rounded-xl px-3 py-2 text-primary font-bold outline-none focus:border-indigo-500"
                  />
                </div>

                <div>
                  <label className="text-[10px] font-bold text-secondary uppercase block mb-1">{t('bracketIconLabel')}</label>
                  <div className="grid grid-cols-4 gap-2 pt-1">
                    {POPULAR_ICONS.map(ic => (
                      <button
                        key={ic}
                        type="button"
                        onClick={() => setBracketForm(p => ({ ...p, icon: ic }))}
                        className={`p-2.5 rounded-xl border flex items-center justify-center text-sm transition ${bracketForm.icon === ic ? 'border-indigo-500 bg-indigo-500/10 text-indigo-400' : 'border-subtle text-secondary hover:text-primary'}`}
                      >
                        <i className={`fa-solid ${ic}`}></i>
                      </button>
                    ))}
                  </div>
                </div>

                <div className="flex gap-2 pt-2 border-t border-subtle">
                  {bracketModal.mode === 'edit' && bracketModal.bracket && (
                    <button
                      onClick={() => handleDeleteBracket(bracketModal.type, bracketModal.bracket.id)}
                      className="px-3 py-2 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 rounded-xl font-bold"
                    >
                      <i className="fa-solid fa-trash-can"></i>
                    </button>
                  )}
                  <button onClick={() => setBracketModal(null)} className="flex-1 py-2 bg-surface-elevated text-secondary font-bold rounded-xl">
                    {t('cancelBtn')}
                  </button>
                  <button onClick={handleSaveBracket} className="flex-1 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl">
                    {t('applyBtn')}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* SMART DELETE MODAL */}
          {smartDeleteModal && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-surface border border-subtle rounded-2xl max-w-md w-full p-5 space-y-4 shadow-2xl font-mono animate-slideIn">
                <div className="flex justify-between items-center border-b border-subtle pb-3">
                  <h3 className="font-bold text-xs text-rose-400 uppercase">
                    Kategorie "{smartDeleteModal.cat}" löschen
                  </h3>
                  <button onClick={() => setSmartDeleteModal(null)} className="text-secondary hover:text-primary">
                    <i className="fa-solid fa-xmark"></i>
                  </button>
                </div>

                <p className="text-xs text-secondary leading-relaxed">
                  Wählen Sie, wie mit bisherigen und zukünftigen Buchungen verfahren werden soll:
                </p>

                <div className="space-y-2 pt-1">
                  <button
                    onClick={() => executeSmartDelete(smartDeleteModal.type, smartDeleteModal.cat, 'future_only')}
                    className="w-full text-left p-3 rounded-xl bg-surface-elevated hover:bg-subtle border border-subtle transition"
                  >
                    <div className="text-xs font-bold text-primary">Nur für zukünftige Monate löschen</div>
                    <div className="text-[10px] text-tertiary mt-0.5">Vergangene Monate & aktueller Monat bleiben erhalten. Ab folgendem Monat auf 0 € gesetzt.</div>
                  </button>

                  <button
                    onClick={() => executeSmartDelete(smartDeleteModal.type, smartDeleteModal.cat, 'purge_and_merge')}
                    className="w-full text-left p-3 rounded-xl bg-rose-500/10 hover:bg-rose-500/15 border border-rose-500/20 transition"
                  >
                    <div className="text-xs font-bold text-rose-400">Vollständig löschen & in 'Sonstiges' überführen</div>
                    <div className="text-[10px] text-tertiary mt-0.5">Sämtliche Beträge werden lückenlos in die Auffangkategorie 'Sonstiges' gebucht. Kein Bilanzverlust.</div>
                  </button>
                </div>

                <div className="pt-2">
                  <button onClick={() => setSmartDeleteModal(null)} className="w-full py-2 bg-surface-elevated text-secondary font-bold rounded-xl text-xs">
                    {t('cancelBtn')}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* SETTINGS DRAWER */}
          {isBurgerOpen && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex justify-end">
              <div className="bg-surface border-l border-subtle w-80 h-full shadow-2xl p-5 overflow-y-auto flex flex-col justify-between animate-slideIn font-mono text-xs">
                <div className="space-y-6">
                  <div className="flex justify-between items-center pb-3 border-b border-subtle">
                    <h3 className="font-bold text-sm text-primary uppercase">{t('options')}</h3>
                    <button onClick={() => setIsBurgerOpen(false)} className="text-secondary hover:text-rose-400">
                      <i className="fa-solid fa-xmark text-base"></i>
                    </button>
                  </div>

                  <div>
                    <p className="text-[10px] font-bold text-tertiary uppercase">{t('startingCapital')}</p>
                    <div className="flex items-center bg-subtle border border-subtle rounded-xl px-3 py-1.5 focus-within:border-indigo-500 mt-1">
                      <input
                        type="number" value={data.startingCapital || ""} placeholder="0"
                        onChange={(e) => saveState({ ...data, startingCapital: parseFloat(e.target.value) || 0 })}
                        className="w-full bg-transparent text-right font-mono font-bold text-xs text-primary outline-none"
                      />
                      <span className="text-xs font-mono text-tertiary ml-1.5 font-bold">€</span>
                    </div>
                  </div>

                  <div className="space-y-1 pt-3 border-t border-subtle">
                    <p className="text-[10px] font-bold text-tertiary uppercase">{t('themeLabel')}</p>
                    <div className="grid grid-cols-3 gap-1 bg-surface-elevated border border-subtle rounded-xl p-1">
                      {['light', 'dark', 'system'].map(m => (
                        <button key={m} onClick={() => setTheme(m)} className={`py-1 rounded-lg text-[10px] font-bold ${theme === m ? 'bg-surface text-indigo-400 shadow-sm' : 'text-secondary'}`}>
                          {t(`theme${m.charAt(0).toUpperCase() + m.slice(1)}`)}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="space-y-2 pt-3 border-t border-subtle">
                    <p className="text-[10px] font-bold text-tertiary uppercase">{t('backupSection')}</p>
                    <button
                      onClick={() => {
                        const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
                        const a = document.createElement('a');
                        a.href = URL.createObjectURL(blob);
                        a.download = `cashflow_backup_${Date.now()}.json`;
                        a.click();
                      }}
                      className="w-full bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 font-bold py-2 rounded-xl text-xs flex items-center justify-center gap-2"
                    >
                      <i className="fa-solid fa-download"></i> {t('exportBackup')}
                    </button>
                    <button onClick={() => fileInputRef.current?.click()} className="w-full bg-surface-elevated border border-subtle text-primary font-bold py-2 rounded-xl text-xs flex items-center justify-center gap-2">
                      <i className="fa-solid fa-upload"></i> {t('importBackup')}
                    </button>
                    <input
                      ref={fileInputRef} type="file" accept=".json"
                      onChange={(e) => {
                        const f = e.target.files[0];
                        if (f) {
                          const r = new FileReader();
                          r.onload = async (ev) => {
                            try {
                              const parsed = JSON.parse(ev.target.result);
                              await saveState(normalizeState(parsed));
                              alert(t('importSuccess'));
                              setIsBurgerOpen(false);
                            } catch(err) { alert(t('importError')); }
                          };
                          r.readAsText(f);
                        }
                      }}
                      className="hidden"
                    />
                  </div>
                </div>

                <div className="pt-4 border-t border-subtle">
                  <button
                    onClick={async () => {
                      if (confirm(t('confirmClear'))) {
                        await saveState(normalizeState(null));
                        setIsBurgerOpen(false);
                      }
                    }}
                    className="text-xs text-rose-400 underline font-bold"
                  >
                    {t('clearAll')}
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<LanguageProvider><MainApp /></LanguageProvider>);
  </script>
</body>
</html>
