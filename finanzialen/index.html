    const LanguageContext = createContext();
    function LanguageProvider({ children }) {
      const [lang, setLang] = useState(() => safeStorage.get('budget_app_lang', 'de'));
      const changeLanguage = (l) => { setLang(l); safeStorage.set('budget_app_lang', l); };

      const getNested = (obj, path) => {
        if (!obj) return undefined;
        return path.split('.').reduce((acc, part) => (acc && acc[part] !== undefined) ? acc[part] : undefined, obj);
      };

      const t = (path, params = {}) => {
        let res = getNested(translations[lang], path) || getNested(translations['en'], path);
        if (res === undefined) {
          if (path.startsWith('months.')) return path.replace('months.', '');
          return path;
        }
        if (typeof res === 'string') {
          Object.keys(params).forEach(p => { res = res.replace(new RegExp(`{{${p}}}`, 'g'), params[p]); });
        }
        return res;
      };
      return <LanguageContext.Provider value={{ t, lang, changeLanguage }}>{children}</LanguageContext.Provider>;
    }
    const useTranslation = () => useContext(LanguageContext);

    const IDB = {
      dbName: 'LiquidCashflow_vNotion',
      open() {
        return new Promise((res, rej) => {
          const r = indexedDB.open(this.dbName, 1);
          r.onupgradeneeded = (e) => e.target.result.createObjectStore('store', { keyPath: 'id' });
          r.onsuccess = () => res(r.result);
          r.onerror = () => rej(r.error);
        });
      },
      async get(k) {
        try {
          const db = await this.open();
          return new Promise(res => {
            const tx = db.transaction('store', 'readonly');
            const req = tx.objectStore('store').get(k);
            req.onsuccess = () => res(req.result?.data);
            req.onerror = () => res(null);
          });
        } catch(e) { return null; }
      },
      async set(k, data) {
        try {
          const db = await this.open();
          return new Promise((res, rej) => {
            const tx = db.transaction('store', 'readwrite');
            tx.objectStore('store').put({ id: k, data });
            tx.oncomplete = () => res(true);
            tx.onerror = () => rej(tx.error);
          });
        } catch(e) {}
      }
    };

          type: i.type || 'borrowed'
        })),
        values: {}
      };

      const validExpenseBrackets = state.brackets.expenses.map(b => b.id);
      const validIncomeBrackets = state.brackets.incomes.map(b => b.id);

      state.categories.expenses.forEach(cat => {
        if (!state.categoryModes[cat]) state.categoryModes[cat] = autoClassifyCategory(cat).mode;
        if (!state.categoryOverrides[cat] || !validExpenseBrackets.includes(state.categoryOverrides[cat])) {
          state.categoryOverrides[cat] = autoClassifyCategory(cat).bracket;
          if (!validExpenseBrackets.includes(state.categoryOverrides[cat])) {
            state.categoryOverrides[cat] = state.brackets.expenses[0]?.id || 'housing';
          }
        }
        if (state.categoryOneTime[cat] === undefined) state.categoryOneTime[cat] = autoClassifyCategory(cat).isOneTime;
      });

      state.categories.incomes.forEach(cat => {
        if (!state.categoryModes[cat]) state.categoryModes[cat] = (cat.includes("side") || cat.includes("Sonstiges") || cat.includes("savings") || cat.includes("Darlehen")) ? 'variable' : 'fixed';
        if (!state.categoryOverrides[cat] || !validIncomeBrackets.includes(state.categoryOverrides[cat])) {
          state.categoryOverrides[cat] = state.categoryModes[cat] === 'fixed' ? 'fixed_in' : 'variable_in';
          if (!validIncomeBrackets.includes(state.categoryOverrides[cat])) {
            state.categoryOverrides[cat] = state.brackets.incomes[0]?.id || 'fixed_in';
          }
        }
      });

      ["2026", "2027", "2028"].forEach(y => {
        const yNum = parseInt(y);
        state.values[y] = { incomes: {}, expenses: {} };
        const months = getMonthsForYear(yNum);

        ['incomes', 'expenses'].forEach(type => {
          state.categories[type].forEach(cat => {
            state.values[y][type][cat] = {};
            months.forEach(m => {
              const old = raw?.values?.[y]?.[type]?.[cat]?.[m];
              const monthDays = getDaysInMonth(yNum, m);

              if (typeof old === 'object' && old !== null) {
                state.values[y][type][cat][m] = {
                  budget: typeof old.budget === 'number' ? old.budget : (parseFloat(old.total) || 0),
                  actual: typeof old.actual === 'number' ? old.actual : (parseFloat(old.total) || 0),
                  asOfDate: typeof old.asOfDate === 'number' ? old.asOfDate : monthDays
                };
              } else if (typeof old === 'number') {
                state.values[y][type][cat][m] = { budget: old, actual: old, asOfDate: monthDays };
              } else {
                state.values[y][type][cat][m] = { budget: 0, actual: 0, asOfDate: monthDays };
              }
            });
          });
        });
      });
      return state;
    };

    function MainApp() {
      const { t, lang, changeLanguage } = useTranslation();
      const [data, setData] = useState(() => normalizeState(null));
      
      const initialDate = useMemo(() => getCurrentInitialDate(), []);
      const [selectedYear, setSelectedYear] = useState(initialDate.year);
      const [selectedMonth, setSelectedMonth] = useState(initialDate.month);

      const [isOnline, setIsOnline] = useState(navigator.onLine);
      const [syncStatus, setSyncStatus] = useState("initialized");
      
      const [hideZeroes, setHideZeroes] = useState(() => safeStorage.get('budget_hide_zeroes', 'true') === 'true');
      const [isBurgerOpen, setIsBurgerOpen] = useState(false);
      const [theme, setTheme] = useState(() => safeStorage.get('budget_app_theme', 'dark'));

      const [mobileTab, setMobileTab] = useState('expenses');

      const [openBrackets, setOpenBrackets] = useState({
        housing: true, subscriptions: true, living: true, professional: true, leisure: false, other: true, fixed_in: true, variable_in: true
      });

      const [openNoteRows, setOpenNoteRows] = useState({});
      const [highlightedCategory, setHighlightedCategory] = useState(null);

      const [activeEditCat, setActiveEditCat] = useState(null);
      const [editCatForm, setEditCatForm] = useState({ name: "", bracket: "", mode: "fixed", isOneTime: false, pDay: "", notes: [] });
      const [newBulletText, setNewBulletText] = useState("");
      const [saveFeedback, setSaveFeedback] = useState(false);

      const [recurringModal, setRecurringModal] = useState(null);
      const [recurringForm, setRecurringForm] = useState({ field: 'budget', amount: 0, duration: 6 });

      const [bracketModal, setBracketModal] = useState(null);
      const [bracketForm, setBracketForm] = useState({ name: "", icon: "fa-house", color: "#2383e2" });

      const [quickAddModal, setQuickAddModal] = useState(null);
      const [quickAddForm, setQuickAddForm] = useState({ name: "", bracket: "", budget: "", mode: "variable", isOneTime: false });

      const [smartDeleteModal, setSmartDeleteModal] = useState(null);

      // Loan Installment Split Modal
      const [splitModal, setSplitModal] = useState(null);
      const [splitForm, setSplitForm] = useState({
        name: "Rückzahlung Schwester",
        totalAmount: 900,
        m1: "Okt",
        a1: 450,
        m2: "Nov",
        a2: 450
      });

      // IOU State
      const [iouPerson, setIouPerson] = useState("");
      const [iouAmount, setIouAmount] = useState("");
      const [iouType, setIouType] = useState("borrowed");

      const chartRef = useRef(null);
      const chartInstanceRef = useRef(null);
      const fileInputRef = useRef(null);

      useEffect(() => {
        safeStorage.set('budget_app_theme', theme);
        const root = document.documentElement;
        const res = theme === 'system' ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : theme;
        root.setAttribute('data-theme', res);
        if (res === 'dark') root.classList.add('dark');
        else root.classList.remove('dark');
      }, [theme]);

      useEffect(() => {
        safeStorage.set('budget_hide_zeroes', hideZeroes ? 'true' : 'false');
      }, [hideZeroes]);

      useEffect(() => {
        const on = () => setIsOnline(true);
        const off = () => setIsOnline(false);
        window.addEventListener('online', on);
        window.addEventListener('offline', off);
        return () => { window.removeEventListener('online', on); window.removeEventListener('offline', off); };
      }, []);

      useEffect(() => {
        (async () => {
          const cached = await IDB.get('app_state');
          if (cached) setData(normalizeState(cached));
        })();

        let unsub = () => {};
        if (db) {
          unsub = db.collection('monthly_logs').doc('house_finanzen_state').onSnapshot(async (doc) => {
            if (doc.exists) {
              const remote = doc.data();
              const merged = normalizeState(remote.payload);
              setData(merged);
              await IDB.set('app_state', merged);
              setSyncStatus("synced");
            }
          }, () => setSyncStatus("offline"));
        }
        return () => unsub();
      }, []);

      const saveState = async (updated) => {
        setData(updated);
        await IDB.set('app_state', updated);
        if (navigator.onLine && db) {
          setSyncStatus("syncing");
          try {
            await db.collection('monthly_logs').doc('house_finanzen_state').set({ payload: updated, updatedAt: Date.now() });
            setSyncStatus("synced");
          } catch(e) { setSyncStatus("offline"); }
        } else {
          setSyncStatus("offline");
        }
      };

      const fmt = (v) => new Intl.NumberFormat(lang === 'de' ? 'de-DE' : 'en-US', {
        style: 'currency', currency: 'EUR', maximumFractionDigits: 0
      }).format(v || 0);

      const getNode = (type, cat, yr, m) => {
        return data.values[yr]?.[type]?.[cat]?.[m] || { budget: 0, actual: 0, asOfDate: getDaysInMonth(yr, m) };
      };

      const getMonthScopedNotes = (cat, yr = selectedYear, mo = selectedMonth) => {
        const key = `${yr}_${mo}_${cat}`;
        if (data.categoryNotes && Array.isArray(data.categoryNotes[key])) {
          return data.categoryNotes[key];
        }
        return [];
      };

      const updateNode = async (type, cat, yr, m, field, val) => {
        const copy = JSON.parse(JSON.stringify(data));
        if (!copy.values[yr][type][cat]) copy.values[yr][type][cat] = {};
        if (!copy.values[yr][type][cat][m]) {
          copy.values[yr][type][cat][m] = { budget: 0, actual: 0, asOfDate: getDaysInMonth(yr, m) };
        }
        const num = parseFloat(val);
        copy.values[yr][type][cat][m][field] = isNaN(num) ? 0 : num;
        await saveState(copy);
      };

      const forwardTimeline = useMemo(() => {
        let runningBalance = data.startingCapital || 0;
        const timeline = [];
        const years = [2026, 2027, 2028];

        years.forEach(yr => {
          const months = getMonthsForYear(yr);
          months.forEach(m => {
            const daysInMonth = getDaysInMonth(yr, m);
            let budgetIn = 0, actualIn = 0;
            let budgetEx = 0, actualEx = 0;
            let projectedEx = 0;

            data.categories.incomes.forEach(cat => {
              const node = getNode('incomes', cat, yr, m);
              budgetIn += node.budget;
              actualIn += node.actual;
            });

            data.categories.expenses.forEach(cat => {
              const node = getNode('expenses', cat, yr, m);
              const mode = data.categoryModes[cat] || 'variable';
              const isOneTime = data.categoryOneTime[cat];
              budgetEx += node.budget;
              actualEx += node.actual;

              if (mode === 'fixed' || isOneTime) {
                projectedEx += (node.actual > 0 ? node.actual : node.budget);
              } else {
                const asOf = Math.min(daysInMonth, Math.max(1, node.asOfDate || daysInMonth));
                if (node.actual > 0) {
                  const burn = node.actual / asOf;
                  const remainDays = Math.max(0, daysInMonth - asOf);
                  projectedEx += (node.actual + (burn * remainDays));
                } else {
                  projectedEx += node.budget;
                }
              }
            });

            const effectiveIn = actualIn > 0 ? actualIn : budgetIn;
            const actualNet = actualIn - actualEx;
            const projectedNet = effectiveIn - projectedEx;

            const monthNetRollover = actualEx > 0 ? projectedNet : (budgetIn - budgetEx);
            const startBal = runningBalance;
            runningBalance += monthNetRollover;

            timeline.push({
              year: yr, month: m, key: `${m} ${yr}`, daysInMonth,
              budgetIn, actualIn, budgetEx, actualEx, projectedEx,
              actualNet, projectedNet, startBal, endProjectedBalance: runningBalance
            });
          });
        });
        return timeline;
      }, [data]);

      const currentMetrics = useMemo(() => {
        if (selectedMonth === "AnnualOverview") return forwardTimeline[0];
        const match = forwardTimeline.find(t => t.year === selectedYear && t.month === selectedMonth);
        return match || forwardTimeline[0];
      }, [forwardTimeline, selectedYear, selectedMonth]);

      const categoryAnalytics = useMemo(() => {
        if (selectedMonth === "AnnualOverview") return [];
        const daysInMonth = currentMetrics.daysInMonth;

        return data.categories.expenses.map(cat => {
          const node = getNode('expenses', cat, selectedYear, selectedMonth);
          const mode = data.categoryModes[cat] || 'variable';
          const isOneTime = !!data.categoryOneTime[cat];
          const asOf = Math.min(daysInMonth, Math.max(1, node.asOfDate || daysInMonth));
          const daysLeft = Math.max(0, daysInMonth - asOf);

          const expectedPace = (node.budget / daysInMonth) * asOf;
          const remainingBudget = node.budget - node.actual;
          const safeDailySpend = daysLeft > 0 ? Math.max(0, remainingBudget / daysLeft) : 0;

          let paceStatus = "ontrack";
          if (mode === 'variable' && node.budget > 0) {
            if (node.actual > expectedPace * 1.08) paceStatus = "over";
            else if (node.actual < expectedPace * 0.85) paceStatus = "frugal";
          }

          let projectedTotal = node.budget;
          if (mode === 'fixed' || isOneTime) {
            projectedTotal = node.actual > 0 ? node.actual : node.budget;
          } else if (node.actual > 0) {
            projectedTotal = node.actual + ((node.actual / asOf) * daysLeft);
          }

          return {
            category: cat, budget: node.budget, actual: node.actual,
            asOfDate: asOf, daysLeft, remainingBudget, safeDailySpend,
            projectedTotal, paceStatus,
            bracket: data.categoryOverrides[cat] || autoClassifyCategory(cat).bracket,
            mode, isOneTime,
            notes: getMonthScopedNotes(cat, selectedYear, selectedMonth)
          };
        });
      }, [data, selectedYear, selectedMonth, currentMetrics]);

      const checkDuplicate = (name, excludeCat = null) => {
        if (!name.trim()) return null;
        const test = name.trim().toLowerCase();
        for (const cat of data.categories.expenses) {
          if (excludeCat && cat.toLowerCase() === excludeCat.toLowerCase()) continue;
          if (cat.toLowerCase() === test) {
            const b = data.categoryOverrides[cat] || autoClassifyCategory(cat).bracket;
            const bObj = data.brackets.expenses.find(x => x.id === b);
            return { exists: true, type: 'expenses', bracket: bObj?.name || b, name: cat };
          }
        }
        for (const cat of data.categories.incomes) {
          if (excludeCat && cat.toLowerCase() === excludeCat.toLowerCase()) continue;
          if (cat.toLowerCase() === test) {
            const b = data.categoryOverrides[cat] || 'incomes';
            const bObj = data.brackets.incomes.find(x => x.id === b);
            return { exists: true, type: 'incomes', bracket: bObj?.name || b, name: cat };
          }
        }
        return null;
      };

      // Create Category with One-Time Scope
      const handleCreateCategory = async (type, name, bracketId, mode, initialBudget = 0, isOneTime = false) => {
        const val = name.trim();
        if (!val) return;
        const dup = checkDuplicate(val);
        if (dup) {
          alert(`Eintrag existiert bereits: "${dup.name}" (${dup.bracket})`);
          return;
        }

        const copy = JSON.parse(JSON.stringify(data));
        copy.categories[type].push(val);
        copy.categoryOverrides[val] = bracketId;
        copy.categoryModes[val] = mode || 'variable';
        copy.categoryOneTime[val] = !!isOneTime;

        ["2026", "2027", "2028"].forEach(y => {
          if (!copy.values[y][type][val]) copy.values[y][type][val] = {};
          getMonthsForYear(parseInt(y)).forEach(m => {
            const isSelectedMonth = (parseInt(y) === selectedYear && m === selectedMonth);
            copy.values[y][type][val][m] = {
              budget: isOneTime ? (isSelectedMonth ? (parseFloat(initialBudget) || 0) : 0) : (parseFloat(initialBudget) || 0),
              actual: 0,
              asOfDate: getDaysInMonth(parseInt(y), m)
            };
          });
        });

        setOpenBrackets(prev => ({ ...prev, [bracketId]: true }));
        setHighlightedCategory(val);
        setTimeout(() => setHighlightedCategory(null), 2500);

        await saveState(copy);
        setQuickAddModal(null);
      };

      const handleOpenQuickAdd = (type, defaultBracket = null) => {
        const bracketsList = type === 'incomes' ? data.brackets.incomes : data.brackets.expenses;
        const chosenBracket = defaultBracket || bracketsList[0]?.id || 'other';
        setQuickAddModal({ type });
        setQuickAddForm({
          name: "",
          bracket: chosenBracket,
          budget: "",
          mode: type === 'incomes' ? 'fixed' : 'variable',
          isOneTime: false
        });
      };

      const handleOpenRecurring = (type, cat) => {
        const node = getNode(type, cat, selectedYear, selectedMonth);
        const preferPlan = node.budget > 0;
        setRecurringModal({ type, cat });
        setRecurringForm({
          field: preferPlan ? 'budget' : 'actual',
          amount: preferPlan ? node.budget : node.actual,
          duration: 6
        });
      };

      const handleExecuteRecurring = async () => {
        if (!recurringModal) return;
        const { type, cat } = recurringModal;
        const { field, amount, duration } = recurringForm;

        const copy = JSON.parse(JSON.stringify(data));
        const allMonths = [];
        ["2026", "2027", "2028"].forEach(yr => {
          getMonthsForYear(parseInt(yr)).forEach(mo => allMonths.push({ yr, mo }));
        });

        const startIdx = allMonths.findIndex(t => t.yr === String(selectedYear) && t.mo === selectedMonth);
        if (startIdx !== -1) {
          const limit = duration === 'all' ? allMonths.length - startIdx : parseInt(duration);
          for (let i = 0; i < limit; i++) {
            const target = allMonths[startIdx + i];
            if (target) {
              if (!copy.values[target.yr][type][cat]) copy.values[target.yr][type][cat] = {};
              if (!copy.values[target.yr][type][cat][target.mo]) {
                copy.values[target.yr][type][cat][target.mo] = {
                  budget: 0, actual: 0, asOfDate: getDaysInMonth(parseInt(target.yr), target.mo)
                };
              }
              copy.values[target.yr][type][cat][target.mo][field] = parseFloat(amount) || 0;
            }
          }
        }

        await saveState(copy);
        setRecurringModal(null);
      };

      const handleOpenEditCategory = (type, cat) => {
        setActiveEditCat({ type, cat });
        setEditCatForm({
          name: cat,
          bracket: data.categoryOverrides[cat] || (type === 'incomes' ? 'fixed_in' : 'other'),
          mode: data.categoryModes[cat] || 'fixed',
          isOneTime: !!data.categoryOneTime[cat],
          pDay: data.fixedPaymentDays?.[cat] || "",
          notes: [...getMonthScopedNotes(cat, selectedYear, selectedMonth)]
        });
        setNewBulletText("");
        setSaveFeedback(false);
      };

      const handleSaveCategoryChanges = async () => {
        if (!activeEditCat) return;
        const { type, cat: oldName } = activeEditCat;
        const newName = editCatForm.name.trim();

        if (!newName) return;
        if (newName !== oldName) {
          const dup = checkDuplicate(newName, oldName);
          if (dup) {
            alert(`Kategorie existiert bereits: "${dup.name}"`);
            return;
          }
        }

        const copy = JSON.parse(JSON.stringify(data));

        if (newName !== oldName) {
          copy.categories[type] = copy.categories[type].map(c => c === oldName ? newName : c);
          ["2026", "2027", "2028"].forEach(y => {
            if (copy.values[y]?.[type]?.[oldName]) {
              copy.values[y][type][newName] = copy.values[y][type][oldName];
              delete copy.values[y][type][oldName];
            }
          });
        }

        copy.categoryOverrides[newName] = editCatForm.bracket;
        copy.categoryModes[newName] = editCatForm.mode;
        copy.categoryOneTime[newName] = editCatForm.isOneTime;

        if (!copy.categoryNotes) copy.categoryNotes = {};
        const noteKey = `${selectedYear}_${selectedMonth}_${newName}`;
        copy.categoryNotes[noteKey] = editCatForm.notes;

        const dayNum = parseInt(editCatForm.pDay);
        copy.fixedPaymentDays[newName] = isNaN(dayNum) ? null : dayNum;

        if (newName !== oldName) {
          delete copy.categoryOverrides[oldName];
          delete copy.categoryModes[oldName];
          delete copy.categoryOneTime[oldName];
          delete copy.fixedPaymentDays[oldName];
        }

        await saveState(copy);
        setActiveEditCat({ type, cat: newName });
        setSaveFeedback(true);
        setTimeout(() => setSaveFeedback(false), 2000);
      };

      const handleAddBulletPoint = () => {
        if (!newBulletText.trim()) return;
        setEditCatForm(prev => ({ ...prev, notes: [...prev.notes, newBulletText.trim()] }));
        setNewBulletText("");
      };

      const handleRemoveBulletPoint = (index) => {
        setEditCatForm(prev => ({ ...prev, notes: prev.notes.filter((_, i) => i !== index) }));
      };

      const executeSmartDelete = async (type, cat, deleteScope) => {
        const copy = JSON.parse(JSON.stringify(data));
        const allMonthsTimeline = [];
        ["2026", "2027", "2028"].forEach(y => {
          getMonthsForYear(parseInt(y)).forEach(m => allMonthsTimeline.push({ y, m }));
        });
        const currentIdx = allMonthsTimeline.findIndex(t => t.y === String(selectedYear) && t.m === selectedMonth);

        if (deleteScope === 'future_only') {
          for (let i = currentIdx + 1; i < allMonthsTimeline.length; i++) {
            const { y, m } = allMonthsTimeline[i];
            if (copy.values[y]?.[type]?.[cat]?.[m]) {
              copy.values[y][type][cat][m] = { budget: 0, actual: 0, asOfDate: getDaysInMonth(parseInt(y), m) };
            }
          }
        } else if (deleteScope === 'purge_and_merge') {
          const fallback = "Sonstiges";
          if (!copy.categories[type].includes(fallback)) {
            copy.categories[type].push(fallback);
            copy.categoryModes[fallback] = copy.categoryModes[cat] || 'fixed';
            copy.categoryOverrides[fallback] = type === 'incomes' ? 'variable_in' : 'other';
          }

          allMonthsTimeline.forEach(({ y, m }) => {
            if (!copy.values[y][type][fallback]) copy.values[y][type][fallback] = {};
            if (!copy.values[y][type][fallback][m]) {
              copy.values[y][type][fallback][m] = { budget: 0, actual: 0, asOfDate: getDaysInMonth(parseInt(y), m) };
            }
            const incoming = getNode(type, cat, y, m);
            copy.values[y][type][fallback][m].budget += incoming.budget;
            copy.values[y][type][fallback][m].actual += incoming.actual;
          });

          copy.categories[type] = copy.categories[type].filter(c => c !== cat);
          ["2026", "2027", "2028"].forEach(y => {
            if (copy.values[y]?.[type]?.[cat]) delete copy.values[y][type][cat];
          });
          delete copy.categoryModes[cat];
          delete copy.categoryOverrides[cat];
          delete copy.categoryOneTime[cat];
          delete copy.fixedPaymentDays[cat];
        }

        await saveState(copy);
        setSmartDeleteModal(null);
      };

      const handleOpenBracketModal = (mode, type, bracket = null) => {
        setBracketModal({ mode, type, bracket });
        if (mode === 'edit' && bracket) {
          setBracketForm({ name: bracket.name, icon: bracket.icon, color: bracket.color || "#2383e2" });
        } else {
          setBracketForm({ name: "", icon: "fa-house", color: "#2383e2" });
        }
      };

      const handleSaveBracket = async () => {
        if (!bracketForm.name.trim() || !bracketModal) return;
        const copy = JSON.parse(JSON.stringify(data));
        const { mode, type, bracket } = bracketModal;

        if (mode === 'add') {
          const id = 'bracket_' + Date.now();
          copy.brackets[type].push({
            id, name: bracketForm.name.trim(), icon: bracketForm.icon, color: bracketForm.color
          });
          setOpenBrackets(prev => ({ ...prev, [id]: true }));
        } else if (mode === 'edit' && bracket) {
          copy.brackets[type] = copy.brackets[type].map(b => b.id === bracket.id ? {
            ...b, name: bracketForm.name.trim(), icon: bracketForm.icon, color: bracketForm.color
          } : b);
        }

        await saveState(copy);
        setBracketModal(null);
      };

      const handleDeleteBracket = async (type, bracketId) => {
        if (!confirm("Kategorie entfernen? Enthaltene Posten werden nach 'Sonstiges' verschoben.")) return;
        const copy = JSON.parse(JSON.stringify(data));
        const fallbackBracket = type === 'incomes' ? 'variable_in' : 'other';

        copy.categories[type].forEach(cat => {
          if (copy.categoryOverrides[cat] === bracketId) copy.categoryOverrides[cat] = fallbackBracket;
        });

        copy.brackets[type] = copy.brackets[type].filter(b => b.id !== bracketId);
        await saveState(copy);
        setBracketModal(null);
      };

      const toggleBracket = (id) => setOpenBrackets(prev => ({ ...prev, [id]: !prev[id] }));

      const toggleAllBrackets = () => {
        const anyClosed = Object.values(openBrackets).some(v => !v);
        const nextState = {};
        [...data.brackets.expenses, ...data.brackets.incomes].forEach(b => {
          nextState[b.id] = anyClosed;
        });
        setOpenBrackets(nextState);
      };

      // IOU / Debts logic
      const activeIous = useMemo(() => (data.ious || []).filter(i => !i.settled), [data.ious]);
      const totalBorrowed = useMemo(() => activeIous.filter(i => i.type === 'borrowed').reduce((s, i) => s + (parseFloat(i.amount) || 0), 0), [activeIous]);
      const totalLent = useMemo(() => activeIous.filter(i => i.type !== 'borrowed').reduce((s, i) => s + (parseFloat(i.amount) || 0), 0), [activeIous]);

      const handleAddIou = async () => {
        if (!iouPerson.trim() || !iouAmount || isNaN(parseFloat(iouAmount))) return;
        const copy = { 
          ...data, 
          ious: [
            ...(data.ious || []), 
            {
              id: 'iou_' + Date.now(),
              person: iouPerson.trim(),
              amount: parseFloat(iouAmount),
              type: iouType,
              date: new Date().toLocaleDateString(lang === 'de' ? 'de-DE' : 'en-US', { day: '2-digit', month: 'short' }),
              settled: false
            }
          ]
        };
        setIouPerson("");
        setIouAmount("");
        await saveState(copy);
      };

      const handleSettleIou = async (id) => {
        const copy = { ...data, ious: data.ious.map(i => i.id === id ? { ...i, settled: true } : i) };
        await saveState(copy);
      };

      // Quick-Schedule Sister Loan Repayments (Okt & Nov)
      const handleExecuteSplitLoan = async () => {
        const copy = JSON.parse(JSON.stringify(data));
        const catName = splitForm.name.trim() || "Rückzahlung Schwester";

        // 1. Ensure expense category exists
        if (!copy.categories.expenses.includes(catName)) {
          copy.categories.expenses.push(catName);
          copy.categoryOverrides[catName] = 'other';
          copy.categoryModes[catName] = 'fixed';
          copy.categoryOneTime[catName] = true; // Mark as One-Time so it auto-hides outside Okt/Nov!
        }

        // Initialize values for all months
        ["2026", "2027", "2028"].forEach(y => {
          if (!copy.values[y].expenses[catName]) copy.values[y].expenses[catName] = {};
          getMonthsForYear(parseInt(y)).forEach(m => {
            if (!copy.values[y].expenses[catName][m]) {
              copy.values[y].expenses[catName][m] = { budget: 0, actual: 0, asOfDate: getDaysInMonth(parseInt(y), m) };
            }
          });
        });

        // Set Month 1 (e.g. Okt 2026)
        if (copy.values[selectedYear]?.expenses?.[catName]?.[splitForm.m1]) {
          copy.values[selectedYear].expenses[catName][splitForm.m1].budget = parseFloat(splitForm.a1) || 0;
        }

        // Set Month 2 (e.g. Nov 2026)
        if (copy.values[selectedYear]?.expenses?.[catName]?.[splitForm.m2]) {
          copy.values[selectedYear].expenses[catName][splitForm.m2].budget = parseFloat(splitForm.a2) || 0;
        }

        await saveState(copy);
        setSplitModal(null);
        alert(`Erfolgreich eingetragen: ${catName} mit je ${fmt(splitForm.a1)} in ${splitForm.m1} und ${fmt(splitForm.a2)} in ${splitForm.m2}!`);
      };

      useEffect(() => {
        if (selectedMonth === "AnnualOverview" || !chartRef.current) return;
        const ctx = chartRef.current.getContext('2d');
        if (chartInstanceRef.current) chartInstanceRef.current.destroy();

        const monthsForYear = getMonthsForYear(selectedYear);
        const translatedLabels = monthsForYear.map(m => formatMonth(m, lang));
        const incomesData = monthsForYear.map(m => {
          return data.categories.incomes.reduce((s, cat) => s + getNode('incomes', cat, selectedYear, m).actual, 0);
        });

        const datasets = [
          {
            label: t('incomesHeader'),
            data: incomesData,
            backgroundColor: '#0f7b6c',
            borderRadius: 3,
            stack: 'Stack0'
          },
          ...data.brackets.expenses.map(b => ({
            label: b.name,
            data: monthsForYear.map(m => {
              return data.categories.expenses
                .filter(cat => (data.categoryOverrides[cat] || autoClassifyCategory(cat).bracket) === b.id)
                .reduce((s, cat) => s + getNode('expenses', cat, selectedYear, m).actual, 0);
            }),
            backgroundColor: b.color || '#787774',
            borderRadius: 2,
            stack: 'Stack1'
          }))
        ];

        const isDark = theme === 'dark';
        const axisColor = isDark ? '#9b9a97' : '#787774';

        chartInstanceRef.current = new Chart(ctx, {
          type: 'bar',
          data: { labels: translatedLabels, datasets },
          options: {
            responsive: true, maintainAspectRatio: false,
            scales: {
              x: { ticks: { color: axisColor, font: { family: 'inherit', size: 10, weight: '500' } }, grid: { display: false } },
              y: { beginAtZero: true, ticks: { color: axisColor, font: { family: 'inherit', size: 9 }, callback: v => fmt(v) }, grid: { color: isDark ? 'rgba(255,255,255,0.04)' : 'rgba(0,0,0,0.04)' } }
            },
            plugins: {
              legend: { position: 'top', labels: { color: axisColor, usePointStyle: true, boxWidth: 6, font: { family: 'inherit', size: 10 } } }
            }
          }
        });

        return () => { if (chartInstanceRef.current) chartInstanceRef.current.destroy(); };
      }, [data, selectedYear, selectedMonth, lang, theme]);

      return (
        <div className="flex flex-col min-h-screen font-sans">

          {/* 1. NOTION TOP NAVBAR */}

            <div className="flex items-center space-x-2">
              <span className="text-base">📋</span>
              <div className="flex items-center gap-1.5 text-xs text-secondary font-mono">

                <span>/</span>
                <span className="text-tertiary">{selectedYear}</span>
              </div>
            </div>

            {/* Year Selector */}

              {[2026, 2027, 2028].map(yr => (

              <button
                onClick={() => setIsBurgerOpen(true)}
                className="w-7 h-7 rounded hover:bg-subtle text-secondary hover:text-primary flex items-center justify-center"
              >
                <i className="fa-solid fa-sliders text-xs"></i>
              </button>
            </div>
          </header>

          {/* 2. NOTION HORIZONTAL MONTH TABS */}
          <nav className="sticky top-12 z-40 bg-surface border-b border-subtle px-3 py-1 overflow-x-auto scrollbar-none flex items-center gap-1 text-xs">
            <div className="flex items-center space-x-0.5 overflow-x-auto scrollbar-none flex-grow">
              {getMonthsForYear(selectedYear).map(m => (

              >
                <span>{t('expensesHeader')}</span>
                <span className="block text-[9px] opacity-75">{fmt(currentMetrics.actualEx)}</span>

              >
                <span>{t('incomesHeader')}</span>
                <span className="block text-[9px] opacity-75">{fmt(currentMetrics.actualIn)}</span>
              </button>

              <button

                className={`py-1 rounded font-medium transition ${
                  mobileTab === 'cockpit' ? 'bg-surface text-primary shadow-xs font-semibold' : 'text-secondary'
                }`}
              >
                <span>{t('analyticsTab')}</span>
                <span className="block text-[9px] opacity-75">{fmt(currentMetrics.actualNet)}</span>
              </button>
            </div>
          </div>

          {/* MAIN NOTION CANVAS */}

              <h1 className="text-xl sm:text-2xl font-bold tracking-tight text-primary flex items-center gap-2">
                <span>🏠</span>
                <span>{formatMonth(selectedMonth, lang)} {selectedYear}</span>
              </h1>
              <p className="text-xs text-secondary">{t('subtitle')}</p>
            </div>

            {/* COCKPIT HERO: ALWAYS ON DESKTOP, OR WHEN mobileTab === 'cockpit' */}

              {/* Notion Properties Grid */}
              <div className="grid grid-cols-2 lg:grid-cols-4 gap-2">
                <div className="p-3 rounded-lg border border-subtle bg-surface-elevated flex flex-col justify-between">
                  <div className="flex items-center gap-1.5 text-secondary text-[11px]">
                    <span>⚖️</span>
                    <span>{t('kpiActualNet')}</span>
                  </div>
                  <div className={`text-lg font-mono font-bold mt-1 ${currentMetrics.actualNet >= 0 ? 'text-notion-green dark:text-emerald-400' : 'text-notion-red'}`}>
                    {fmt(currentMetrics.actualNet)}
                  </div>
                  <span className="text-[10px] font-mono text-tertiary">In {fmt(currentMetrics.actualIn)} · Out {fmt(currentMetrics.actualEx)}</span>

                    <span>{t('kpiProjectedNet')}</span>
                  </div>

                    {fmt(currentMetrics.projectedNet)}

                  <span className="text-[10px] font-mono text-tertiary">Prognose: {fmt(currentMetrics.projectedEx)}</span>
                </div>

                  <div className="text-lg font-mono font-bold text-primary mt-1">

                    <span className="text-[10px] font-normal text-secondary"> {t('perDayLabel')}</span>
                  </div>
                  <span className="text-[10px] font-mono text-tertiary">Freies Tagesbudget</span>

                    <span>{t('kpiCumulative')}</span>

                    <span className="text-xs">🤝</span>
                    <span className="text-xs font-semibold text-primary uppercase tracking-wide">{t('iouTitle')}</span>
                  </div>
                  <div className="flex items-center gap-3 text-xs font-mono">
                    {totalBorrowed > 0 && <span className="text-notion-red font-semibold">Schulden: {fmt(totalBorrowed)}</span>}
                    {totalLent > 0 && <span className="text-notion-green font-semibold">Forderung: {fmt(totalLent)}</span>}
                  </div>
                </div>

                {/* Entry Inputs */}
                <div className="flex flex-col sm:flex-row gap-1.5">
                  <select
                    value={iouType}
                    onChange={(e) => setIouType(e.target.value)}
                    className="bg-subtle border border-subtle text-primary text-xs rounded px-2 py-1.5 outline-none font-medium"

                    <option value="borrowed">Ich schulde (Leihe/Kredit)</option>
                    <option value="lent">Mir wird geschuldet (Verliehen)</option>
                  </select>

                  <input
                    type="text" placeholder={t('iouPersonPlaceholder')}
                    value={iouPerson} onChange={(e) => setIouPerson(e.target.value)}
                    className="flex-1 bg-subtle border border-subtle text-primary text-xs rounded px-2.5 py-1.5 outline-none focus:border-strong"
                  />

                  <div className="flex items-center bg-subtle border border-subtle rounded px-2 py-1 w-full sm:w-28">
                    <input
                      type="number" inputMode="decimal" placeholder={t('iouAmountPlaceholder')}
                      value={iouAmount} onChange={(e) => setIouAmount(e.target.value)}
                      className="w-full bg-transparent text-primary text-xs font-mono font-medium outline-none text-right"
                    />
                    <span className="text-xs font-mono text-tertiary ml-1">€</span>
                  </div>

                  <button
                    onClick={handleAddIou}
                    className="bg-subtle hover:bg-subtle/80 text-primary border border-subtle font-medium px-3 py-1.5 rounded text-xs transition"
                  >
                    + {t('iouAddBtn')}
                  </button>

                {/* Direct Action for Sister Loan Situation */}
                <div className="p-2.5 rounded bg-subtle/60 border border-subtle flex flex-col sm:flex-row sm:items-center justify-between gap-2 text-xs">
                  <div className="flex items-center gap-2">

                    <span className="text-secondary leading-snug">
                      Schwester leiht 900 €? Automatisch in 2 Raten à 450 € (Okt / Nov) aufteilen:
                    </span>

                  <button

                      setSplitForm({

                        totalAmount: 900,
                        m1: "Okt",
                        a1: 450,
                        m2: "Nov",
                        a2: 450
                      });
                      setSplitModal(true);

                    className="px-2.5 py-1 bg-surface border border-subtle text-primary rounded text-xs font-medium hover:bg-subtle transition whitespace-nowrap self-start sm:self-auto"
                  >
                    ⚡ Ratenplan in Budget eintragen
                  </button>
                </div>

                {/* List of active IOUs */}
                {activeIous.length > 0 && (
                  <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2 pt-1">
                    {activeIous.map(item => {
                      const isBorrowed = item.type === 'borrowed';
                      return (
                        <div key={item.id} className="p-2.5 rounded border border-subtle bg-surface-elevated flex items-center justify-between text-xs">
                          <div>
                            <div className="font-semibold text-primary">{item.person}</div>
                            <div className="text-[10px] text-tertiary">
                              {item.date} · <span className={isBorrowed ? 'text-notion-red' : 'text-notion-green'}>{isBorrowed ? 'Schulde ich' : 'Bekomme ich'}</span>
                            </div>
                          </div>
                          <div className="flex items-center gap-2">
                            <span className={`font-mono font-semibold ${isBorrowed ? 'text-notion-red' : 'text-notion-green'}`}>
                              {fmt(item.amount)}
                            </span>
                            <button
                              onClick={() => handleSettleIou(item.id)}
                              className="px-2 py-0.5 rounded text-[10px] bg-subtle hover:bg-emerald-500/10 text-secondary hover:text-emerald-500 border border-subtle"
                              title={t('iouMarkReturned')}
                            >
                              ✓
                            </button>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>

              {/* Chart Container */}
              <div className="rounded-lg border border-subtle bg-surface p-3">
                <div className="h-[180px] relative w-full">
                  <canvas ref={chartRef}></canvas>
                </div>
              </div>

            </div>

            {/* NOTION DATABASE CONTROLS (Toggle 0€ items & Accordions) */}
            <div className={`flex flex-wrap items-center justify-between gap-2 border-b border-subtle pb-2 text-xs ${mobileTab === 'cockpit' ? 'hidden lg:flex' : 'flex'}`}>
              <div className="flex items-center gap-2">
                <button
                  onClick={() => setHideZeroes(prev => !prev)}
                  className={`px-2 py-1 rounded text-xs transition flex items-center gap-1.5 border ${
                    hideZeroes
                      ? 'bg-subtle text-primary border-subtle font-medium'
                      : 'bg-surface text-secondary border-subtle'
                  }`}
                >
                  <i className={`fa-solid ${hideZeroes ? 'fa-eye-slash' : 'fa-eye'} text-[10px]`}></i>
                  <span>{hideZeroes ? t('hideZeroesBtn') : t('showAllBtn')}</span>
                </button>

                <span className="text-[11px] text-tertiary">
                  (Einmalige 0 € Posten bleiben sauber ausgeblendet)
                </span>
              </div>

              <button
                onClick={toggleAllBrackets}

              >

                <span>{Object.values(openBrackets).some(v => !v) ? 'Alle aufklappen' : 'Alle schließen'}</span>
              </button>
            </div>

                    </span>
                    <button

                    className="w-full text-left p-2 rounded bg-rose-500/10 hover:bg-rose-500/20 border border-rose-500/20"
                  >
                    <div className="font-semibold text-notion-red">Vollständig löschen & nach 'Sonstiges' verschieben</div>
                    <div className="text-[10px] text-tertiary">Kein Bilanzverlust.</div>
                  </button>
                </div>

                <button onClick={() => setSmartDeleteModal(null)} className="w-full py-1.5 bg-subtle rounded text-secondary hover:text-primary">
                  Abbrechen
                </button>
              </div>
            </div>
          )}

          {/* SETTINGS DRAWER */}
          {isBurgerOpen && (
            <div className="fixed inset-0 bg-black/60 backdrop-blur-xs z-50 flex justify-end">
              <div className="bg-surface border-l border-subtle w-72 sm:w-80 h-full p-4 overflow-y-auto flex flex-col justify-between text-xs">
                <div className="space-y-4">
                  <div className="flex justify-between items-center pb-2 border-b border-subtle">
                    <h3 className="font-semibold text-primary uppercase tracking-wide">{t('options')}</h3>
                    <button onClick={() => setIsBurgerOpen(false)} className="text-secondary hover:text-primary">
                      <i className="fa-solid fa-xmark"></i>
                    </button>
                  </div>

                  <div>
                    <label className="text-[10px] text-secondary block mb-1">{t('startingCapital')}</label>
                    <div className="flex items-center bg-subtle border border-subtle rounded px-2.5 py-1.5 focus-within:border-strong">
                      <input
                        type="number" inputMode="decimal" value={data.startingCapital || ""} placeholder="0"
                        onChange={(e) => saveState({ ...data, startingCapital: parseFloat(e.target.value) || 0 })}
                        className="w-full bg-transparent text-right font-mono text-xs text-primary outline-none font-semibold"
                      />
                      <span className="text-xs font-mono text-tertiary ml-1">€</span>
                    </div>
                  </div>

                  <div>
                    <label className="text-[10px] text-secondary block mb-1">{t('themeLabel')}</label>
                    <div className="grid grid-cols-3 gap-1 bg-subtle p-0.5 rounded border border-subtle">
                      {['light', 'dark', 'system'].map(m => (
                        <button key={m} onClick={() => setTheme(m)} className={`py-1 rounded text-[10px] font-medium ${theme === m ? 'bg-surface text-primary shadow-xs font-semibold' : 'text-secondary'}`}>
                          {t(`theme${m.charAt(0).toUpperCase() + m.slice(1)}`)}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="space-y-1.5 pt-2 border-t border-subtle">
                    <label className="text-[10px] text-secondary block mb-1">{t('backupSection')}</label>
                    <button
                      onClick={() => {
                        const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
                        const a = document.createElement('a');
                        a.href = URL.createObjectURL(blob);
                        a.download = `budget_backup_${Date.now()}.json`;
                        a.click();
                      }}
                      className="w-full bg-subtle hover:bg-subtle/80 border border-subtle font-medium py-1.5 rounded flex items-center justify-center gap-1.5 text-primary"
                    >
                      <i className="fa-solid fa-download"></i> {t('exportBackup')}
                    </button>

                    <button
                      onClick={() => fileInputRef.current?.click()}
                      className="w-full bg-subtle hover:bg-subtle/80 border border-subtle font-medium py-1.5 rounded flex items-center justify-center gap-1.5 text-primary"
                    >
                      <i className="fa-solid fa-upload"></i> {t('importBackup')}
                    </button>
                    <input
                      ref={fileInputRef} type="file" accept=".json"
                      onChange={(e) => {
                        const f = e.target.files[0];
                        if (f) {
                          const r = new FileReader();
                          r.onload = async (ev) => {
                            try {
                              const parsed = JSON.parse(ev.target.result);
                              await saveState(normalizeState(parsed));
                              alert(t('importSuccess'));
                              setIsBurgerOpen(false);
                            } catch(err) { alert(t('importError')); }
                          };
                          r.readAsText(f);
                        }
                      }}
                      className="hidden"
                    />
                  </div>
                </div>

                <div className="pt-3 border-t border-subtle">
                  <button
                    onClick={async () => {
                      if (confirm(t('confirmClear'))) {
                        await saveState(normalizeState(null));
                        setIsBurgerOpen(false);
                      }
                    }}
                    className="text-xs text-notion-red underline"
                  >
                    {t('clearAll')}
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<LanguageProvider><MainApp /></LanguageProvider>);
  </script>
</body>
</html>
