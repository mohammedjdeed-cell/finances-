            let fallback = translations['en'];
            for (const fallbackKey of keys) {
              if (fallback && fallback[fallbackKey] !== undefined) fallback = fallback[fallbackKey];
              else { fallback = null; break; }
            }
            return fallback || path;
          }
        }
        return translation;
      };

      open() {
        return new Promise((resolve, reject) => {
          const request = indexedDB.open(this.dbName, this.dbVersion);
          request.onupgradeneeded = (e) => {
            const database = e.target.result;
            if (!database.objectStoreNames.contains('state')) database.createObjectStore('state', { keyPath: 'id' });
            if (!database.objectStoreNames.contains('queue')) database.createObjectStore('queue', { keyPath: 'id' });
          };
          request.onsuccess = (e) => resolve(e.target.result);
          request.onerror = (e) => reject(e.target.error);
        });
      },
      async get(storeName, key) {
        const database = await this.open();
        return new Promise((resolve, reject) => {
          const tx = database.transaction(storeName, 'readonly');
          const request = tx.objectStore(storeName).get(key);
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
        });
      },
      async set(storeName, value) {
        const database = await this.open();
        return new Promise((resolve, reject) => {
          const tx = database.transaction(storeName, 'readwrite');
          const request = tx.objectStore(storeName).put(value);
          request.onsuccess = () => resolve();
          request.onerror = () => reject(request.error);
        });
      },
      async delete(storeName, key) {
        const database = await this.open();
        return new Promise((resolve, reject) => {
          const tx = database.transaction(storeName, 'readwrite');
          const request = tx.objectStore(storeName).delete(key);
          request.onsuccess = () => resolve();
          request.onerror = () => reject(request.error);
        });
      }

        if (typeof val === 'object' && val !== null) {
          return val[weekKey] || 0;
        }
        if (weekKey === 'w1') return parseFloat(val) || 0;
        return 0;
      };

      const getDaysInMonth = (year, monthStr) => {
        const monthMap = {
          "Jan": 0, "Feb": 1, "Mrz": 2, "Apr": 3, "Mai": 4, "Jun": 5,
          "Jul": 6, "Aug": 7, "Sep": 8, "Okt": 9, "Nov": 10, "Dez": 11
        };
        const mIdx = monthMap[monthStr] !== undefined ? monthMap[monthStr] : 5;
        return new Date(year, mIdx + 1, 0).getDate();
      };

      // Unified Calendar Week Generator (Sunday - Saturday, Majority rule)
      const getTrueWeekRangeLabel = (year, monthStr, weekIdx, lang) => {
        const monthMap = {
          "Jan": 0, "Feb": 1, "Mrz": 2, "Apr": 3, "Mai": 4, "Jun": 5,
          "Jul": 6, "Aug": 7, "Sep": 8, "Okt": 9, "Nov": 10, "Dez": 11
        };
        const mIdx = monthMap[monthStr] !== undefined ? monthMap[monthStr] : 5;
        const firstOfMonth = new Date(year, mIdx, 1);
        const dayOfW = firstOfMonth.getDay(); // 0 = Sun, 1 = Mon ... 6 = Sat
        
        // Find Sunday of the week containing the 1st of the month
        const sundayOfFirstWeek = new Date(firstOfMonth);
        sundayOfFirstWeek.setDate(firstOfMonth.getDate() - dayOfW);
        
        // Majority Rule: How many days of this week fall in selected month?
        const daysOfCurrentMonthInFirstWeek = 7 - dayOfW;
        
        const startOfWeek1 = new Date(sundayOfFirstWeek);
        if (daysOfCurrentMonthInFirstWeek < 4) {
          // Less than 4 days in target month -> Starts on next Sunday
          startOfWeek1.setDate(sundayOfFirstWeek.getDate() + 7);
        }
        
        const startOfCurrentWeek = new Date(startOfWeek1);
        startOfCurrentWeek.setDate(startOfWeek1.getDate() + (weekIdx * 7));
        
        const endOfCurrentWeek = new Date(startOfCurrentWeek);
        endOfCurrentWeek.setDate(startOfCurrentWeek.getDate() + 6);
        
        const formatDayMonth = (dateObj) => {
          const d = dateObj.getDate();
          const mVal = dateObj.getMonth();
          const monthsShortDE = ["Jan", "Feb", "Mrz", "Apr", "Mai", "Jun", "Jul", "Aug", "Sep", "Okt", "Nov", "Dez"];
          const monthsShortEN = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
          const mLabel = lang === 'de' ? monthsShortDE[mVal] : monthsShortEN[mVal];
          return lang === 'de' ? `${d}. ${mLabel}` : `${mLabel} ${d}`;
        };
        
        return `${formatDayMonth(startOfCurrentWeek)} - ${formatDayMonth(endOfCurrentWeek)}`;
      };

      // Compact Calendar Weeks (Sunday - Saturday)
      const getTrueWeekRangeLabelCompact = (year, monthStr, weekIdx) => {
        const monthMap = {
          "Jan": 0, "Feb": 1, "Mrz": 2, "Apr": 3, "Mai": 4, "Jun": 5,
          "Jul": 6, "Aug": 7, "Sep": 8, "Okt": 9, "Nov": 10, "Dez": 11
        };
        const mIdx = monthMap[monthStr] !== undefined ? monthMap[monthStr] : 5;
        const firstOfMonth = new Date(year, mIdx, 1);
        const dayOfW = firstOfMonth.getDay();
        const offset = dayOfW;
        
        const sundayOfFirstWeek = new Date(firstOfMonth);
        sundayOfFirstWeek.setDate(firstOfMonth.getDate() - offset);
        
        const daysOfCurrentMonthInFirstWeek = 7 - dayOfW;
        const startOfWeek1 = new Date(sundayOfFirstWeek);
        if (daysOfCurrentMonthInFirstWeek < 4) {
          startOfWeek1.setDate(sundayOfFirstWeek.getDate() + 7);
        }
        
        const startOfCurrentWeek = new Date(startOfWeek1);
        startOfCurrentWeek.setDate(startOfWeek1.getDate() + (weekIdx * 7));
        
        const endOfCurrentWeek = new Date(startOfCurrentWeek);
        endOfCurrentWeek.setDate(startOfCurrentWeek.getDate() + 6);

        const startD = startOfCurrentWeek.getDate();
        const startM = startOfCurrentWeek.getMonth() + 1;
        const endD = endOfCurrentWeek.getDate();
        const endM = endOfCurrentWeek.getMonth() + 1;

        return `${startD}/${startM}-${endD}/${endM}`;
      };

      useEffect(() => {
        safeSetStorage('budget_hide_zeroes', hideZeroes ? 'true' : 'false');
      }, [hideZeroes]);

      useEffect(() => {

          rootEl.setAttribute('data-theme', resolvedTheme);

          else rootEl.classList.remove('dark');

        applyTheme(theme);

            if (resolved === 'dark') rootEl.classList.add('dark');

      const annualOverviewData = useMemo(() => {
        const yearValues = data.values[selectedYear];
        const monthsForYear = getMonthsForYear(selectedYear);
        const totalsByCategory = {};
        let totalYearlyIn = 0; let totalYearlyEx = 0;
        const monthTotals = {};

        data.categories.expenses.forEach(category => { totalsByCategory[category] = 0; });
        monthsForYear.forEach(m => {
          let mIn = 0; let mEx = 0;
          data.categories.incomes.forEach(category => { const val = getSafeValue('incomes', category, selectedYear, m); totalYearlyIn += val; mIn += val; });
          data.categories.expenses.forEach(category => { const val = getSafeValue('expenses', category, selectedYear, m); totalYearlyEx += val; totalsByCategory[category] += val; mEx += val; });
          monthTotals[m] = { income: mIn, expenses: mEx };
        });

        const sortedExpenses = Object.keys(totalsByCategory).map(cat => ({ category: cat, total: totalsByCategory[cat] })).sort((a, b) => b.total - a.total);
        const peakCategory = sortedExpenses[0]?.total > 0 ? sortedExpenses[0].category : null;
        let highestMonth = null; let maxMonthEx = 0;
        monthsForYear.forEach(m => { if (monthTotals[m].expenses > maxMonthEx) { maxMonthEx = monthTotals[m].expenses; highestMonth = m; } });
        const savingsRate = totalYearlyIn > 0 ? ((totalYearlyIn - totalYearlyEx) / totalYearlyIn) * 100 : 0;
        return { totalYearlyIn, totalYearlyEx, sortedExpenses, peakCategory, highestMonth, savingsRate, monthTotals };

      const triggerLocalToCloudSync = async () => {

          if (queueItem) {

            const doc = await docRef.get();
            if (!doc.exists || queueItem.updatedAt > doc.data().updatedAt) await docRef.set({ payload: queueItem.payload, updatedAt: queueItem.updatedAt });
            await IDB.delete('queue', 'pending_sync');

      const saveStateAndDispatch = async (updatedData, timestamp) => {

        await IDB.set('queue', { id: 'pending_sync', payload: updatedData, updatedAt: timestamp });
        if (navigator.onLine && db) {
          setSyncStatus("syncing");
          try { await db.collection('monthly_logs').doc('house_finanzen_state').set({ payload: updatedData, updatedAt: timestamp }); await IDB.delete('queue', 'pending_sync'); setSyncStatus("synced"); }
          catch (e) { setSyncStatus("pending_sync"); }
        } else {
          setSyncStatus("pending_sync");
          if ('serviceWorker' in navigator && 'SyncManager' in window) {
            const reg = await navigator.serviceWorker.ready;
            try { await reg.sync.register('sync-budget'); } catch (err) { }
          }
        }

      const handleValueChange = async (type, posten, month, val) => {
        const parsedValue = val === '' ? 0 : parseFloat(val);
        const updatedVal = isNaN(parsedValue) ? 0 : parsedValue;
        const updatedData = { ...data };
        if (!updatedData.values[selectedYear]) updatedData.values[selectedYear] = { incomes: {}, expenses: {} };
        if (!updatedData.values[selectedYear][type][posten]) updatedData.values[selectedYear][type][posten] = {};
        
        const currentVal = updatedData.values[selectedYear][type][posten][month];
        if (typeof currentVal === 'object' && currentVal !== null) {
          updatedData.values[selectedYear][type][posten][month] = {
            w1: updatedVal, w2: 0, w3: 0, w4: 0, w5: 0, total: updatedVal
          };
        } else {
          updatedData.values[selectedYear][type][posten][month] = updatedVal;
        }
        await saveStateAndDispatch(updatedData, Date.now());
      };

      const handleWeeklyValueChange = async (type, posten, month, weekKey, val) => {
        const parsed = val === '' ? 0 : parseFloat(val);
        const num = isNaN(parsed) ? 0 : parsed;
        
        const updatedData = { ...data };
        if (!updatedData.values[selectedYear]) updatedData.values[selectedYear] = { incomes: {}, expenses: {} };
        if (!updatedData.values[selectedYear][type][posten]) updatedData.values[selectedYear][type][posten] = {};
        
        let currentVal = updatedData.values[selectedYear][type][posten][month];
        let weeks = { w1: 0, w2: 0, w3: 0, w4: 0, w5: 0 };
        
        if (typeof currentVal === 'object' && currentVal !== null) {
          weeks = { ...currentVal };
        } else if (typeof currentVal === 'number') {
          weeks.w1 = currentVal;
        }
        
        weeks[weekKey] = num;
        weeks.total = weeks.w1 + weeks.w2 + weeks.w3 + weeks.w4 + weeks.w5;
        
        updatedData.values[selectedYear][type][posten][month] = weeks;
        await saveStateAndDispatch(updatedData, Date.now());

      const handleToggleCategoryMode = async (type, item) => {
        const updatedData = { ...data };
        if (!updatedData.categoryModes) updatedData.categoryModes = {};
        const currentMode = updatedData.categoryModes[item] || (type === 'incomes' ? 'fixed' : 'variable');
        const newMode = currentMode === 'fixed' ? 'variable' : 'fixed';
        
        updatedData.categoryModes[item] = newMode;
        
        // Convert structures safely to avoid data loss
        const monthVal = updatedData.values[selectedYear]?.[type]?.[item]?.[selectedMonth];
        if (newMode === 'variable' && typeof monthVal === 'number') {
          updatedData.values[selectedYear][type][item][selectedMonth] = {
            w1: monthVal, w2: 0, w3: 0, w4: 0, w5: 0, total: monthVal
          };
        } else if (newMode === 'fixed' && typeof monthVal === 'object' && monthVal !== null) {
          updatedData.values[selectedYear][type][item][selectedMonth] = getSafeValue(type, item, selectedYear, selectedMonth);
        }

        await saveStateAndDispatch(updatedData, Date.now());
      };

      const handlePaymentDayChange = async (item, val) => {

        const day = isNaN(parsed) ? "" : Math.max(1, Math.min(31, parsed));
        
        const updatedData = { ...data };
        if (!updatedData.fixedPaymentDays) updatedData.fixedPaymentDays = {};

      const handleAddCategory = async (type, name, inputSetter) => {

        const trimmedName = name.trim();
        if (data.categories[type].includes(trimmedName)) { alert(t('duplicateCategoryAlert')); return; }
        
        const updatedCategories = { ...data.categories, [type]: [...data.categories[type], trimmedName] };
        const updatedValues = { ...data.values };
        const updatedCategoryModes = { ...data.categoryModes || {} };
        
        updatedCategoryModes[trimmedName] = type === 'incomes' ? 'fixed' : 'variable';

        Object.keys(updatedValues).forEach(y => {
          if (!updatedValues[y][type][trimmedName]) updatedValues[y][type][trimmedName] = {};
          getMonthsForYear(parseInt(y)).forEach(m => { if (updatedValues[y][type][trimmedName][m] === undefined) updatedValues[y][type][trimmedName][m] = 0; });

        inputSetter("");

          fixedPaymentDays: data.fixedPaymentDays || {}
        }, Date.now());

      const handleApplyRecurring = async (type, item, startMonth, startYear, monthsCount, value) => {
        const updatedData = { ...data };
        const timeline = [];
        [2026, 2027, 2028].forEach(yr => { getMonthsForYear(yr).forEach(mo => { timeline.push({ year: yr, month: mo }); }); });
        const startIndex = timeline.findIndex(t => t.year === parseInt(startYear) && t.month === startMonth);
        if (startIndex !== -1) {
          for (let i = 0; i < monthsCount; i++) {
            const targetIndex = startIndex + i;
            if (targetIndex < timeline.length) {
              const { year, month } = timeline[targetIndex];
              if (!updatedData.values[year]) updatedData.values[year] = { incomes: {}, expenses: {} };
              if (!updatedData.values[year][type][item]) updatedData.values[year][type][item] = {};
              
              const currentVal = updatedData.values[year][type][item][month];
              if (typeof currentVal === 'object' && currentVal !== null) {
                updatedData.values[year][type][item][month] = {
                  w1: value, w2: 0, w3: 0, w4: 0, w5: 0, total: value
                };

                updatedData.values[year][type][item][month] = value;
              }
            }
          }

        await saveStateAndDispatch(updatedData, Date.now());

      const handleMoveCategory = async (type, index, direction) => {
        const updatedData = { ...data };
        const categories = [...updatedData.categories[type]];
        if (direction === 'up' && index > 0) { const temp = categories[index]; categories[index] = categories[index - 1]; categories[index - 1] = temp; }
        else if (direction === 'down' && index < categories.length - 1) { const temp = categories[index]; categories[index] = categories[index + 1]; categories[index + 1] = temp; }
        else return;
        updatedData.categories[type] = categories;
        await saveStateAndDispatch(updatedData, Date.now());
      };

      // Native Grouped Drag & Drop Handlers (to keep categories clean inside their Fixed/Variable stacked lists)
      const handleDragStart = (e, idx, type) => {
        setDraggedItem({ index: idx, type: type });
        e.dataTransfer.effectAllowed = "move";
      };

      const handleDragOver = (e) => {
        e.preventDefault();
      };

      const handleGroupedDrop = async (e, targetIdxInGroup, type, isFixed) => {
        e.preventDefault();
        if (!draggedItem || draggedItem.type !== type) return;

        const updatedData = { ...data };
        const masterCategories = [...updatedData.categories[type]];
        
        // Extract indices and names belonging to this specific group
        const groupItems = masterCategories.filter(cat => {
          const mode = data.categoryModes?.[cat] || (type === 'incomes' ? 'fixed' : 'variable');
          return (mode === 'fixed') === isFixed;
        });

        // Find the absolute index of our dragged element in the master list
        const draggedCatName = masterCategories[draggedItem.index];
        const draggedIdxInGroup = groupItems.indexOf(draggedCatName);

        if (draggedIdxInGroup === -1 || draggedIdxInGroup === targetIdxInGroup) return;

        // Splice and reorder inside the group
        const [removed] = groupItems.splice(draggedIdxInGroup, 1);
        groupItems.splice(targetIdxInGroup, 0, removed);

        // Map back to master array preserving order of other categories
        let groupCounter = 0;
        const reassembled = masterCategories.map(cat => {
          const mode = data.categoryModes?.[cat] || (type === 'incomes' ? 'fixed' : 'variable');
          if ((mode === 'fixed') === isFixed) {
            const newItem = groupItems[groupCounter];
            groupCounter++;
            return newItem;
          }
          return cat;
        });

        updatedData.categories[type] = reassembled;
        await saveStateAndDispatch(updatedData, Date.now());
        setDraggedItem(null);
      };

        setDraggedItem(null);

      const handleSaveRenameInModal = async (type, originalName, newName) => {

        if (updatedData.categoryModes && updatedData.categoryModes[originalName]) {
          updatedData.categoryModes[trimmed] = updatedData.categoryModes[originalName];
          delete updatedData.categoryModes[originalName];

        if (updatedData.fixedPaymentDays && updatedData.fixedPaymentDays[originalName]) {
          updatedData.fixedPaymentDays[trimmed] = updatedData.fixedPaymentDays[originalName];
          delete updatedData.fixedPaymentDays[originalName];
        }

        Object.keys(updatedData.values).forEach(year => {
          const yearValues = updatedData.values[year]?.[type];
          if (yearValues && yearValues[originalName]) { yearValues[trimmed] = { ...yearValues[originalName] }; delete yearValues[originalName]; }

        if (!window.confirm(t('deleteConfirmation').replace('{{name}}', cleanName))) return;

          if (yearVals) { 
            Object.keys(yearVals).forEach(month => {

            }); 
          } 
        });

        if (hasData) {
          Object.keys(updatedData.values).forEach(year => {
            if (!updatedData.values[year][type][fallbackKey]) { updatedData.values[year][type][fallbackKey] = {}; getMonthsForYear(parseInt(year)).forEach(m => { updatedData.values[year][type][fallbackKey][m] = 0; }); }
            getMonthsForYear(parseInt(year)).forEach(m => { 
              const currentFallback = getSafeValue(type, fallbackKey, year, m);
              const incomingVal = getSafeValue(type, item, year, m);
              updatedData.values[year][type][fallbackKey][m] = currentFallback + incomingVal; 
            });
          });
        }
        updatedData.categories[type] = updatedData.categories[type].filter(cat => cat !== item);
        Object.keys(updatedData.values).forEach(year => { if (updatedData.values[year]?.[type]) delete updatedData.values[year][type][item]; });
        if (updatedData.categoryModes) delete updatedData.categoryModes[item];
        if (updatedData.fixedPaymentDays) delete updatedData.fixedPaymentDays[item];
        
        await saveStateAndDispatch(updatedData, Date.now());
        setActiveEditCategory(null);

                          type="text" 
                          value={editCategoryValue} 
                          onChange={(e) => setEditCategoryValue(e.target.value)}
                          onBlur={() => handleSaveRenameInModal(type, item, editCategoryValue)}
                          className="w-full bg-theme-input border border-theme rounded-xl px-3 py-2.5 text-sm font-semibold text-theme-input outline-none focus:border-indigo-500 transition" 
                        />
                      </div>

                      {/* Bracket Choice - only for expenses */}
                      {type === 'expenses' && (
                        <div className="space-y-2">
                          <label className="text-xs font-bold text-theme-muted uppercase tracking-wider">{t('bracketLabel')}</label>
                          <select
                            value={data.categoryOverrides?.[item] || "auto"}
                            onChange={(e) => { const v = e.target.value === "auto" ? null : e.target.value; saveStateAndDispatch({ ...data, categoryOverrides: { ...(data.categoryOverrides || {}), [item]: v } }, Date.now()); }}
                            className="w-full bg-theme-input border border-theme text-theme-main rounded-xl px-3 py-2.5 text-sm font-semibold outline-none focus:border-indigo-500 transition"
                          >
                            <option value="auto">Auto 🤖</option>
                            <option value="housing">{t('bracketHousing')} 🏠</option>
                            <option value="living">{t('bracketLiving')} 🍎</option>
                            <option value="subscriptions">{t('bracketSubscriptions')} 🎟️</option>
                            <option value="leisure">{t('bracketLeisure')} 🎭</option>
                            <option value="professional">{t('bracketProfessional')} 🎓</option>
                          </select>
                        </div>
                      )}

                      {/* Classification Selection */}
                      <div className="space-y-2">
                        <label className="text-xs font-bold text-theme-muted uppercase tracking-wider block">{t('classificationLabel')}</label>
                        <div className="grid grid-cols-2 gap-3">
                          <button
                            type="button"
                            onClick={() => { if (isVariable) handleToggleCategoryMode(type, item); }}
                            className={`p-4 rounded-xl border text-left flex flex-col justify-between h-24 transition ${!isVariable ? 'border-indigo-500 bg-indigo-500/5' : 'border-theme hover:border-theme-main'}`}
                          >
                            <span className="text-lg">🏢</span>
                            <div>
                              <span className="font-bold text-sm block text-theme-main">
                                {type === 'incomes' ? t('fixedIncomeType') : t('fixedExpenseType')}
                              </span>
                              <span className="text-[10px] text-theme-muted">Regelmäßige Buchung</span>
                            </div>
                          </button>

                          <button
                            type="button"
                            onClick={() => { if (!isVariable) handleToggleCategoryMode(type, item); }}
                            className={`p-4 rounded-xl border text-left flex flex-col justify-between h-24 transition ${isVariable ? 'border-indigo-500 bg-indigo-500/5' : 'border-theme hover:border-theme-main'}`}
                          >
                            <span className="text-lg">🛒</span>
                            <div>
                              <span className="font-bold text-sm block text-theme-main">
                                {type === 'incomes' ? t('variableIncomeType') : t('variableExpenseType')}
                              </span>
                              <span className="text-[10px] text-theme-muted">Fluktuative Buchung</span>
                            </div>
                          </button>
                        </div>
                      </div>

                      {/* Numerical inputs */}
                      {!isVariable ? (
                        <div className="space-y-4 pt-4 border-t border-theme">
                          <div className="grid grid-cols-2 gap-4">
                            <div className="space-y-2">
                              <label className="text-xs font-bold text-theme-muted uppercase tracking-wider block">
                                {type === 'incomes' ? 'Betrag pro Monat (€)' : t('valueLabel')}
                              </label>
                              <input 
                                type="number" 
                                step="any"
                                value={val !== 0 ? val : ""} 
                                placeholder="0"
                                onChange={(e) => handleValueChange(type, item, selectedMonth, e.target.value)}
                                className="w-full bg-theme-input border border-theme rounded-xl px-3 py-2.5 text-sm font-semibold text-theme-input outline-none focus:border-indigo-500 text-right transition" 
                              />
                            </div>
                            
                            <div className="space-y-2">
                              <label className="text-xs font-bold text-theme-muted uppercase tracking-wider block">{t('paymentDayLabel')}</label>
                              <input 
                                type="number" 
                                min="1"
                                max="31"
                                value={paymentDay || ""}
                                placeholder="1 - 31"
                                onChange={(e) => handlePaymentDayChange(item, e.target.value)}
                                className="w-full bg-theme-input border border-theme rounded-xl px-3 py-2.5 text-sm font-semibold text-theme-input outline-none focus:border-indigo-500 text-right transition" 
                              />
                            </div>
                          </div>
                        </div>
                      ) : (
                        <div className="space-y-4 pt-4 border-t border-theme">
                          <div className="flex justify-between items-center mb-1">
                            <label className="text-xs font-bold text-theme-muted uppercase tracking-wider">{t('weeksLabel')}</label>
                            <span className="text-xs font-bold text-theme-main bg-theme-header px-2 py-1 rounded-lg">
                              Summe: <span className="text-indigo-500">{formatCurrency(val)}</span>
                            </span>
                          </div>

                          <div className="space-y-3">
                            {['w1', 'w2', 'w3', 'w4', 'w5'].map((wk, wIdx) => {
                              const wVal = getWeeklyVal(type, item, selectedYear, selectedMonth, wk);
                              const weekDateLabel = getTrueWeekRangeLabel(selectedYear, selectedMonth, wIdx, i18n.language);
                              return (
                                <div key={wk} className="bg-theme-main/50 p-3 rounded-xl border border-theme flex items-center justify-between gap-4">
                                  <div className="min-w-0">
                                    <span className="text-xs font-bold block text-theme-main">{t('week')} {wIdx + 1}</span>
                                    <span className="text-[11px] text-theme-muted mt-0.5 block">{weekDateLabel}</span>
                                  </div>
                                  <input 
                                    type="number"
                                    step="any"
                                    value={wVal !== 0 ? wVal : ""}
                                    placeholder="0"
                                    onChange={(e) => handleWeeklyValueChange(type, item, selectedMonth, wk, e.target.value)}
                                    className="w-28 bg-theme-input border border-theme rounded-lg px-2 py-1.5 text-sm font-semibold text-right outline-none focus:border-indigo-500 text-theme-input"
                                  />
                                </div>
                              );
                            })}
                          </div>
                        </div>
                      )}
                    </div>
                  </div>

                  {/* Footer actions */}
                  <div className="p-5 border-t border-theme bg-theme-header flex flex-col gap-3">
                    <button 
                      onClick={() => { setActiveEditCategory(null); setEditCategoryValue(""); }}
                      className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl text-sm transition shadow-lg shadow-indigo-600/10 flex items-center justify-center gap-1"
                    >
                      <i className="fa-solid fa-circle-check"></i> {t('saveClose')}
                    </button>
                    
                    <button 
                      onClick={() => handleDeleteCategory(type, item)}
                      className="w-full bg-rose-500/10 hover:bg-rose-500/20 text-rose-500 font-bold py-2.5 rounded-xl text-xs transition border border-rose-500/10 flex items-center justify-center gap-1.5"
                    >
                      <i className="fa-solid fa-trash-can"></i> {t('deleteCategoryBtn')}
                    </button>
                  </div>
                </div>
              </div>
            );
          })()}

        </div>
      );
    }

    function App() { return <LanguageProvider><MainAppContent /></LanguageProvider>; }
    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then(async (reg) => {
            if ('SyncManager' in window) try { await reg.sync.register('sync-budget'); } catch (e) { }
          }).catch(err => console.error('SW registration error:', err));
      });
    }
  </script>
</body>
</html>
