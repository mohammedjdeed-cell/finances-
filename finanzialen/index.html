        return new Promise((resolve, reject) => {
          const request = indexedDB.open(this.dbName, this.dbVersion);
          request.onupgradeneeded = (e) => {
            const database = e.target.result;
            if (!database.objectStoreNames.contains('state')) database.createObjectStore('state', { keyPath: 'id' });
            if (!database.objectStoreNames.contains('queue')) database.createObjectStore('queue', { keyPath: 'id' });
          };
          request.onsuccess = (e) => resolve(e.target.result);

        const database = await this.open();
        return new Promise((resolve, reject) => {
          const tx = database.transaction(storeName, 'readonly');
          const request = tx.objectStore(storeName).get(key);
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
        });
      },

        const database = await this.open();
        return new Promise((resolve, reject) => {

      const chronologicalTimelineResult = useMemo(() => {
        const resultSequence = {};

        const targetSequence = [];
        [2026, 2027, 2028].forEach(yr => { getMonthsForYear(yr).forEach(mo => { targetSequence.push({ year: yr, month: mo }); }); });

        targetSequence.forEach(({ year, month }) => {
          const yearData = data.values[year];

            if (yearData.expenses) data.categories.expenses.forEach(category => { monthlyEx += getSafeValue('expenses', category, year, month); });
          }
          const availableFunds = runningGuthaben + monthlyIn;
          const endLeftover = availableFunds - monthlyEx;
          resultSequence[`${year}-${month}`] = { availableFunds, leftover: endLeftover, monthlyIncome: monthlyIn, monthlyExpenses: monthlyEx, prevGuthaben: runningGuthaben };

      const getMonthlyTotal = (type, targetMonth) => {

      const getBracketMonthlyTotal = (bracketKey, month) => {
        if (!data.values[selectedYear]) return 0;
        return data.categories.expenses.filter(posten => getExpenseBracket(posten, data.categoryOverrides) === bracketKey).reduce((sum, posten) => sum + getSafeValue('expenses', posten, selectedYear, month), 0);
      };

      const totalIncome = useMemo(() => getMonthlyTotal('incomes', selectedMonth), [data, selectedMonth, selectedYear]);
      const totalExpenses = useMemo(() => getMonthlyTotal('expenses', selectedMonth), [data, selectedMonth, selectedYear]);
      const saldo = useMemo(() => totalIncome - totalExpenses, [totalIncome, totalExpenses]);
      const percentageSpent = useMemo(() => totalIncome === 0 ? 0 : (totalExpenses / totalIncome) * 100, [totalIncome, totalExpenses]);
      const activeLiquidityResult = useMemo(() => chronologicalTimelineResult[`${selectedYear}-${selectedMonth}`] || { leftover: 0 }, [chronologicalTimelineResult, selectedYear, selectedMonth]);

      // 🧠 Smart Forecast Engine (Money Manager Logik + One-Time Exclusion)
      const smartForecast = useMemo(() => {
        if (selectedMonth === "AnnualOverview") return null;

        const fixedExpensesTotal = data.categories.expenses
          .filter(cat => (data.categoryModes?.[cat] || 'variable') === 'fixed' && !data.categoryOneTime?.[cat])
          .reduce((sum, cat) => sum + getSafeValue('expenses', cat, selectedYear, selectedMonth), 0);

        let variableSpentSoFar = 0;
        let loggedWeeksCount = 0;
        const weeks = ['w1', 'w2', 'w3', 'w4', 'w5'];

        data.categories.expenses.forEach(cat => {
          if ((data.categoryModes?.[cat] || 'variable') === 'variable' && !data.categoryOneTime?.[cat]) {
            weeks.forEach((wk, idx) => {
              const val = getWeeklyVal('expenses', cat, selectedYear, selectedMonth, wk);
              if (val > 0 && idx + 1 > loggedWeeksCount) loggedWeeksCount = idx + 1;
              variableSpentSoFar += val;
            });
          }
        });

        const oneTimeTotal = data.categories.expenses
          .filter(cat => data.categoryOneTime?.[cat])
          .reduce((sum, cat) => sum + getSafeValue('expenses', cat, selectedYear, selectedMonth), 0);

        const effectiveWeeks = Math.max(1, loggedWeeksCount);
        const weeklyBurnRate = variableSpentSoFar / effectiveWeeks;
        const remainingWeeks = Math.max(0, 4.33 - effectiveWeeks);
        const projectedVariableSpend = variableSpentSoFar + (weeklyBurnRate * remainingWeeks);
        const projectedTotalMonthExpenses = fixedExpensesTotal + projectedVariableSpend + oneTimeTotal;

        const totalDaysInMonth = getDaysInMonth(selectedYear, selectedMonth);
        const daysElapsed = Math.min(totalDaysInMonth, effectiveWeeks * 7);
        const daysRemaining = Math.max(1, totalDaysInMonth - daysElapsed);
        const availableDiscretionary = Math.max(0, totalIncome - fixedExpensesTotal - variableSpentSoFar - oneTimeTotal);
        const safeDailyAllowance = availableDiscretionary / daysRemaining;

        const currentLiquidCash = (activeLiquidityResult.leftover || 5000) - totalPendingIouAmount;
        const monthlyDeficit = projectedTotalMonthExpenses - totalIncome;
        let runwayMonths = Infinity;
        if (monthlyDeficit > 0) runwayMonths = currentLiquidCash / monthlyDeficit;

        let needsTotal = 0; let wantsTotal = 0; let goalsTotal = 0;
        data.categories.expenses.forEach(cat => {
          const bracket = getExpenseBracket(cat, data.categoryOverrides);
          const val = getSafeValue('expenses', cat, selectedYear, selectedMonth);
          if (bracket === 'housing' || bracket === 'living') needsTotal += val;
          else if (bracket === 'subscriptions' || bracket === 'leisure') wantsTotal += val;
          else if (bracket === 'professional') goalsTotal += val;
        });

        const effectiveIncome = totalIncome > 0 ? totalIncome : 1;
        return {
          projectedTotalMonthExpenses,
          safeDailyAllowance,
          runwayMonths: runwayMonths === Infinity ? "12+" : runwayMonths.toFixed(1),
          runwayStatus: runwayMonths < 3 ? 'critical' : runwayMonths < 6 ? 'warning' : 'healthy',
          needsPct: Math.min(100, (needsTotal / effectiveIncome) * 100),
          wantsPct: Math.min(100, (wantsTotal / effectiveIncome) * 100),
          goalsPct: Math.min(100, (goalsTotal / effectiveIncome) * 100)
        };
      }, [data, selectedMonth, selectedYear, totalIncome, activeLiquidityResult, totalPendingIouAmount]);

      // 🍩 Annual Overview Doughnut Ring
      const annualOverviewData = useMemo(() => {
        const yearValues = data.values[selectedYear];

        const totalsByCategory = {};
        let totalYearlyIn = 0; let totalYearlyEx = 0;
        const monthTotals = {};

        monthsForYear.forEach(m => {

        if (typeof currentVal === 'object' && currentVal !== null) {
          updatedData.values[selectedYear][type][posten][month] = { w1: updatedVal, w2: 0, w3: 0, w4: 0, w5: 0, total: updatedVal };
        } else {
          updatedData.values[selectedYear][type][posten][month] = updatedVal;
        }
        await saveStateAndDispatch(updatedData, Date.now());
      };

      const handleWeeklyValueChange = async (type, posten, month, weekKey, val) => {
        const parsed = val === '' ? 0 : parseFloat(val);
        const num = isNaN(parsed) ? 0 : parsed;
        const updatedData = { ...data };
        if (!updatedData.values[selectedYear]) updatedData.values[selectedYear] = { incomes: {}, expenses: {} };
        if (!updatedData.values[selectedYear][type][posten]) updatedData.values[selectedYear][type][posten] = {};
        
        let currentVal = updatedData.values[selectedYear][type][posten][month];
        let weeks = { w1: 0, w2: 0, w3: 0, w4: 0, w5: 0 };
        if (typeof currentVal === 'object' && currentVal !== null) weeks = { ...currentVal };
        else if (typeof currentVal === 'number') weeks.w1 = currentVal;
        
        weeks[weekKey] = num;
        weeks.total = weeks.w1 + weeks.w2 + weeks.w3 + weeks.w4 + weeks.w5;
        updatedData.values[selectedYear][type][posten][month] = weeks;
        await saveStateAndDispatch(updatedData, Date.now());
      };

      const handleToggleCategoryMode = async (type, item) => {
        const updatedData = { ...data };
        if (!updatedData.categoryModes) updatedData.categoryModes = {};
        const currentMode = updatedData.categoryModes[item] || (type === 'incomes' ? 'fixed' : 'variable');
        const newMode = currentMode === 'fixed' ? 'variable' : 'fixed';
        updatedData.categoryModes[item] = newMode;
        
        const monthVal = updatedData.values[selectedYear]?.[type]?.[item]?.[selectedMonth];
        if (newMode === 'variable' && typeof monthVal === 'number') {
          updatedData.values[selectedYear][type][item][selectedMonth] = { w1: monthVal, w2: 0, w3: 0, w4: 0, w5: 0, total: monthVal };
        } else if (newMode === 'fixed' && typeof monthVal === 'object' && monthVal !== null) {
          updatedData.values[selectedYear][type][item][selectedMonth] = getSafeValue(type, item, selectedYear, selectedMonth);
        }
        await saveStateAndDispatch(updatedData, Date.now());

      const handlePaymentDayChange = async (item, val) => {
        const parsed = parseInt(val);
        const day = isNaN(parsed) ? "" : Math.max(1, Math.min(31, parsed));
        const updatedData = { ...data };
        if (!updatedData.fixedPaymentDays) updatedData.fixedPaymentDays = {};
        updatedData.fixedPaymentDays[item] = day;
        await saveStateAndDispatch(updatedData, Date.now());

      const handleAddCategoryAdaptive = async (type, name, inputSetter) => {
        if (!name.trim()) return;
        const trimmedName = name.trim();
        if (data.categories[type].includes(trimmedName)) { alert(t('duplicateCategoryAlert')); return; }
        
        const auto = autoClassifyCategory(trimmedName);
        const updatedCategories = { ...data.categories, [type]: [...data.categories[type], trimmedName] };
        const updatedValues = { ...data.values };
        const updatedCategoryModes = { ...data.categoryModes, [trimmedName]: type === 'incomes' ? 'fixed' : auto.mode };
        const updatedCategoryOverrides = { ...data.categoryOverrides, [trimmedName]: auto.bracket };
        const updatedCategoryOneTime = { ...data.categoryOneTime, [trimmedName]: auto.isOneTime };

        Object.keys(updatedValues).forEach(y => {
          if (!updatedValues[y][type][trimmedName]) updatedValues[y][type][trimmedName] = {};
          getMonthsForYear(parseInt(y)).forEach(m => { if (updatedValues[y][type][trimmedName][m] === undefined) updatedValues[y][type][trimmedName][m] = 0; });
        });
        inputSetter("");
        await saveStateAndDispatch({ 
          categories: updatedCategories, 
          values: updatedValues, 
          categoryModes: updatedCategoryModes,
          categoryOverrides: updatedCategoryOverrides,
          categoryOneTime: updatedCategoryOneTime,
          fixedPaymentDays: data.fixedPaymentDays || {},
          ious: data.ious || []
        }, Date.now());
      };

      const handleApplyRecurring = async (type, item, startMonth, startYear, monthsCount, value) => {
        const updatedData = { ...data };
        const timeline = [];
        [2026, 2027, 2028].forEach(yr => { getMonthsForYear(yr).forEach(mo => { timeline.push({ year: yr, month: mo }); }); });
        const startIndex = timeline.findIndex(t => t.year === parseInt(startYear) && t.month === startMonth);
        if (startIndex !== -1) {
          for (let i = 0; i < monthsCount; i++) {
            const targetIndex = startIndex + i;
            if (targetIndex < timeline.length) {
              const { year, month } = timeline[targetIndex];
              if (!updatedData.values[year]) updatedData.values[year] = { incomes: {}, expenses: {} };
              if (!updatedData.values[year][type][item]) updatedData.values[year][type][item] = {};
              
              const currentVal = updatedData.values[year][type][item][month];
              if (typeof currentVal === 'object' && currentVal !== null) {
                updatedData.values[year][type][item][month] = { w1: value, w2: 0, w3: 0, w4: 0, w5: 0, total: value };
              } else {
                updatedData.values[year][type][item][month] = value;
              }
            }
          }
        }
        await saveStateAndDispatch(updatedData, Date.now());
      };

      const handleDragStart = (e, idx, type) => { setDraggedItem({ index: idx, type: type }); e.dataTransfer.effectAllowed = "move"; };
      const handleDragOver = (e) => { e.preventDefault(); };
      const handleGroupedDrop = async (e, targetIdxInGroup, type, isFixed) => {
        e.preventDefault();
        if (!draggedItem || draggedItem.type !== type) return;

        const updatedData = { ...data };
        const masterCategories = [...updatedData.categories[type]];
        const groupItems = masterCategories.filter(cat => {
          const mode = data.categoryModes?.[cat] || (type === 'incomes' ? 'fixed' : 'variable');
          return (mode === 'fixed') === isFixed;
        });

        const draggedCatName = masterCategories[draggedItem.index];
        const draggedIdxInGroup = groupItems.indexOf(draggedCatName);
        if (draggedIdxInGroup === -1 || draggedIdxInGroup === targetIdxInGroup) return;

        const [removed] = groupItems.splice(draggedIdxInGroup, 1);
        groupItems.splice(targetIdxInGroup, 0, removed);

        let groupCounter = 0;
        const reassembled = masterCategories.map(cat => {
          const mode = data.categoryModes?.[cat] || (type === 'incomes' ? 'fixed' : 'variable');
          if ((mode === 'fixed') === isFixed) {
            const newItem = groupItems[groupCounter];
            groupCounter++;
            return newItem;
          }
          return cat;
        });

        updatedData.categories[type] = reassembled;
        await saveStateAndDispatch(updatedData, Date.now());
        setDraggedItem(null);
      };

        const trimmed = newName.trim();

        if (data.categories[type].includes(trimmed)) { alert(t('duplicateCategoryAlert')); return; }
        
        const updatedData = { ...data };
        updatedData.categories[type] = updatedData.categories[type].map(cat => cat === originalName ? trimmed : cat);
        if (updatedData.categoryModes && updatedData.categoryModes[originalName]) { updatedData.categoryModes[trimmed] = updatedData.categoryModes[originalName]; delete updatedData.categoryModes[originalName]; }
        if (updatedData.fixedPaymentDays && updatedData.fixedPaymentDays[originalName]) { updatedData.fixedPaymentDays[trimmed] = updatedData.fixedPaymentDays[originalName]; delete updatedData.fixedPaymentDays[originalName]; }
        if (updatedData.categoryOneTime && updatedData.categoryOneTime[originalName] !== undefined) { updatedData.categoryOneTime[trimmed] = updatedData.categoryOneTime[originalName]; delete updatedData.categoryOneTime[originalName]; }
        if (updatedData.categoryOverrides && updatedData.categoryOverrides[originalName]) { updatedData.categoryOverrides[trimmed] = updatedData.categoryOverrides[originalName]; delete updatedData.categoryOverrides[originalName]; }

        Object.keys(updatedData.values).forEach(year => {
          const yearValues = updatedData.values[year]?.[type];
          if (yearValues && yearValues[originalName]) { yearValues[trimmed] = { ...yearValues[originalName] }; delete yearValues[originalName]; }
        });

        await saveStateAndDispatch(updatedData, Date.now());
        if (activeEditCategory && activeEditCategory.item === originalName) { setActiveEditCategory({ ...activeEditCategory, item: trimmed }); }
      };

      const handleDeleteCategory = async (type, item) => {
        const key = t(`categories.${item}`);

        if (!window.confirm(t('deleteConfirmation').replace('{{name}}', cleanName))) return;
        const updatedData = { ...data };
        const fallbackKey = "Sonstiges";
        let hasData = false;
        
        Object.keys(updatedData.values).forEach(year => {

          if (yearVals) { Object.keys(yearVals).forEach(month => { if (getSafeValue(type, item, year, month) !== 0) hasData = true; }); }

                      <div className="p-3 bg-theme-footer border-t border-theme flex gap-2">
                        <input type="text" value={customExpenseInput} onChange={(e) => setCustomExpenseInput(e.target.value)} placeholder={t('addPlaceholder')} className="flex-grow bg-theme-input border border-theme text-theme-input rounded-xl px-3 py-1.5 text-xs outline-none" />
                        <button onClick={() => handleAddCategoryAdaptive('expenses', customExpenseInput, setCustomExpenseInput)} className="bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-4 py-2 rounded-xl font-bold">Add</button>
                      </div>
                    )}
                  </section>

                </div>
              </div>
            )}
          </main>

          {/* RECURRING MODAL */}
          {recurringSetup && (
            <div className="fixed inset-0 bg-slate-950/60 z-[60] backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-theme-card rounded-2xl border border-theme p-6 max-w-sm w-full shadow-2xl space-y-4">
                <div className="flex justify-between items-center pb-2 border-b border-theme">
                  <h3 className="font-bold text-theme-main text-sm flex items-center gap-1.5"><i className="fa-solid fa-arrows-spin text-indigo-500"></i> {t('setRecurringBudget')}</h3>
                  <button onClick={() => setRecurringSetup(null)} className="text-theme-muted hover:text-rose-500"><i className="fa-solid fa-xmark"></i></button>
                </div>
                <p className="text-xs text-theme-muted capitalize">{t('categories.' + recurringSetup.item).replace('categories.', '')}: <span className="font-bold text-theme-main">{formatCurrency(recurringSetup.value)}</span></p>
                <div className="space-y-2">
                  <label className="text-xs font-bold text-theme-muted uppercase">{t('durationInMonths')}</label>
                  <select value={recurringMonths} onChange={(e) => setRecurringMonths(parseInt(e.target.value))} className="w-full bg-theme-input border border-theme rounded-lg px-3 py-2 text-sm text-theme-main outline-none">
                    <option value={3}>3 {i18n.language === 'de' ? 'Monate' : 'months'}</option>
                    <option value={6}>6 {i18n.language === 'de' ? 'Monate' : 'months'}</option>
                    <option value={12}>12 {i18n.language === 'de' ? 'Monate' : 'months'}</option>
                  </select>
                </div>
                <div className="flex gap-2 pt-2">
                  <button onClick={() => setRecurringSetup(null)} className="flex-1 bg-theme-header border border-theme text-theme-main font-bold py-2 rounded-lg text-xs">Cancel</button>
                  <button onClick={async () => { await handleApplyRecurring(recurringSetup.type, recurringSetup.item, selectedMonth, selectedYear, recurringMonths, recurringSetup.value); setRecurringSetup(null); }} className="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2 rounded-lg text-xs">Apply</button>
                </div>
              </div>
            </div>
          )}

          {/* EDIT DRAWER */}
          {activeEditCategory && (() => {
            const { type, item } = activeEditCategory;
            const categoryMode = data.categoryModes?.[item] || (type === 'incomes' ? 'fixed' : 'variable');
            const isVariable = categoryMode === 'variable';
            const isOneTime = !!data.categoryOneTime?.[item];
            const paymentDay = data.fixedPaymentDays?.[item];
            const val = getSafeValue(type, item, selectedYear, selectedMonth);

            return (
              <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex justify-end transition-opacity">
                <div className="bg-theme-card border-l border-theme w-full max-w-lg h-full shadow-2xl p-6 overflow-y-auto flex flex-col justify-between animate-slideLeft">
                  <div className="space-y-6">
                    <div className="flex justify-between items-center pb-4 border-b border-theme">
                      <h3 className="text-lg font-bold text-theme-main flex items-center gap-2"><i className="fa-solid fa-sliders text-indigo-500"></i> {t('editorTitle')}</h3>
                      <button onClick={() => { setActiveEditCategory(null); setEditCategoryValue(""); }} className="text-theme-muted hover:text-rose-500"><i className="fa-solid fa-xmark text-lg"></i></button>
                    </div>

                    <div className="space-y-4">
                      <div>
                        <label className="text-xs font-bold text-theme-muted uppercase tracking-wider">{t('posten')}</label>
                        <input type="text" value={editCategoryValue} onChange={(e) => setEditCategoryValue(e.target.value)} onBlur={() => handleSaveRenameInModal(type, item, editCategoryValue)} className="w-full bg-theme-input border border-theme rounded-xl px-3 py-2.5 text-sm font-semibold text-theme-input outline-none focus:border-indigo-500" />
                      </div>

                      {/* ONE TIME TOGGLE */}
                      <div className="flex items-center justify-between p-3 bg-theme-main/50 rounded-xl border border-theme">
                        <div>
                          <span className="font-bold text-xs text-theme-main block">One-Time Big Payment</span>
                          <span className="text-[10px] text-theme-muted">{t('isOneTimeLabel')}</span>
                        </div>
                        <input 
                          type="checkbox" 
                          checked={isOneTime} 
                          onChange={(e) => saveStateAndDispatch({ ...data, categoryOneTime: { ...data.categoryOneTime, [item]: e.target.checked } }, Date.now())}
                          className="w-4 h-4 text-indigo-600 rounded"
                        />
                      </div>

                      {type === 'expenses' && (
                        <div>
                          <label className="text-xs font-bold text-theme-muted uppercase tracking-wider">{t('bracketLabel')}</label>
                          <select value={data.categoryOverrides?.[item] || "auto"} onChange={(e) => { const v = e.target.value === "auto" ? null : e.target.value; saveStateAndDispatch({ ...data, categoryOverrides: { ...(data.categoryOverrides || {}), [item]: v } }, Date.now()); }} className="w-full bg-theme-input border border-theme text-theme-main rounded-xl px-3 py-2.5 text-sm font-semibold outline-none">
                            <option value="auto">Auto 🤖</option>
                            <option value="housing">{t('bracketHousing')} 🏠</option>
                            <option value="living">{t('bracketLiving')} 🍎</option>
                            <option value="subscriptions">{t('bracketSubscriptions')} 🎟️</option>
                            <option value="leisure">{t('bracketLeisure')} 🎭</option>
                            <option value="professional">{t('bracketProfessional')} 🎓</option>
                          </select>
                        </div>
                      )}

                      <div>
                        <label className="text-xs font-bold text-theme-muted uppercase tracking-wider block">{t('classificationLabel')}</label>
                        <div className="grid grid-cols-2 gap-3 mt-1">
                          <button type="button" onClick={() => { if (isVariable) handleToggleCategoryMode(type, item); }} className={`p-4 rounded-xl border text-left flex flex-col justify-between h-24 transition ${!isVariable ? 'border-indigo-500 bg-indigo-500/5' : 'border-theme'}`}>
                            <span className="text-lg">🏢</span>
                            <span className="font-bold text-sm block text-theme-main">{type === 'incomes' ? t('fixedIncomeType') : t('fixedExpenseType')}</span>
                          </button>
                          <button type="button" onClick={() => { if (!isVariable) handleToggleCategoryMode(type, item); }} className={`p-4 rounded-xl border text-left flex flex-col justify-between h-24 transition ${isVariable ? 'border-indigo-500 bg-indigo-500/5' : 'border-theme'}`}>
                            <span className="text-lg">🛒</span>
                            <span className="font-bold text-sm block text-theme-main">{type === 'incomes' ? t('variableIncomeType') : t('variableExpenseType')}</span>
                          </button>
                        </div>
                      </div>

                      {!isVariable ? (
                        <div className="grid grid-cols-2 gap-4 pt-2 border-t border-theme">
                          <div>
                            <label className="text-xs font-bold text-theme-muted uppercase">{t('valueLabel')}</label>
                            <input type="number" step="any" value={val !== 0 ? val : ""} placeholder="0" onChange={(e) => handleValueChange(type, item, selectedMonth, e.target.value)} className="w-full bg-theme-input border border-theme rounded-xl px-3 py-2 text-sm font-semibold text-right outline-none" />
                          </div>
                          <div>
                            <label className="text-xs font-bold text-theme-muted uppercase">{t('paymentDayLabel')}</label>
                            <input type="number" min="1" max="31" value={paymentDay || ""} placeholder="1 - 31" onChange={(e) => handlePaymentDayChange(item, e.target.value)} className="w-full bg-theme-input border border-theme rounded-xl px-3 py-2 text-sm font-semibold text-right outline-none" />
                          </div>
                        </div>
                      ) : (
                        <div className="space-y-3 pt-2 border-t border-theme">
                          <label className="text-xs font-bold text-theme-muted uppercase">{t('weeksLabel')}</label>
                          {['w1', 'w2', 'w3', 'w4', 'w5'].map((wk, wIdx) => {
                            const wVal = getWeeklyVal(type, item, selectedYear, selectedMonth, wk);
                            return (
                              <div key={wk} className="bg-theme-main/50 p-2.5 rounded-xl border border-theme flex items-center justify-between">
                                <div>
                                  <span className="text-xs font-bold block text-theme-main">{t('week')} {wIdx + 1}</span>
                                  <span className="text-[11px] text-theme-muted">{getMoneyManagerWeekLabel(selectedYear, selectedMonth, wIdx)}</span>
                                </div>
                                <input type="number" step="any" value={wVal !== 0 ? wVal : ""} placeholder="0" onChange={(e) => handleWeeklyValueChange(type, item, selectedMonth, wk, e.target.value)} className="w-28 bg-theme-input border border-theme rounded-lg px-2 py-1.5 text-sm font-semibold text-right outline-none" />
                              </div>
                            );
                          })}
                        </div>
                      )}
                    </div>
                  </div>

                  <div className="p-5 border-t border-theme bg-theme-header flex flex-col gap-3">
                    <button onClick={() => { setActiveEditCategory(null); setEditCategoryValue(""); }} className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl text-sm transition">
                      <i className="fa-solid fa-circle-check mr-1"></i> {t('saveClose')}
                    </button>
                    <button onClick={() => handleDeleteCategory(type, item)} className="w-full bg-rose-500/10 text-rose-500 font-bold py-2 rounded-xl text-xs transition border border-rose-500/20">
                      <i className="fa-solid fa-trash-can mr-1"></i> {t('deleteCategoryBtn')}
                    </button>
                  </div>
                </div>
              </div>
            );
          })()}

        </div>
      );
    }

    function App() { return <LanguageProvider><MainAppContent /></LanguageProvider>; }
    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then(async (reg) => {
            if ('SyncManager' in window) try { await reg.sync.register('sync-budget'); } catch (e) { }
          }).catch(err => console.error('SW registration error:', err));
      });
    }
  </script>
</body>
</html>
