    const LanguageContext = createContext();
    function LanguageProvider({ children }) {
      const [lang, setLang] = useState(() => safeGetStorage('budget_app_lang', 'de'));
      const changeLanguage = (newLang) => { setLang(newLang); safeSetStorage('budget_app_lang', newLang); };
      const t = (path, params = {}) => {
        const keys = path.split('.');
        let res = translations[lang];
        for (const k of keys) {
          if (res && res[k] !== undefined) res = res[k];
          else { res = translations['en']?.[path] || path; break; }
        }
        if (typeof res === 'string') {
          Object.keys(params).forEach(p => {
            res = res.replace(new RegExp(`{{${p}}}`, 'g'), params[p]);
          });
        }
        return res;
      };
      return <LanguageContext.Provider value={{ t, lang, changeLanguage }}>{children}</LanguageContext.Provider>;
    }
    const useTranslation = () => useContext(LanguageContext);

    // IndexedDB Layer for safe offline caching
    const IDB = {
      dbName: 'LiquidEngine_v7',
      open() {
        return new Promise((resolve, reject) => {
          const request = indexedDB.open(this.dbName, 1);
          request.onupgradeneeded = (e) => {
            const database = e.target.result;
            if (!database.objectStoreNames.contains('store')) database.createObjectStore('store', { keyPath: 'id' });
          };
          request.onsuccess = (e) => resolve(e.target.result);
          request.onerror = (e) => reject(e.target.error);
        });
      },
      async get(key) {
        try {
          const dbInstance = await this.open();
          return new Promise((resolve) => {
            const tx = dbInstance.transaction('store', 'readonly');
            const req = tx.objectStore('store').get(key);
            req.onsuccess = () => resolve(req.result?.data);
            req.onerror = () => resolve(null);
          });
        } catch (e) { return null; }
      },
      async set(key, val) {
        try {
          const dbInstance = await this.open();
          return new Promise((resolve, reject) => {
            const tx = dbInstance.transaction('store', 'readwrite');
            tx.objectStore('store').put({ id: key, data: val });
            tx.oncomplete = () => resolve();
            tx.onerror = () => reject(tx.error);
          });
        } catch (e) {}
      }
    };

    // Data normalizer: Smoothly migrates older 5-week structures ({w1, w2..}) or raw numbers to {budget, actual, asOfDate}
    const normalizeAndLockState = (loaded) => {
      const state = {
        startingCapital: typeof loaded?.startingCapital === 'number' ? loaded.startingCapital : 0,
        categories: {
          incomes: [...(loaded?.categories?.incomes || INITIAL_CATEGORIES.incomes)],
          expenses: [...(loaded?.categories?.expenses || INITIAL_CATEGORIES.expenses)]
        },
        categoryOverrides: { ...(loaded?.categoryOverrides || {}) },
        categoryModes: { ...(loaded?.categoryModes || {}) },
        fixedPaymentDays: { ...(loaded?.fixedPaymentDays || {}) },
        categoryOneTime: { ...(loaded?.categoryOneTime || { "Hause kaution": true, "FSP exam registration": true }) },
        ious: loaded?.ious || [],
        values: {}
      };

      // Ensure defaults
      state.categories.expenses.forEach(cat => {
        if (!state.categoryModes[cat]) state.categoryModes[cat] = autoClassifyCategory(cat).mode;
        if (state.categoryOneTime[cat] === undefined) state.categoryOneTime[cat] = autoClassifyCategory(cat).isOneTime;
      });
      state.categories.incomes.forEach(cat => {
        if (!state.categoryModes[cat]) state.categoryModes[cat] = (cat.includes("side") || cat.includes("Sonstiges")) ? 'variable' : 'fixed';
      });

      // Populate timeline 2026, 2027, 2028
      ["2026", "2027", "2028"].forEach(yearStr => {
        const yNum = parseInt(yearStr);
        state.values[yearStr] = { incomes: {}, expenses: {} };
        const months = getMonthsForYear(yNum);

        ['incomes', 'expenses'].forEach(type => {
          state.categories[type].forEach(cat => {
            state.values[yearStr][type][cat] = {};
            months.forEach(m => {
              const old = loaded?.values?.[yearStr]?.[type]?.[cat]?.[m];
              const monthDays = getDaysInMonth(yNum, m);

              if (typeof old === 'object' && old !== null) {
                // If it had the old w1..w5 format
                if (old.w1 !== undefined || old.w2 !== undefined || old.w3 !== undefined) {
                  const sumWeekly = (parseFloat(old.w1) || 0) + (parseFloat(old.w2) || 0) + (parseFloat(old.w3) || 0) + (parseFloat(old.w4) || 0) + (parseFloat(old.w5) || 0);
                  state.values[yearStr][type][cat][m] = {
                    budget: sumWeekly || 0,
                    actual: sumWeekly || 0,
                    asOfDate: monthDays
                  };
                } else {
                  state.values[yearStr][type][cat][m] = {
                    budget: typeof old.budget === 'number' ? old.budget : 0,
                    actual: typeof old.actual === 'number' ? old.actual : 0,
                    asOfDate: typeof old.asOfDate === 'number' ? old.asOfDate : monthDays
                  };
                }
              } else if (typeof old === 'number') {
                state.values[yearStr][type][cat][m] = {
                  budget: old,
                  actual: old,
                  asOfDate: monthDays
                };
              } else {
                state.values[yearStr][type][cat][m] = {
                  budget: 0,
                  actual: 0,
                  asOfDate: monthDays
                };
              }
            });
          });
        });
      });

      return state;
    };

    function MainApp() {
      const { t, lang, changeLanguage } = useTranslation();
      const [data, setData] = useState(() => normalizeAndLockState(null));
      const [selectedYear, setSelectedYear] = useState(2026);
      const [selectedMonth, setSelectedMonth] = useState("Jun");
      const [isOnline, setIsOnline] = useState(navigator.onLine);
      const [syncStatus, setSyncStatus] = useState("initialized");
      
      const [activeTab, setActiveTab] = useState("view"); // "view" | "edit"
      const [hideZeroes, setHideZeroes] = useState(() => safeGetStorage('budget_hide_zeroes', 'false') === 'true');
      const [isBurgerOpen, setIsBurgerOpen] = useState(false);
      const [theme, setTheme] = useState(() => safeGetStorage('budget_app_theme', 'dark'));

      // Modals
      const [activeEditCat, setActiveEditCat] = useState(null);
      const [editCatNameInput, setEditCatNameInput] = useState("");
      const [recurringModal, setRecurringModal] = useState(null);
      const [recurringCount, setRecurringCount] = useState(6);

      // Fast category adds
      const [newIncomeName, setNewIncomeName] = useState("");
      const [newExpenseName, setNewExpenseName] = useState("");

      // IOU form
      const [iouPerson, setIouPerson] = useState("");
      const [iouAmount, setIouAmount] = useState("");

      const [draggedInfo, setDraggedInfo] = useState(null);

      // Chart references
      const chartRef = useRef(null);
      const chartInstanceRef = useRef(null);
      const annualChartRef = useRef(null);
      const annualChartInstanceRef = useRef(null);
      const fileInputRef = useRef(null);

      // Theme handler
      useEffect(() => {
        safeSetStorage('budget_app_theme', theme);
        const root = document.documentElement;
        const resolved = theme === 'system' ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : theme;
        root.setAttribute('data-theme', resolved);
        if (resolved === 'dark') root.classList.add('dark');
        else root.classList.remove('dark');
      }, [theme]);

      // Hide zeroes persistence
      useEffect(() => {
        safeSetStorage('budget_hide_zeroes', hideZeroes ? 'true' : 'false');
      }, [hideZeroes]);

      // Network listener
      useEffect(() => {
        const setOn = () => setIsOnline(true);
        const setOff = () => setIsOnline(false);
        window.addEventListener('online', setOn);
        window.addEventListener('offline', setOff);
        return () => { window.removeEventListener('online', setOn); window.removeEventListener('offline', setOff); };
      }, []);

      // Load data & Firestore sync
      useEffect(() => {
        (async () => {
          const cached = await IDB.get('budget_state');
          if (cached) setData(normalizeAndLockState(cached));
        })();

        let unsubscribe = () => {};
        if (db) {
          unsubscribe = db.collection('monthly_logs').doc('house_finanzen_state').onSnapshot(async (doc) => {
            if (doc.exists) {
              const remote = doc.data();
              const merged = normalizeAndLockState(remote.payload);
              setData(merged);
              await IDB.set('budget_state', merged);
              setSyncStatus("synced");
            }
          }, () => setSyncStatus("offline"));
        }
        return () => unsubscribe();
      }, []);

      const saveStateAndDispatch = async (updated) => {
        setData(updated);
        await IDB.set('budget_state', updated);
        if (navigator.onLine && db) {
          setSyncStatus("syncing");
          try {
            await db.collection('monthly_logs').doc('house_finanzen_state').set({ payload: updated, updatedAt: Date.now() });
            setSyncStatus("synced");
          } catch (e) {
            setSyncStatus("pending_sync");
          }
        } else {
          setSyncStatus("offline");
        }
      };

      const formatCurrency = (val) => new Intl.NumberFormat(lang === 'de' ? 'de-DE' : 'en-US', {
        style: 'currency',
        currency: 'EUR',
        maximumFractionDigits: 0
      }).format(val || 0);

      // Safe Node Fetcher
      const getNode = (type, item, year, month) => {
        const n = data.values[year]?.[type]?.[item]?.[month];
        if (n && typeof n.budget === 'number') return n;
        return { budget: 0, actual: 0, asOfDate: getDaysInMonth(year, month) };
      };

      // Node mutator
      const handleUpdateNode = async (type, item, year, month, field, value) => {
        const updated = JSON.parse(JSON.stringify(data));
        if (!updated.values[year][type][item]) updated.values[year][type][item] = {};
        if (!updated.values[year][type][item][month]) {
          updated.values[year][type][item][month] = { budget: 0, actual: 0, asOfDate: getDaysInMonth(year, month) };
        }
        const numVal = parseFloat(value);
        updated.values[year][type][item][month][field] = isNaN(numVal) ? 0 : numVal;
        await saveStateAndDispatch(updated);
      };

      // 🧠 DYNAMIC FORWARD TIMELINE & CASHFLOW ENGINE
      // Computes realistic liquidity trajectory from starting capital forward
      const forwardTimeline = useMemo(() => {
        let runningBalance = data.startingCapital || 0;
        const timeline = [];
        const years = [2026, 2027, 2028];

        years.forEach(yr => {
          const months = getMonthsForYear(yr);
          months.forEach(m => {
            const daysInMonth = getDaysInMonth(yr, m);
            let monthBudgetIn = 0; let monthActualIn = 0;
            let monthBudgetEx = 0; let monthActualEx = 0;
            let projectedEndMonthEx = 0;

            // Incomes
            data.categories.incomes.forEach(cat => {
              const node = getNode('incomes', cat, yr, m);
              monthBudgetIn += node.budget;
              monthActualIn += node.actual;
            });

            // Expenses with Pacing Logic
            data.categories.expenses.forEach(cat => {
              const node = getNode('expenses', cat, yr, m);
              const mode = data.categoryModes[cat] || 'variable';
              const isOneTime = data.categoryOneTime[cat];
              monthBudgetEx += node.budget;
              monthActualEx += node.actual;

              if (mode === 'fixed' || isOneTime) {
                // Fixed or one-time payment: projected is actual if already paid, else budgeted commitment
                projectedEndMonthEx += (node.actual > 0 ? node.actual : node.budget);
              } else {
                // Variable expense: burn rate projection based on asOfDate
                const asOf = Math.min(daysInMonth, Math.max(1, node.asOfDate || daysInMonth));
                if (node.actual > 0) {
                  const dailyBurnRate = node.actual / asOf;
                  const remainingDays = Math.max(0, daysInMonth - asOf);
                  projectedEndMonthEx += (node.actual + (dailyBurnRate * remainingDays));
                } else {
                  projectedEndMonthEx += node.budget;
                }
              }
            });

            const effectiveIn = monthActualIn > 0 ? monthActualIn : monthBudgetIn;
            const actualNet = monthActualIn - monthActualEx;
            const projectedNet = effectiveIn - projectedEndMonthEx;

            // If actual expenses were entered, roll over using projectedNet, else use projected budget net
            const monthNetRollover = monthActualEx > 0 ? projectedNet : (monthBudgetIn - monthBudgetEx);
            const startBalance = runningBalance;
            runningBalance += monthNetRollover;

            timeline.push({
              year: yr,
              month: m,
              key: `${m} ${yr}`,
              daysInMonth,
              monthBudgetIn,
              monthActualIn,
              monthBudgetEx,
              monthActualEx,
              projectedEndMonthEx,
              actualNet,
              projectedNet,
              startBalance,
              endProjectedBalance: runningBalance
            });
          });
        });

        return timeline;
      }, [data]);

      // Current active month metrics
      const currentMonthMetrics = useMemo(() => {
        if (selectedMonth === "AnnualOverview") return forwardTimeline[0];
        const match = forwardTimeline.find(t => t.year === selectedYear && t.month === selectedMonth);
        return match || forwardTimeline[0];
      }, [forwardTimeline, selectedYear, selectedMonth]);

      // Category level detailed analytics for active month
      const currentCategoryAnalytics = useMemo(() => {
        if (selectedMonth === "AnnualOverview") return [];
        const daysInMonth = currentMonthMetrics.daysInMonth;

        return data.categories.expenses.map(cat => {
          const node = getNode('expenses', cat, selectedYear, selectedMonth);
          const mode = data.categoryModes[cat] || 'variable';
          const isOneTime = !!data.categoryOneTime[cat];
          const asOf = Math.min(daysInMonth, Math.max(1, node.asOfDate || daysInMonth));
          const daysLeft = Math.max(0, daysInMonth - asOf);

          const expectedPaceBenchmark = (node.budget / daysInMonth) * asOf;
          const remainingBudget = node.budget - node.actual;
          const safeDailySpend = daysLeft > 0 ? Math.max(0, remainingBudget / daysLeft) : 0;

          let paceStatus = "ontrack";
          if (mode === 'variable' && node.budget > 0) {
            if (node.actual > expectedPaceBenchmark * 1.1) paceStatus = "over";
            else if (node.actual < expectedPaceBenchmark * 0.85) paceStatus = "frugal";
          }

          let projectedCategoryTotal = node.budget;
          if (mode === 'fixed' || isOneTime) {
            projectedCategoryTotal = node.actual > 0 ? node.actual : node.budget;
          } else if (node.actual > 0) {
            projectedCategoryTotal = node.actual + ((node.actual / asOf) * daysLeft);
          }

          return {
            category: cat,
            budget: node.budget,
            actual: node.actual,
            asOfDate: asOf,
            daysLeft,
            remainingBudget,
            safeDailySpend,
            projectedCategoryTotal,
            paceStatus,
            bracket: data.categoryOverrides[cat] || autoClassifyCategory(cat).bracket,
            mode,
            isOneTime
          };
        });
      }, [data, selectedYear, selectedMonth, currentMonthMetrics]);

      // IOU Float
      const activePendingIous = useMemo(() => (data.ious || []).filter(i => !i.settled), [data.ious]);
      const totalPendingIou = useMemo(() => activePendingIous.reduce((sum, i) => sum + (parseFloat(i.amount) || 0), 0), [activePendingIous]);

      const handleAddIou = async () => {
        if (!iouPerson.trim() || !iouAmount || isNaN(parseFloat(iouAmount))) return;
        const newRecord = {
          id: 'iou_' + Date.now(),
          person: iouPerson.trim(),
          amount: parseFloat(iouAmount),
          date: new Date().toLocaleDateString(lang === 'de' ? 'de-DE' : 'en-US', { day: '2-digit', month: 'short' }),
          settled: false
        };
        const updated = { ...data, ious: [...(data.ious || []), newRecord] };
        setIouPerson("");
        setIouAmount("");
        await saveStateAndDispatch(updated);
      };

      const handleSettleIou = async (id) => {
        const updated = { ...data, ious: (data.ious || []).map(i => i.id === id ? { ...i, settled: true } : i) };
        await saveStateAndDispatch(updated);
      };

      // Monthly Bar Chart (Month view)
      useEffect(() => {
        if (selectedMonth === "AnnualOverview" || !chartRef.current) return;
        const ctx = chartRef.current.getContext('2d');
        if (chartInstanceRef.current) chartInstanceRef.current.destroy();

        const monthsForYear = getMonthsForYear(selectedYear);
        const translatedLabels = monthsForYear.map(m => t(`months.${m}`));
        const incomesData = monthsForYear.map(m => {
          return data.categories.incomes.reduce((s, cat) => s + getNode('incomes', cat, selectedYear, m).actual, 0);
        });

        const brackets = ['housing', 'living', 'subscriptions', 'leisure', 'professional'];
        const bracketColors = {
          housing: 'rgba(100, 116, 139, 0.85)',
          living: 'rgba(245, 158, 11, 0.85)',
          subscriptions: 'rgba(139, 92, 246, 0.85)',
          leisure: 'rgba(236, 72, 153, 0.85)',
          professional: 'rgba(20, 184, 166, 0.85)'
        };

        const datasets = [
          {
            label: t('incomesHeader'),
            data: incomesData,
            backgroundColor: 'rgba(16, 185, 129, 0.85)',
            stack: 'Stack0',
            borderRadius: 4
          },
          ...brackets.map(bKey => ({
            label: t(`bracket${bKey.charAt(0).toUpperCase() + bKey.slice(1)}`),
            data: monthsForYear.map(m => {
              return data.categories.expenses
                .filter(cat => (data.categoryOverrides[cat] || autoClassifyCategory(cat).bracket) === bKey)
                .reduce((s, cat) => s + getNode('expenses', cat, selectedYear, m).actual, 0);
            }),
            backgroundColor: bracketColors[bKey],
            stack: 'Stack1',
            borderRadius: 2
          }))
        ];

        const isDark = theme === 'dark';
        const axisColor = isDark ? '#94a3b8' : '#64748b';

        chartInstanceRef.current = new Chart(ctx, {
          type: 'bar',
          data: { labels: translatedLabels, datasets },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
              x: { ticks: { color: axisColor, font: { weight: '600', size: 10 } }, grid: { display: false } },
              y: { beginAtZero: true, ticks: { color: axisColor, font: { size: 10 }, callback: v => formatCurrency(v) }, grid: { color: isDark ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.05)' } }
            },
            plugins: {
              legend: { position: 'top', labels: { color: axisColor, usePointStyle: true, font: { size: 10, weight: 600 } } }
            }
          }
        });

        return () => { if (chartInstanceRef.current) chartInstanceRef.current.destroy(); };
      }, [data, selectedYear, selectedMonth, lang, theme]);

      // Annual Doughnut & Summary
      const annualData = useMemo(() => {
        const months = getMonthsForYear(selectedYear);
        let totalYearIn = 0; let totalYearEx = 0;
        const catTotals = {};
        const monthTotals = {};

        data.categories.expenses.forEach(cat => catTotals[cat] = 0);
        months.forEach(m => {
          let mIn = 0; let mEx = 0;
          data.categories.incomes.forEach(cat => {
            const v = getNode('incomes', cat, selectedYear, m).actual;
            totalYearIn += v; mIn += v;
          });
          data.categories.expenses.forEach(cat => {
            const v = getNode('expenses', cat, selectedYear, m).actual;
            totalYearEx += v; mEx += v;
            catTotals[cat] += v;
          });
          monthTotals[m] = { income: mIn, expenses: mEx, net: mIn - mEx };
        });

        const sortedExpenses = Object.keys(catTotals).map(c => ({ category: c, total: catTotals[c] })).sort((a, b) => b.total - a.total);
        const peakCategory = sortedExpenses[0]?.total > 0 ? sortedExpenses[0].category : null;
        let highestMonth = null; let maxEx = 0;
        months.forEach(m => {
          if (monthTotals[m].expenses > maxEx) { maxEx = monthTotals[m].expenses; highestMonth = m; }
        });
        const savingsRate = totalYearIn > 0 ? ((totalYearIn - totalYearEx) / totalYearIn) * 100 : 0;

        return { totalYearIn, totalYearEx, sortedExpenses, peakCategory, highestMonth, savingsRate, monthTotals };
      }, [data, selectedYear]);

      useEffect(() => {
        if (selectedMonth !== "AnnualOverview" || !annualChartRef.current) return;
        const ctx = annualChartRef.current.getContext('2d');
        if (annualChartInstanceRef.current) annualChartInstanceRef.current.destroy();

        const isDark = theme === 'dark';
        const topCats = annualData.sortedExpenses.filter(e => e.total > 0).slice(0, 7);
        const palette = ['#6366f1', '#ec4899', '#f59e0b', '#10b981', '#06b6d4', '#8b5cf6', '#64748b'];

        annualChartInstanceRef.current = new Chart(ctx, {
          type: 'doughnut',
          data: {
            labels: topCats.map(e => t(`categories.${e.category}`).replace('categories.', '')),
            datasets: [{
              data: topCats.map(e => e.total),
              backgroundColor: palette,
              borderWidth: 2,
              borderColor: isDark ? '#131b26' : '#ffffff'
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            cutout: '70%',
            plugins: {
              legend: { position: 'bottom', labels: { color: isDark ? '#94a3b8' : '#64748b', usePointStyle: true, font: { size: 11, weight: 600 } } }
            }
          }
        });

        return () => { if (annualChartInstanceRef.current) annualChartInstanceRef.current.destroy(); };
      }, [selectedMonth, annualData, lang, theme]);

      // Category Drag and Drop
      const handleDragStart = (e, index, type) => {
        setDraggedInfo({ index, type });
        e.dataTransfer.effectAllowed = "move";
      };
      const handleDragOver = (e) => e.preventDefault();
      const handleGroupedDrop = async (e, targetIdxInGroup, type, isFixed) => {
        e.preventDefault();
        if (!draggedInfo || draggedInfo.type !== type) return;

        const updated = { ...data };
        const masterList = [...updated.categories[type]];
        const groupItems = masterList.filter(cat => {
          const mode = data.categoryModes[cat] || (type === 'incomes' ? 'fixed' : 'variable');
          return (mode === 'fixed') === isFixed;
        });

        const draggedName = masterList[draggedInfo.index];
        const draggedIdxInGroup = groupItems.indexOf(draggedName);
        if (draggedIdxInGroup === -1 || draggedIdxInGroup === targetIdxInGroup) return;

        const [removed] = groupItems.splice(draggedIdxInGroup, 1);
        groupItems.splice(targetIdxInGroup, 0, removed);

        let groupCtr = 0;
        const reordered = masterList.map(cat => {
          const mode = data.categoryModes[cat] || (type === 'incomes' ? 'fixed' : 'variable');
          if ((mode === 'fixed') === isFixed) {
            const item = groupItems[groupCtr];
            groupCtr++;
            return item;
          }
          return cat;
        });

        updated.categories[type] = reordered;
        await saveStateAndDispatch(updated);
        setDraggedInfo(null);
      };

      // Add Category
      const handleAddCategory = async (type, name, setter) => {
        if (!name.trim()) return;
        const trimmed = name.trim();
        if (data.categories[type].includes(trimmed)) return alert(t('duplicateCategoryAlert'));

        const auto = autoClassifyCategory(trimmed);
        const updated = { ...data };
        updated.categories[type].push(trimmed);
        updated.categoryModes[trimmed] = type === 'incomes' ? 'fixed' : auto.mode;
        updated.categoryOverrides[trimmed] = auto.bracket;
        updated.categoryOneTime[trimmed] = auto.isOneTime;

        ["2026", "2027", "2028"].forEach(y => {
          if (!updated.values[y][type][trimmed]) updated.values[y][type][trimmed] = {};
          getMonthsForYear(parseInt(y)).forEach(m => {
            updated.values[y][type][trimmed][m] = { budget: 0, actual: 0, asOfDate: getDaysInMonth(parseInt(y), m) };
          });
        });

        setter("");
        await saveStateAndDispatch(updated);
      };

      // Delete Category
      const handleDeleteCategory = async (type, item) => {
        const cleanName = t(`categories.${item}`).replace('categories.', '');
        if (!confirm(t('deleteConfirmation', { name: cleanName }))) return;

        const updated = { ...data };
        updated.categories[type] = updated.categories[type].filter(c => c !== item);
        ["2026", "2027", "2028"].forEach(y => {
          if (updated.values[y]?.[type]?.[item]) delete updated.values[y][type][item];
        });
        delete updated.categoryModes[item];
        delete updated.categoryOverrides[item];
        delete updated.categoryOneTime[item];
        delete updated.fixedPaymentDays[item];

        await saveStateAndDispatch(updated);
        setActiveEditCat(null);
      };

      // Replicate Recurring Budget
      const handleApplyRecurring = async (type, item, startMonth, startYear, monthsCount, budgetVal) => {
        const updated = { ...data };
        const timeline = [];
        [2026, 2027, 2028].forEach(yr => { getMonthsForYear(yr).forEach(mo => timeline.push({ yr, mo })); });
        const startIdx = timeline.findIndex(t => t.yr === parseInt(startYear) && t.mo === startMonth);
        if (startIdx !== -1) {
          for (let i = 0; i < monthsCount; i++) {
            const target = timeline[startIdx + i];
            if (target) {
              const { yr, mo } = target;
              if (!updated.values[yr][type][item]) updated.values[yr][type][item] = {};
              const current = getNode(type, item, yr, mo);
              updated.values[yr][type][item][mo] = { ...current, budget: budgetVal };
            }
          }
        }
        await saveStateAndDispatch(updated);
      };

      return (
        <div className="flex flex-col min-h-screen">

          {/* HEADER */}
          <header className="bg-indigo-700 text-white sticky top-0 z-50 shadow-md h-14">
            <div className="max-w-7xl mx-auto px-4 h-full flex items-center justify-between">
              <div className="flex items-center space-x-2.5">
                <div className="w-8 h-8 rounded-lg bg-white/10 flex items-center justify-center text-white font-bold">
                  <i className="fa-solid fa-chart-line text-lg"></i>
                </div>
                <div>
                  <h1 className="text-base font-extrabold tracking-tight leading-none">{t('title')}</h1>
                  <span className="text-[10px] text-indigo-200 font-medium flex items-center gap-1 mt-0.5">
                    <span className={`w-1.5 h-1.5 rounded-full ${isOnline ? 'bg-emerald-400' : 'bg-rose-400'}`}></span>
                    {isOnline ? t('synced') : t('offline')}
                  </span>
                </div>
              </div>

              <div className="flex items-center space-x-2">
                <button onClick={() => changeLanguage(lang === 'de' ? 'en' : 'de')} className="text-xs font-bold px-2 py-1 rounded bg-indigo-800 text-white border border-indigo-600">
                  {lang.toUpperCase()}
                </button>
                <button onClick={() => setIsBurgerOpen(true)} className="w-9 h-9 rounded-lg hover:bg-indigo-600 transition flex items-center justify-center text-lg">
                  <i className="fa-solid fa-bars"></i>
                </button>
              </div>
            </div>
          </header>

          {/* MONTH NAVBAR */}
          <nav className="bg-theme-card border-b border-theme sticky top-14 z-40 shadow-sm">
            <div className="max-w-7xl mx-auto px-4 flex items-center justify-between overflow-x-auto scrollbar-none">
              <div className="flex items-center space-x-1 py-1">
                {[2026, 2027, 2028].map(yr => (
                  <button key={yr} onClick={() => setSelectedYear(yr)} className={`px-2.5 py-1 text-xs font-bold rounded-lg transition ${selectedYear === yr ? 'bg-indigo-600 text-white shadow-sm' : 'text-theme-muted hover:text-theme-main bg-theme-header/60'}`}>
                    {yr}
                  </button>
                ))}
              </div>

              <div className="h-4 w-[1px] bg-theme-border mx-2 shrink-0"></div>

              <div className="flex items-center overflow-x-auto scrollbar-none space-x-1 py-2">
                {getMonthsForYear(selectedYear).map(m => (
                  <button
                    key={m}
                    onClick={() => setSelectedMonth(m)}
                    className={`px-3 py-1.5 text-xs font-bold rounded-xl transition whitespace-nowrap ${selectedMonth === m ? 'bg-indigo-500/10 text-indigo-600 border border-indigo-500/30 font-black' : 'text-theme-muted hover:text-theme-main'}`}
                  >
                    {t(`months.${m}`)}
                  </button>
                ))}
                <button
                  onClick={() => setSelectedMonth("AnnualOverview")}
                  className={`px-3 py-1.5 text-xs font-bold rounded-xl transition whitespace-nowrap flex items-center gap-1.5 ${selectedMonth === "AnnualOverview" ? 'bg-indigo-600 text-white shadow-sm' : 'text-theme-muted hover:text-theme-main bg-theme-header/50'}`}
                >
                  <i className="fa-solid fa-compass"></i>
                  <span>{t('annualOverview')}</span>
                </button>
              </div>
            </div>
          </nav>

          {/* MAIN WORKSPACE */}
          <main className="max-w-7xl mx-auto w-full px-4 pt-5 pb-12 flex-grow space-y-6">

            {selectedMonth === "AnnualOverview" ? (
              /* ================== ANNUAL OVERVIEW & FORWARD RUNWAY ================== */
              <div className="space-y-6">
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  <div className="bg-theme-card border border-theme rounded-2xl p-5 flex items-center justify-between shadow-sm">
                    <div>
                      <p className="text-xs font-bold text-indigo-500 uppercase tracking-wider">{t('savingsRate')}</p>
                      <p className="text-3xl font-black text-theme-main mt-1">{annualData.savingsRate.toFixed(1)}%</p>
                    </div>
                    <div className="w-12 h-12 rounded-2xl bg-indigo-500/10 flex items-center justify-center text-indigo-500 text-xl font-bold">
                      %
                    </div>
                  </div>

                  <div className="bg-theme-card border border-theme rounded-2xl p-5 flex items-center justify-between shadow-sm">
                    <div>

                                    item.actual > 0 && (
                                      <button onClick={() => setRecurringModal({ type: 'expenses', item: item.category, value: item.actual })} className="text-theme-muted hover:text-indigo-500 p-1" title={t('setRecurringBudget')}>
                                        <i className="fa-solid fa-arrows-spin"></i>
                                      </button>
                                    )
                                  )}
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      </div>

                      {/* Variable Expenses (Plan vs Actual vs As-Of-Day) */}
                      <div>
                        <div className="flex justify-between items-center mb-2.5 border-b border-theme pb-1">
                          <h4 className="text-[11px] font-extrabold text-theme-muted uppercase tracking-wider flex items-center gap-1.5">
                            <i className="fa-solid fa-cart-shopping text-rose-500"></i> {t('variableExpenseType')}
                          </h4>
                          <span className="text-xs font-bold text-theme-main">
                            {formatCurrency(currentCategoryAnalytics.filter(c => c.mode === 'variable').reduce((s, c) => s + c.actual, 0))}
                          </span>
                        </div>

                        <div onDragOver={handleDragOver} onDrop={(e) => handleGroupedDrop(e, 0, 'expenses', false)} className="space-y-3">
                          {currentCategoryAnalytics.filter(c => c.mode === 'variable').map((item, idx) => {
                            if (hideZeroes && item.budget === 0 && item.actual === 0) return null;
                            const daysInMonth = currentMonthMetrics.daysInMonth;
                            const pctSpent = item.budget > 0 ? (item.actual / item.budget) * 100 : 0;
                            const pctTime = (item.asOfDate / daysInMonth) * 100;

                            return (
                              <div
                                key={item.category}
                                draggable={activeTab === 'edit'}
                                onDragStart={(e) => handleDragStart(e, data.categories.expenses.indexOf(item.category), 'expenses')}
                                onDragOver={handleDragOver}
                                onDrop={(e) => handleGroupedDrop(e, idx, 'expenses', false)}
                                className="p-3 bg-theme-main/50 border border-theme rounded-xl flex flex-col gap-2"
                              >
                                <div className="flex items-center justify-between gap-2">
                                  <div className="flex items-center gap-1.5 truncate flex-1">
                                    <span className="font-bold text-xs text-theme-main block truncate">{t(`categories.${item.category}`).replace('categories.', '')}</span>
                                    {item.paceStatus === 'over' ? (
                                      <span className="text-[9px] font-black px-1.5 py-0.5 rounded bg-rose-500/10 text-rose-500 border border-rose-500/20">{t('statusOver')}</span>
                                    ) : item.paceStatus === 'frugal' ? (
                                      <span className="text-[9px] font-black px-1.5 py-0.5 rounded bg-emerald-500/10 text-emerald-500 border border-emerald-500/20">{t('statusFrugal')}</span>
                                    ) : (
                                      <span className="text-[9px] font-bold px-1.5 py-0.5 rounded bg-theme-header text-theme-muted">{t('statusTrack')}</span>
                                    )}
                                  </div>

                                  {activeTab === 'edit' && (
                                    <button onClick={() => { setActiveEditCat({ type: 'expenses', cat: item.category }); setEditCatNameInput(item.category); }} className="text-xs text-theme-muted hover:text-indigo-500 p-1">
                                      <i className="fa-solid fa-gear"></i>
                                    </button>
                                  )}
                                </div>

                                {/* Plan & Actual Grid */}
                                <div className="grid grid-cols-2 gap-2">
                                  <div className="relative">
                                    <span className="text-[9px] font-bold text-theme-muted block mb-0.5">{t('planBudget')}</span>
                                    <input
                                      type="number"
                                      value={item.budget !== 0 ? item.budget : ""}
                                      placeholder="0"
                                      onChange={(e) => handleUpdateNode('expenses', item.category, selectedYear, selectedMonth, 'budget', e.target.value)}
                                      className="w-full bg-theme-input border border-theme text-theme-main text-xs font-black rounded-lg px-2 py-1.5 text-right outline-none focus:border-indigo-500"
                                    />
                                    <span className="absolute right-1.5 top-5 text-[10px] text-theme-muted pointer-events-none">€</span>
                                  </div>

                                  <div className="relative">
                                    <div className="flex justify-between items-center mb-0.5">
                                      <span className="text-[9px] font-bold text-theme-muted">{t('actualSpent')}</span>
                                      <div className="flex items-center gap-0.5 text-[9px] text-theme-muted font-bold" title={t('asOfDayLabel')}>
                                        <span>Tag</span>
                                        <input
                                          type="number"
                                          min="1"
                                          max={daysInMonth}
                                          value={item.asOfDate}
                                          onChange={(e) => handleUpdateNode('expenses', item.category, selectedYear, selectedMonth, 'asOfDate', Math.min(daysInMonth, Math.max(1, parseInt(e.target.value) || 1)))}
                                          className="w-6 text-center font-black bg-theme-header rounded text-theme-main outline-none"
                                        />
                                      </div>
                                    </div>
                                    <input
                                      type="number"
                                      value={item.actual !== 0 ? item.actual : ""}
                                      placeholder="0"
                                      onChange={(e) => handleUpdateNode('expenses', item.category, selectedYear, selectedMonth, 'actual', e.target.value)}
                                      className="w-full bg-theme-input border border-theme text-theme-main text-xs font-black rounded-lg px-2 py-1.5 text-right outline-none focus:border-rose-500"
                                    />
                                    <span className="absolute right-1.5 top-5 text-[10px] text-theme-muted pointer-events-none">€</span>
                                  </div>
                                </div>

                                {/* Dynamic Pacing & Safe Burn Line */}
                                <div className="flex justify-between items-center text-[10px] pt-1">
                                  <span className="font-bold text-theme-muted">
                                    {t('restBudget')}: <b className={item.remainingBudget >= 0 ? 'text-theme-main' : 'text-rose-500'}>{formatCurrency(item.remainingBudget)}</b>
                                  </span>
                                  <span className="font-semibold text-theme-muted">
                                    Safe: <b className="text-emerald-500">{formatCurrency(item.safeDailySpend)}/Tag</b> ({item.daysLeft}T)
                                  </span>
                                </div>

                                {/* Visual Progress Bar */}
                                {item.budget > 0 && (
                                  <div className="w-full bg-theme-header h-1.5 rounded-full overflow-hidden relative mt-0.5">
                                    <div
                                      className={`h-full transition-all duration-300 ${pctSpent > 100 ? 'bg-rose-500' : pctSpent > pctTime + 10 ? 'bg-amber-500' : 'bg-indigo-500'}`}
                                      style={{ width: `${Math.min(100, pctSpent)}%` }}
                                    ></div>
                                    <div
                                      className="absolute top-0 bottom-0 w-0.5 bg-theme-main z-10 opacity-70"
                                      style={{ left: `${Math.min(100, pctTime)}%` }}
                                      title={`Monatsfortschritt: ${pctTime.toFixed(0)}%`}
                                    ></div>
                                  </div>
                                )}
                              </div>
                            );
                          })}
                        </div>
                      </div>
                    </div>

                    {activeTab === 'edit' && (
                      <div className="p-3 bg-theme-footer border-t border-theme flex gap-2">
                        <input
                          type="text"
                          value={newExpenseName}
                          onChange={(e) => setNewExpenseName(e.target.value)}
                          placeholder={t('addPlaceholder')}
                          className="flex-1 bg-theme-input border border-theme text-theme-input rounded-xl px-3 py-1.5 text-xs outline-none"
                        />
                        <button onClick={() => handleAddCategory('expenses', newExpenseName, setNewExpenseName)} className="bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-3 py-1.5 rounded-xl text-xs">
                          + Add
                        </button>
                      </div>
                    )}
                  </section>

                </div>
              </div>
            )}
          </main>

          {/* EDIT CATEGORY MODAL DRAWER */}
          {activeEditCat && (() => {
            const { type, cat } = activeEditCat;
            const mode = data.categoryModes[cat] || (type === 'incomes' ? 'fixed' : 'variable');
            const isOneTime = !!data.categoryOneTime[cat];
            const pDay = data.fixedPaymentDays?.[cat];

            return (
              <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-sm z-50 flex justify-end">
                <div className="bg-theme-card border-l border-theme w-full max-w-sm h-full shadow-2xl p-6 overflow-y-auto flex flex-col justify-between animate-slideLeft">
                  <div className="space-y-6">
                    <div className="flex justify-between items-center pb-4 border-b border-theme">
                      <h3 className="font-extrabold text-base text-theme-main flex items-center gap-2">
                        <i className="fa-solid fa-sliders text-indigo-500"></i> {t('editorTitle')}
                      </h3>
                      <button onClick={() => setActiveEditCat(null)} className="text-theme-muted hover:text-rose-500">
                        <i className="fa-solid fa-xmark text-lg"></i>
                      </button>
                    </div>

                    <div className="space-y-4">
                      <div>
                        <label className="text-[10px] font-extrabold text-theme-muted uppercase tracking-wider block mb-1">{t('posten')}</label>
                        <input
                          type="text"
                          value={editCatNameInput}
                          onChange={(e) => setEditCatNameInput(e.target.value)}
                          onBlur={async () => {
                            const trimmed = editCatNameInput.trim();
                            if (!trimmed || trimmed === cat) return;
                            if (data.categories[type].includes(trimmed)) return alert(t('duplicateCategoryAlert'));
                            const updated = { ...data };
                            updated.categories[type] = updated.categories[type].map(c => c === cat ? trimmed : c);
                            if (updated.categoryModes[cat]) { updated.categoryModes[trimmed] = updated.categoryModes[cat]; delete updated.categoryModes[cat]; }
                            if (updated.categoryOverrides[cat]) { updated.categoryOverrides[trimmed] = updated.categoryOverrides[cat]; delete updated.categoryOverrides[cat]; }
                            if (updated.categoryOneTime[cat] !== undefined) { updated.categoryOneTime[trimmed] = updated.categoryOneTime[cat]; delete updated.categoryOneTime[cat]; }
                            if (updated.fixedPaymentDays[cat]) { updated.fixedPaymentDays[trimmed] = updated.fixedPaymentDays[cat]; delete updated.fixedPaymentDays[cat]; }
                            ["2026", "2027", "2028"].forEach(y => {
                              if (updated.values[y]?.[type]?.[cat]) {
                                updated.values[y][type][trimmed] = updated.values[y][type][cat];
                                delete updated.values[y][type][cat];
                              }
                            });
                            await saveStateAndDispatch(updated);
                            setActiveEditCat({ type, cat: trimmed });
                          }}
                          className="w-full bg-theme-input border border-theme text-theme-input font-bold rounded-xl px-3 py-2 text-sm outline-none focus:border-indigo-500"
                        />
                      </div>

                      {type === 'expenses' && (
                        <>
                          <div className="flex items-center justify-between p-3 bg-theme-header rounded-xl border border-theme">
                            <div>
                              <span className="font-bold text-xs text-theme-main block">Einmalige Sonderausgabe</span>
                              <span className="text-[10px] text-theme-muted">{t('isOneTimeLabel')}</span>
                            </div>
                            <input
                              type="checkbox"
                              checked={isOneTime}
                              onChange={(e) => {
                                const updated = { ...data, categoryOneTime: { ...data.categoryOneTime, [cat]: e.target.checked } };
                                saveStateAndDispatch(updated);
                              }}
                              className="w-4 h-4 text-indigo-600 rounded"
                            />
                          </div>

                          <div>
                            <label className="text-[10px] font-extrabold text-theme-muted uppercase tracking-wider block mb-1">{t('bracketLabel')}</label>
                            <select
                              value={data.categoryOverrides[cat] || "auto"}
                              onChange={(e) => {
                                const v = e.target.value === "auto" ? null : e.target.value;
                                saveStateAndDispatch({ ...data, categoryOverrides: { ...(data.categoryOverrides || {}), [cat]: v } });
                              }}
                              className="w-full bg-theme-input border border-theme text-theme-main rounded-xl px-3 py-2 text-xs font-bold outline-none"
                            >
                              <option value="auto">Auto 🤖</option>
                              <option value="housing">{t('bracketHousing')}</option>
                              <option value="living">{t('bracketLiving')}</option>
                              <option value="subscriptions">{t('bracketSubscriptions')}</option>
                              <option value="leisure">{t('bracketLeisure')}</option>
                              <option value="professional">{t('bracketProfessional')}</option>
                            </select>
                          </div>
                        </>
                      )}

                      <div>
                        <label className="text-[10px] font-extrabold text-theme-muted uppercase tracking-wider block mb-1">{t('classificationLabel')}</label>
                        <div className="grid grid-cols-2 gap-2">
                          <button
                            type="button"
                            onClick={() => {
                              const updated = { ...data, categoryModes: { ...data.categoryModes, [cat]: 'fixed' } };
                              saveStateAndDispatch(updated);
                            }}
                            className={`p-3 rounded-xl border text-center transition font-bold text-xs ${mode === 'fixed' ? 'border-indigo-500 bg-indigo-500/10 text-indigo-600' : 'border-theme text-theme-muted'}`}
                          >
                            {type === 'incomes' ? t('fixedIncomeType') : t('fixedExpenseType')}
                          </button>
                          <button
                            type="button"
                            onClick={() => {
                              const updated = { ...data, categoryModes: { ...data.categoryModes, [cat]: 'variable' } };
                              saveStateAndDispatch(updated);
                            }}
                            className={`p-3 rounded-xl border text-center transition font-bold text-xs ${mode === 'variable' ? 'border-indigo-500 bg-indigo-500/10 text-indigo-600' : 'border-theme text-theme-muted'}`}
                          >
                            {type === 'incomes' ? t('variableIncomeType') : t('variableExpenseType')}
                          </button>
                        </div>
                      </div>

                      {mode === 'fixed' && (
                        <div>
                          <label className="text-[10px] font-extrabold text-theme-muted uppercase tracking-wider block mb-1">{t('paymentDayLabel')}</label>
                          <input
                            type="number"
                            min="1"
                            max="31"
                            value={pDay || ""}
                            placeholder="1 - 31"
                            onChange={(e) => {
                              const day = parseInt(e.target.value);
                              const updated = { ...data, fixedPaymentDays: { ...(data.fixedPaymentDays || {}), [cat]: isNaN(day) ? null : day } };
                              saveStateAndDispatch(updated);
                            }}
                            className="w-full bg-theme-input border border-theme text-theme-main rounded-xl px-3 py-2 text-xs font-bold outline-none text-right"
                          />
                        </div>
                      )}
                    </div>
                  </div>

                  <div className="pt-4 border-t border-theme space-y-2">
                    <button onClick={() => setActiveEditCat(null)} className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 rounded-xl text-xs transition">
                      {t('saveClose')}
                    </button>
                    <button onClick={() => handleDeleteCategory(type, cat)} className="w-full text-rose-500 bg-rose-500/10 hover:bg-rose-500/20 py-2 rounded-xl text-xs font-bold border border-rose-500/20 transition">
                      {t('deleteCategoryBtn')}
                    </button>
                  </div>
                </div>
              </div>
            );
          })()}

          {/* RECURRING MODAL */}
          {recurringModal && (
            <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-theme-card border border-theme rounded-2xl max-w-sm w-full p-5 space-y-4 shadow-2xl">
                <div className="flex justify-between items-center border-b border-theme pb-2">
                  <h3 className="font-bold text-sm text-theme-main flex items-center gap-1.5">
                    <i className="fa-solid fa-arrows-spin text-indigo-500"></i> {t('setRecurringBudget')}
                  </h3>
                  <button onClick={() => setRecurringModal(null)} className="text-theme-muted hover:text-rose-500">
                    <i className="fa-solid fa-xmark"></i>
                  </button>
                </div>
                <p className="text-xs text-theme-muted">
                  {t(`categories.${recurringModal.item}`).replace('categories.', '')}: <b className="text-theme-main">{formatCurrency(recurringModal.value)}</b>
                </p>
                <div className="space-y-1">
                  <label className="text-[10px] font-extrabold text-theme-muted uppercase">{t('durationInMonths')}</label>
                  <select
                    value={recurringCount}
                    onChange={(e) => setRecurringCount(parseInt(e.target.value))}
                    className="w-full bg-theme-input border border-theme rounded-xl px-3 py-2 text-xs font-bold text-theme-main outline-none"
                  >
                    <option value={3}>3 Monate</option>
                    <option value={6}>6 Monate</option>
                    <option value={12}>12 Monate</option>
                  </select>
                </div>
                <div className="flex gap-2 pt-2">
                  <button onClick={() => setRecurringModal(null)} className="flex-1 bg-theme-header text-theme-main font-bold py-2 rounded-xl text-xs border border-theme">
                    {t('cancelBtn')}
                  </button>
                  <button
                    onClick={async () => {
                      await handleApplyRecurring(recurringModal.type, recurringModal.item, selectedMonth, selectedYear, recurringCount, recurringModal.value);
                      setRecurringModal(null);
                    }}
                    className="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2 rounded-xl text-xs"
                  >
                    {t('applyBtn')}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* SETTINGS / BURGER DRAWER */}
          {isBurgerOpen && (
            <div className="fixed inset-0 bg-slate-950/60 backdrop-blur-sm z-50 flex justify-end">
              <div className="bg-theme-card border-l border-theme w-80 h-full shadow-2xl p-5 overflow-y-auto flex flex-col justify-between animate-slideLeft">
                <div className="space-y-6">
                  <div className="flex justify-between items-center pb-3 border-b border-theme">
                    <h3 className="font-extrabold text-base text-theme-main flex items-center gap-2">
                      <i className="fa-solid fa-gear text-indigo-500"></i> {t('options')}
                    </h3>
                    <button onClick={() => setIsBurgerOpen(false)} className="text-theme-muted hover:text-rose-500">
                      <i className="fa-solid fa-xmark text-lg"></i>
                    </button>
                  </div>

                  {/* Starting Capital Config */}
                  <div className="space-y-1">
                    <p className="text-[10px] font-extrabold text-theme-muted uppercase tracking-wider">{t('startingCapital')}</p>
                    <div className="relative">
                      <input
                        type="number"
                        value={data.startingCapital !== 0 ? data.startingCapital : ""}
                        placeholder="0"
                        onChange={(e) => saveStateAndDispatch({ ...data, startingCapital: parseFloat(e.target.value) || 0 })}
                        className="w-full bg-theme-input border border-theme text-theme-main text-xs font-black rounded-xl px-3 py-2 text-right outline-none focus:border-indigo-500"
                      />
                      <span className="absolute right-2 top-2 text-xs text-theme-muted pointer-events-none">€</span>
                    </div>
                  </div>

                  {/* Theme */}
                  <div className="space-y-1 pt-3 border-t border-theme">
                    <p className="text-[10px] font-extrabold text-theme-muted uppercase tracking-wider">{t('themeLabel')}</p>
                    <div className="grid grid-cols-3 gap-1 bg-theme-header border border-theme rounded-xl p-1">
                      {['light', 'dark', 'system'].map(m => (
                        <button key={m} onClick={() => setTheme(m)} className={`py-1.5 rounded-lg text-[10px] font-bold transition ${theme === m ? 'bg-theme-card text-indigo-600 shadow-sm' : 'text-theme-muted hover:text-theme-main'}`}>
                          {t(`theme${m.charAt(0).toUpperCase() + m.slice(1)}`)}
                        </button>
                      ))}
                    </div>
                  </div>

                  {/* Language */}
                  <div className="space-y-1 pt-3 border-t border-theme">
                    <p className="text-[10px] font-extrabold text-theme-muted uppercase tracking-wider">{t('selectLanguage')}</p>
                    <div className="flex gap-2">
                      <button onClick={() => changeLanguage('de')} className={`flex-1 py-1.5 rounded-xl text-xs font-bold border transition ${lang === 'de' ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-theme-input text-theme-muted border-theme'}`}>Deutsch</button>
                      <button onClick={() => changeLanguage('en')} className={`flex-1 py-1.5 rounded-xl text-xs font-bold border transition ${lang === 'en' ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-theme-input text-theme-muted border-theme'}`}>English</button>
                    </div>
                  </div>

                  {/* Backup */}
                  <div className="space-y-2 pt-3 border-t border-theme">
                    <p className="text-[10px] font-extrabold text-theme-muted uppercase tracking-wider">{t('backupSection')}</p>
                    <button
                      onClick={() => {
                        const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
                        const a = document.createElement('a');
                        a.href = URL.createObjectURL(blob);
                        a.download = `finanzen_backup_${Date.now()}.json`;
                        a.click();
                      }}
                      className="w-full bg-indigo-500/10 text-indigo-600 border border-indigo-500/20 font-bold py-2 rounded-xl text-xs flex items-center justify-center gap-2"
                    >
                      <i className="fa-solid fa-download"></i> {t('exportBackup')}
                    </button>
                    <button onClick={() => fileInputRef.current?.click()} className="w-full bg-theme-header border border-theme text-theme-main font-bold py-2 rounded-xl text-xs flex items-center justify-center gap-2">
                      <i className="fa-solid fa-upload"></i> {t('importBackup')}
                    </button>
                    <input
                      ref={fileInputRef}
                      type="file"
                      accept=".json"
                      onChange={(e) => {
                        const file = e.target.files[0];
                        if (file) {
                          const reader = new FileReader();
                          reader.onload = async (ev) => {
                            try {
                              const parsed = JSON.parse(ev.target.result);
                              await saveStateAndDispatch(normalizeAndLockState(parsed));
                              alert(t('importSuccess'));
                              setIsBurgerOpen(false);
                            } catch (err) { alert(t('importError')); }
                          };
                          reader.readAsText(file);
                        }
                      }}
                      className="hidden"
                    />
                  </div>
                </div>

                <div className="pt-4 border-t border-theme">
                  <button
                    onClick={async () => {
                      if (confirm(t('confirmClear'))) {
                        await saveStateAndDispatch(normalizeAndLockState(null));
                        setIsBurgerOpen(false);
                      }
                    }}
                    className="text-xs text-rose-500 underline flex items-center gap-2 font-medium"
                  >
                    <i className="fa-solid fa-triangle-exclamation"></i> {t('clearAll')}
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<LanguageProvider><MainApp /></LanguageProvider>);
  </script>
</body>
</html>
